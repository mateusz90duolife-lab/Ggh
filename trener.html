}

/* ═══ POWIERZCHNIE POCHYŁE (LINIE NIEIZOMETRYCZNE) ═══
   Prostopadłościan ze ściętą krawędzią: profil — prostokąt z odciętym
   narożnikiem — wyciągnięty wzdłuż trzeciej osi. Bryła jest wypukła, więc
   do rysowania wystarcza odrzucenie ścian odwróconych od obserwatora.
   plane "front": profil w płaszczyźnie x–z (skos widać w rzucie z przodu);
   plane "side":  profil w płaszczyźnie y–z (skos widać w rzucie z boku).
   corner "far": narożnik po prawej (front) albo z tyłu (side); "near": po lewej / z przodu.
   a — długość odcięta w poziomie, b — w pionie, w jednostkach siatki. */

function wedgeId(sp) { return [sp.plane, sp.corner, sp.a, sp.b, sp.W, sp.D, sp.H].join(":"); }

function makeWedge(sp) {
  const Pw = sp.plane === "front" ? sp.W : sp.D, ext = sp.plane === "front" ? sp.D : sp.W, H = sp.H;
  const prof = sp.corner === "far"
    ? [[0, 0], [Pw, 0], [Pw, H - sp.b], [Pw - sp.a, H], [0, H]]
    : [[0, 0], [Pw, 0], [Pw, H], [sp.a, H], [0, H - sp.b]];
  const to3 = (p, e) => sp.plane === "front" ? [p[0], e, p[1]] : [e, p[0], p[1]];
  const faces = [prof.map(p => to3(p, 0)), prof.map(p => to3(p, ext))];
  for (let i = 0; i < prof.length; i++) {
    const p = prof[i], q = prof[(i + 1) % prof.length];
    faces.push([to3(p, 0), to3(q, 0), to3(q, ext), to3(p, ext)]);
  }
  const verts = faces[0].concat(faces[1]);
  const cen = [0, 1, 2].map(i => verts.reduce((s, v) => s + v[i], 0) / verts.length);
  const F = faces.map(pts => {
    // Normalna metodą Newella, zwrócona na zewnątrz względem środka bryły
    let n = [0, 0, 0];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      n[0] += (a[1] - b[1]) * (a[2] + b[2]); n[1] += (a[2] - b[2]) * (a[0] + b[0]); n[2] += (a[0] - b[0]) * (a[1] + b[1]);
    }
    const len = Math.hypot(n[0], n[1], n[2]); n = n.map(x => x / len);
    const fc = [0, 1, 2].map(i => pts.reduce((s, v) => s + v[i], 0) / pts.length);
    if ((fc[0] - cen[0]) * n[0] + (fc[1] - cen[1]) * n[1] + (fc[2] - cen[2]) * n[2] < 0) n = n.map(x => -x);
    return { pts: pts, n: n };
  });
  // Krawędzie z parami sąsiednich ścian
  const edges = new Map();
  const vk = v => v.join(",");
  F.forEach((f, fi) => f.pts.forEach((p, i) => {
    const q = f.pts[(i + 1) % f.pts.length];
    const k = vk(p) < vk(q) ? vk(p) + "|" + vk(q) : vk(q) + "|" + vk(p);
    if (!edges.has(k)) edges.set(k, { a: p, b: q, f: [] });
    edges.get(k).f.push(fi);
  }));
  return { isPoly: true, spec: sp, faces: F, edges: [...edges.values()], verts: verts, id: wedgeId(sp),
           nx: sp.W, ny: sp.D, nz: sp.H };
}

function describeWedge(sp) {
  return "prostopadłościan " + sp.W + " na " + sp.D + " na " + sp.H + " ze ściętą krawędzią; skos widoczny w rzucie " +
    (sp.plane === "front" ? "z przodu, narożnik " + (sp.corner === "far" ? "prawy" : "lewy")
                          : "z boku, narożnik " + (sp.corner === "far" ? "tylny" : "przedni")) +
    ", odcięte " + sp.a + " jedn. poziomo i " + sp.b + " pionowo";
}

function wedgeSpecValid(sp) {
  const Pw = sp.plane === "front" ? sp.W : sp.D;
  return sp.a >= 1 && sp.b >= 1 && sp.a <= Pw - 1 && sp.b <= sp.H - 1;
}

function exSkos(cfg, opts) {
  for (let t = 0; t < 100; t++) {
    const sp = { W: pick([3, 4]), D: pick([2, 3, 4]), H: pick(cfg.w >= 3 ? [3, 4] : [3]),
                 plane: (opts && opts.plane) || pick(["front", "side"]), corner: pick(["far", "near"]), a: 0, b: 0 };
    const Pw = sp.plane === "front" ? sp.W : sp.D;
    const m = Math.min(Pw, sp.H) - 1;
    if (m < 2) continue;
    sp.a = 1 + randInt(m); sp.b = 1 + randInt(m);
    if (sp.a === sp.b) continue;
    const cand = [];
    const add = (s, tag) => { if (wedgeSpecValid(s)) cand.push({ sp: s, tag: tag }); };
    add(Object.assign({}, sp, { a: sp.b, b: sp.a }), "skosSwap");
    add(Object.assign({}, sp, { corner: sp.corner === "far" ? "near" : "far" }), "skosCorner");
    add(Object.assign({}, sp, { plane: sp.plane === "front" ? "side" : "front" }), "skosPlane");
    const lens = [Object.assign({}, sp, { a: sp.a + 1 }), Object.assign({}, sp, { b: sp.b + 1 }),
                  Object.assign({}, sp, { a: sp.a - 1 }), Object.assign({}, sp, { b: sp.b - 1 })]
      .filter(s => wedgeSpecValid(s) && s.a !== s.b);
    if (lens.length) add(pick(lens), "skosLen");
    if (cand.length < 3) continue;
    const poly = makeWedge(sp);
    const method = (opts && opts.forceMethod) || State.method;
    const side = method === "E" ? "left" : "right";
    const opt = (s, tag) => { const p = makeWedge(s); return { kind: "poly", poly: p, id: "K" + p.id, tag: tag, desc: describeWedge(s) }; };
    return {
      skill: "skos",
      prompt: "Rzuty przedstawiają prostopadłościan ze ściętą krawędzią. Który rysunek izometryczny mu odpowiada?",
      hint: "Linii pochyłej nie da się odmierzyć wprost. Odmierz jej końce wzdłuż osi i połącz je.",
      stimulus: [{ type: "views", solid: poly, method: method, side: side }],
      options: assembleOptions(opt(sp, "ok"), cand.map(c => opt(c.sp, c.tag)), Math.min(cfg.opts, 4)),
      note: "Końce skosu leżą na krawędziach izometrycznych — odmierza się je w jednostkach wzdłuż osi, " +
            "a dopiero potem łączy linią pochyłą.",
      solution: poly,
    };
  }
  throw new Error("Nie udało się zbudować zadania ze skosem");
}

/* ═══ ZADANIE W FORMACIE PSVT:R ═══
   Format testu Guaya (1977): pokazany jest obrót na jednej bryle, a trzeba
   zastosować ten sam obrót do drugiej. Obrotu nie podaje się słownie —
   trzeba go odczytać z przykładu. Na wyższych poziomach obrót jest złożony
   z dwóch obrotów wokół różnych osi, jak w tygodniu 7 kursu Sorby.
   Służy wyłącznie jako test wstępny i końcowy: to samo narzędzie przed
   kursem i po nim, inaczej różnica wyników nie mierzyłaby przyrostu. */

const XF_INV = new Map([
  [XF.rotZ, XF.rotZi], [XF.rotZi, XF.rotZ], [XF.rotX, XF.rotXi],
  [XF.rotXi, XF.rotX], [XF.rotY, XF.rotYi], [XF.rotYi, XF.rotY],
]);
const applySeq = (solid, seq) => { let t = solid; for (const f of seq) t = xform(t, f); return t; };

/** Wszystkie 24 obroty sześcianu jako sekwencje obrotów elementarnych.
    Wyznaczone przeszukiwaniem: każda nowa sekwencja, która daje inny obraz
    bryły wzorcowej, to nowy obrót. Bryła wzorcowa nie ma żadnej symetrii,
    więc różne obroty zawsze dają różne obrazy. */
let CUBE_ROTATIONS = null;
function cubeRotations() {
  if (CUBE_ROTATIONS) return CUBE_ROTATIONS;
  const ref = solidFromHeights([[3, 1, 0], [1, 0, 2], [0, 2, 1]]);
  const out = [], seen = new Set(), queue = [[]];
  while (queue.length) {
    const seq = queue.shift();
    const key = applySeq(ref, seq).id;
    if (seen.has(key)) continue;
    seen.add(key); out.push(seq);
    for (const g of [XF.rotX, XF.rotY, XF.rotZ]) queue.push(seq.concat([g]));
  }
  CUBE_ROTATIONS = out;
  return out;
}
const inverseSeq = seq => seq.slice().reverse().map(f => XF_INV.get(f));

function exPsvt(cfg, opts) {
  const level = (opts && opts.level) || 4;
  const singles = [XF.rotZ, XF.rotZi, XF.rotX, XF.rotXi, XF.rotY, XF.rotYi];
  const axisOf = f => (f === XF.rotZ || f === XF.rotZi) ? "z" : (f === XF.rotX || f === XF.rotXi) ? "x" : "y";

  for (let attempt = 0; attempt < 80; attempt++) {
    // obrót: pojedynczy na poziomach 1–4, złożony z dwóch osi na 5–8
    const first = pick(singles);
    let seq = [first];
    if (level >= 5) seq.push(pick(singles.filter(f => axisOf(f) !== axisOf(first))));
    const inv = inverseSeq(seq);
    const other = [pick(singles.filter(f => axisOf(f) !== axisOf(seq[0])))];

    const ex = generateSolidWhere(cfg, isChiralEnough);
    const target = generateSolidWhere(cfg, q => isChiralEnough(q) && q.id !== ex.id);
    const exAfter = applySeq(ex, seq);

    // Przykład musi jednoznacznie wyznaczać obrót spośród tych, które pojawią
    // się w odpowiedziach — inaczej zadanie ma dwie poprawne interpretacje.
    if (exAfter.id === ex.id) continue;
    if (applySeq(ex, inv).id === exAfter.id || applySeq(ex, other).id === exAfter.id) continue;

    const correct = applySeq(target, seq);
    if (correct.id === target.id) continue;

    // Najmocniejszy warunek: KAŻDY z 24 obrotów, który przekształca przykład
    // w jego obraz, musi dawać ten sam wynik na bryle docelowej. Bez tego
    // przykład z symetrią pasuje do kilku obrotów, a uczeń, który poprawnie
    // odczyta inny z nich, zostałby oceniony jako błędny. Pierwsza wersja
    // sprawdzała tylko obroty obecne w opcjach i przepuszczała 7% takich zadań.
    const outcomes = new Set();
    for (const g of cubeRotations()) if (applySeq(ex, g).id === exAfter.id) outcomes.add(applySeq(target, g).id);
    if (outcomes.size !== 1) continue;

    const cand = [
      isoOpt(applySeq(target, inv), "rotWrong"),
      isoOpt(applySeq(target, other), "axWrong"),
      isoOpt(xform(correct, XF.mirX), "mirror"),
      isoOpt(target, "identity"),
    ];
    return {
      skill: "obrot",
      prompt: "Pierwsza bryła została obrócona tak, jak pokazano. Obróć drugą bryłę dokładnie w ten sam sposób. " +
              "Który wynik jest poprawny?",
      hint: "",
      stimulus: [{ type: "psvt", a: ex, b: exAfter, target: target }],
      options: assembleOptions(isoOpt(correct, "ok"), cand, 4),
      solution: correct,
    };
  }
  // Wyczerpanie prób jest praktycznie nieosiągalne: w pomiarze najwięcej
  // potrzebnych prób to 4 na 80. Gdyby jednak nastąpiło, ponawiamy na
  // najprostszych bryłach, ale zawsze w formacie PSVT. Wcześniej w tym
  // miejscu zwracane było zadanie ze słownym opisem obrotu, czyli inne
  // narzędzie pomiarowe podmienione w środku testu.
  if (!(opts && opts._retry)) return exPsvt(cfgFor(1), Object.assign({}, opts, { _retry: true }));
  throw new Error("Nie udało się zbudować zadania w formacie PSVT");
}

const BUILDERS = {
  "plan-bryla":  exPlanBryla,
  "bryla-rzut":  exBrylaRzut,
  "rzuty-bryla": (cfg, o) => exRzutyBryla(cfg, (o && o.forceMethod) || State.method),
  "obrot":       exObrot,
  "odbicie":     exOdbicie,
  "przekroj":    exPrzekroj,
  "liczenie":    exLiczenie,
  "uklad":       exUklad,
  "szkic":       exSzkic,
  "skos":        exSkos,
  "elipsa":      exElipsa,
  "psvt":        exPsvt,
};

function buildExercise(skill, level, opts) {
  const cfg = cfgFor(level);
  const q = BUILDERS[skill](cfg, opts || {});
  q.correct = q.options.findIndex(o => o.tag === "ok");
  q.level = level;
  return q;
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 9 — MODEL UCZNIA
   Powtórki rozłożone (pudełka Leitnera), przeplatanie typów zadań
   i adaptacyjny poziom trudności — patrz METODYKA.md, sekcja 6.
   ═══════════════════════════════════════════════════════════════ */

const STORE_KEY = "isomaster.trener.v1";
const BOX_MIN   = [0, 1, 4, 12, 40, 150, 480, 1440];   // odstępy powtórek w minutach
const SESSION_LEN = 10;

const State = {
  level: 2, method: "E",
  skills: {}, seen: 0, ok: 0, streak: 0, best: 0,
  recent: [], lastSkills: [], diag: null, diagPost: null, diagPostAttempts: 0, sessions: 0,
  course: { mods: {}, exam: null },
};

function skillOf(id) {
  if (!State.skills[id]) State.skills[id] = { m: 0, box: 0, due: 0, seen: 0, ok: 0 };
  return State.skills[id];
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(State)); } catch (e) { /* tryb prywatny */ }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && typeof d === "object") Object.assign(State, d);
  } catch (e) { /* uszkodzony wpis — start od zera */ }
  State.level = clamp(State.level || 2, 1, 8);
  if (State.method !== "A") State.method = "E";
  if (!State.course || typeof State.course !== "object") State.course = { mods: {}, exam: null };
  if (!State.course.mods) State.course.mods = {};
  for (const id of SKILL_IDS) skillOf(id);
}

function recordAnswer(skill, correct) {
  const s = skillOf(skill);
  s.seen++; if (correct) s.ok++;
  s.m = s.m * 0.72 + (correct ? 0.28 : 0);
  if (correct) { s.box = Math.min(s.box + 1, BOX_MIN.length - 1); }
  else         { s.box = 0; }
  s.due = Date.now() + BOX_MIN[s.box] * 60000;

  State.seen++; if (correct) State.ok++;
  State.streak = correct ? State.streak + 1 : 0;
  if (State.streak > State.best) State.best = State.streak;
  State.recent.push(correct ? 1 : 0);
  if (State.recent.length > 12) State.recent.shift();
  State.lastSkills.push(skill);
  if (State.lastSkills.length > 6) State.lastSkills.shift();
  adaptLevel();
  save();
}

/** Regulator trudności: poziom rośnie po 8 poprawnych odpowiedziach z rzędu,
    spada, gdy wśród ostatnich 8 są co najmniej 2 błędy. W symulacji z modelowym
    uczniem (testy/logika.js) utrzymuje skuteczność w przedziale 75–85%.
    Poprzednie progi (w górę przy 7 z 8, w dół przy 4 z 8) dawały 62–67%,
    choć opis obiecywał 75–85%. */
const ADAPT = { win: 8, up: 8, down: 6 };
function adaptLevel() {
  if (State.recent.length < ADAPT.win) return;
  const good = State.recent.slice(-ADAPT.win).reduce((a, b) => a + b, 0);
  if (good >= ADAPT.up && State.level < 8) { State.level++; State.recent = []; }
  else if (good <= ADAPT.down && State.level > 1) { State.level--; State.recent = []; }
}

/** Przeplatanie: nigdy dwa razy z rzędu ta sama umiejętność; priorytet dla zaległych i słabych. */
function chooseSkill() {
  const now = Date.now();
  const banned = State.lastSkills.slice(-2);
  let pool = SKILL_IDS.filter(id => !banned.includes(id));
  if (pool.length < 2) pool = SKILL_IDS.slice();
  const w = pool.map(id => {
    const s = skillOf(id);
    const overdue  = s.due <= now ? 2.2 : 0.5;
    const weakness = 1.25 - s.m;
    const fresh    = s.seen === 0 ? 2.0 : 1;
    return Math.max(0.05, overdue * weakness * fresh * SKILLS[id].w);
  });
  let t = w.reduce((a, b) => a + b, 0) * Math.random();
  for (let i = 0; i < pool.length; i++) { t -= w[i]; if (t <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function nextQuestion(skill, level, opts) {
  for (let i = 0; i < 12; i++) {
    let q;
    try { q = buildExercise(skill || chooseSkill(), level || State.level, opts); }
    catch (e) { continue; }   // nieudana próba generatora nie może przerwać sesji
    if (q.kind === "sketch" || (q.options.length >= 3 && q.correct >= 0)) return q;
  }
  // Ostatnia próba: ten sam typ zadania, bez wymogu liczby opcji. Podmiana
  // na inny typ zmieniałaby treść sprawdzianu albo testu pomiarowego, więc
  // zastępczy typ wolno wybrać tylko w treningu, gdzie typu nie narzucono.
  return skill ? buildExercise(skill, level || State.level, opts) : buildExercise("liczenie", 2);
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 10 — RYSOWANIE ELEMENTÓW ZADANIA
   ═══════════════════════════════════════════════════════════════ */

/* ═══ OPISY DLA CZYTNIKÓW EKRANU ═══
   Rysunek na canvas jest dla czytnika ekranu pusty. Poniższe funkcje dają
   mu opis słowny. Nie zastępuje on obrazu — zadania przestrzenne wymagają
   widzenia rysunku — ale pozwala zorientować się w strukturze strony
   i obsłużyć aplikację bez myszy. Ograniczenie opisano w README. */

function describeSolid(solid) {
  return "bryła z " + solid.count + " kostek, podstawa " + solid.nx + " na " + solid.ny +
         " pól, wysokość " + solid.nz;
}
function describeView(view) {
  let filled = 0;
  for (const r of view.filled) for (const f of r) if (f) filled++;
  const h = view.hid ? view.hid.size : 0;
  return (view.kind === "section" ? "kład " : "rysunek ") + view.cols + " na " + view.rows + " pól, wypełnionych " + filled +
         (h ? ", odcinków linii niewidocznych " + h : "");
}
function describePlan(hm) {
  let sum = 0;
  for (const col of hm) for (const h of col) sum += h;
  return "plan kodowany " + hm.length + " na " + hm[0].length + " pól, razem " + sum + " kostek";
}
function describeOption(opt) {
  if (opt.kind === "iso")   return describeSolid(opt.solid);
  if (opt.kind === "ortho") return describeView(opt.view);
  if (opt.kind === "num")   return "liczba " + opt.value;
  if (opt.kind === "draw" || opt.kind === "poly") return opt.desc;
  return opt.text;
}
function labelCanvas(canvas, text) {
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", text);
  return canvas;
}

function figure(capText, canvasNode) {
  const f = el("div", "fig");
  const frame = el("div", "canvas-frame");
  frame.appendChild(canvasNode);
  f.appendChild(frame);
  if (capText) f.appendChild(el("div", "fig-cap", capText));
  return f;
}

function isoFigure(solid, cap, size, scale) {
  const c = el("canvas");
  drawIso(c, solid, { w: (size && size.w) || 200, h: (size && size.h) || 172, scale: scale });
  labelCanvas(c, (cap ? cap + ": " : "") + describeSolid(solid));
  return figure(cap, c);
}

function orthoFigure(view, cap, cell) {
  const c = el("canvas");
  drawOrtho(c, view, { cell: cell || 22 });
  labelCanvas(c, (cap ? cap + ": " : "") + describeView(view));
  return figure(cap, c);
}

function planFigure(hm, cap) {
  const c = el("canvas");
  drawPlan(c, hm, { cell: 32 });
  labelCanvas(c, (cap ? cap + ": " : "") + describePlan(hm));
  return figure(cap, c);
}

/* ═══ RYSUNKI: OKRĘGI NA ŚCIANACH I BRYŁY ZE SKOSEM ═══ */

/** Sześcian jednostkowy dopasowany do płótna; zwraca kontekst i funkcję rzutu. */
function cubeCanvas(canvas, W, H, pad) {
  const cube = makeSolid([[0, 0, 0]]);
  const s = isoFitScale(cube, W, H, pad);
  const ctx = drawIso(canvas, cube, { w: W, h: H, scale: s, pad: pad });
  const b = isoBounds(cube, s), ox = (W - b.w) / 2 - b.minX, oy = (H - b.h) / 2 - b.minY;
  return { ctx: ctx, s: s, P: (x, y, z) => { const p = isoPt(x, y, z, s); return [p.x + ox, p.y + oy]; } };
}

/** Okrąg o średnicy równej krawędzi, leżący na ścianie: elipsa (angle) albo — dla
    dystraktora — okrąg bez zniekształcenia (circle). */
function holeOnFace(g, face, v, axes) {
  const ctx = g.ctx, c = g.P.apply(null, FACE_GEOM[face].c);
  ctx.beginPath();
  if (v.circle) ctx.arc(c[0], c[1], 0.5 * g.s, 0, Math.PI * 2);
  else ctx.ellipse(c[0], c[1], 0.5 * ELLIPSE.major * g.s, 0.5 * ELLIPSE.minor * g.s, v.angle, 0, Math.PI * 2);
  ctx.fillStyle = "#0a0a12"; ctx.fill();
  ctx.strokeStyle = "#EAEAEA"; ctx.lineWidth = 2; ctx.stroke();
  if (axes && !v.circle) {
    // osie elipsy linią cienką kreska-kropka, jak osie symetrii na rysunku
    ctx.save(); ctx.setLineDash([5, 2, 1, 2]); ctx.lineWidth = 0.8; ctx.strokeStyle = "#9fb4c4";
    for (const [ang, len] of [[v.angle, ELLIPSE.major], [v.angle + Math.PI / 2, ELLIPSE.minor]]) {
      const dx = Math.cos(ang) * 0.6 * len * g.s, dy = Math.sin(ang) * 0.6 * len * g.s;
      ctx.beginPath(); ctx.moveTo(c[0] - dx, c[1] - dy); ctx.lineTo(c[0] + dx, c[1] + dy); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawHoleCube(canvas, face, variant, opt) {
  opt = opt || {};
  const g = cubeCanvas(canvas, opt.w || 152, opt.h || 132, 16);
  if (opt.mark) {
    const f = FACE_GEOM[face];
    const pt = (s1, s2) => g.P(f.c[0] + (s1 * f.e1[0] + s2 * f.e2[0]) / 2, f.c[1] + (s1 * f.e1[1] + s2 * f.e2[1]) / 2,
                               f.c[2] + (s1 * f.e1[2] + s2 * f.e2[2]) / 2);
    poly(g.ctx, [pt(-1, -1), pt(1, -1), pt(1, 1), pt(-1, 1)], null, "#00C2FF", 3);
  }
  if (variant) holeOnFace(g, face, variant, opt.axes);
  return g.ctx;
}

/* ── Bryły wielościenne (prostopadłościan ze skosem) ── */
const POLY_VIEW = {
  front: { V: [0, -1, 0], p: (v, sp) => [v[0], sp.H - v[2]],      w: sp => sp.W, h: sp => sp.H },
  top:   { V: [0, 0, 1],  p: (v, sp) => [v[0], sp.D - v[1]],      w: sp => sp.W, h: sp => sp.D },
  left:  { V: [-1, 0, 0], p: (v, sp) => [sp.D - v[1], sp.H - v[2]], w: sp => sp.D, h: sp => sp.H },
  right: { V: [1, 0, 0],  p: (v, sp) => [v[1], sp.H - v[2]],      w: sp => sp.D, h: sp => sp.H },
};
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

function polyIsoBounds(p, s) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  for (const v of p.verts) {
    const q = isoPt(v[0], v[1], v[2], s);
    a = Math.min(a, q.x); b = Math.max(b, q.x); c = Math.min(c, q.y); d = Math.max(d, q.y);
  }
  return { minX: a, minY: c, w: b - a, h: d - c };
}
function polyIsoFitScale(p, W, H, pad) {
  const u = polyIsoBounds(p, 1);
  return Math.min((W - 2 * pad) / u.w, (H - 2 * pad) / u.h);
}

/** Rysunek izometryczny bryły wypukłej: widać dokładnie te ściany, których
    normalna ma dodatni iloczyn z kierunkiem do obserwatora (1, −1, 1). */
function drawPolyIso(canvas, p, opt) {
  opt = opt || {};
  const W = opt.w || 190, H = opt.h || 165;
  const ctx = setupCanvas(canvas, W, H);
  const s = opt.scale || polyIsoFitScale(p, W, H, 12);
  const b = polyIsoBounds(p, s), ox = (W - b.w) / 2 - b.minX, oy = (H - b.h) / 2 - b.minY;
  const P = v => { const q = isoPt(v[0], v[1], v[2], s); return [q.x + ox, q.y + oy]; };
  for (const f of p.faces) {
    if (dot3(f.n, [1, -1, 1]) <= 1e-9) continue;
    // jasność jak w drawIso: góra 64%, przód 45%, prawa 31%, ściany pochyłe pośrednio
    const L = 64 * f.n[2] * f.n[2] + 45 * f.n[1] * f.n[1] + 31 * f.n[0] * f.n[0];
    poly(ctx, f.pts.map(P), "hsl(199,55%," + L.toFixed(0) + "%)", "hsl(199,45%,14%)", 1.4);
  }
  for (const m of (opt.marks || [])) {
    const q = P(m);
    ctx.beginPath(); ctx.arc(q[0], q[1], 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "#FFD60A"; ctx.fill(); ctx.strokeStyle = "#0a0a12"; ctx.lineWidth = 1.2; ctx.stroke();
  }
  return ctx;
}

/** Rzut prostokątny bryły wypukłej: krawędź jest widoczna, gdy choć jedna z jej
    ścian jest zwrócona do obserwatora; inaczej rysowana kreskowo. Krawędzie
    niewidoczne idą pod spód, więc tam, gdzie pokrywają się z widocznymi,
    zostają przez nie zakryte — jak w normie. */
function drawPolyOrtho(canvas, p, kind, opt) {
  opt = opt || {};
  const pv = POLY_VIEW[kind], sp = p.spec;
  const cell = opt.cell || 20, pad = 11;
  const cols = pv.w(sp), rows = pv.h(sp);
  const W = cols * cell + pad * 2, H = rows * cell + pad * 2;
  const ctx = setupCanvas(canvas, W, H);
  const P = v => { const q = pv.p(v, sp); return [pad + q[0] * cell, pad + q[1] * cell]; };
  for (const f of p.faces) if (dot3(f.n, pv.V) > 1e-9) poly(ctx, f.pts.map(P), "#2c3a4a", null);
  const draw = (e, lw, dash) => {
    const a = P(e.a), b = P(e.b);
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 0.5) return;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.strokeStyle = "#d8e6f0"; ctx.lineWidth = lw; ctx.lineCap = dash ? "butt" : "round";
    ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
  };
  const ed = polyViewEdges(p, kind);
  const dash = [Math.max(3, cell * 0.2), Math.max(2, cell * 0.13)];
  for (const e of ed.hidden) draw(e, 1.1, dash);
  for (const e of ed.visible) draw(e, 2.2);
  return ctx;
}

/** Podział krawędzi bryły wypukłej na widoczne i niewidoczne w danym rzucie.
    Krawędzie widziane czołowo (rzutujące się w punkt) są pomijane, a krawędź
    niewidoczna leżąca w całości na widocznej — odrzucana, bo na rysunku
    pierwszeństwo ma linia widoczna. */
function polyViewEdges(p, kind) {
  const pv = POLY_VIEW[kind], vis = [], hid = [];
  for (const e of p.edges) {
    const a = pv.p(e.a, p.spec), b = pv.p(e.b, p.spec);
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 1e-9) continue;
    (e.f.some(fi => dot3(p.faces[fi].n, pv.V) > 1e-9) ? vis : hid).push({ e: e, a: a, b: b });
  }
  // Czy odcinek niewidoczny jest w całości pokryty przez współliniowe odcinki widoczne
  // (także przez kilka, które razem go zakrywają).
  const covered = h => {
    const dx = h.b[0] - h.a[0], dy = h.b[1] - h.a[1], L2 = dx * dx + dy * dy;
    const par = q => ((q[0] - h.a[0]) * dx + (q[1] - h.a[1]) * dy) / L2;
    const onLine = q => Math.abs(dx * (q[1] - h.a[1]) - dy * (q[0] - h.a[0])) < 1e-9;
    const iv = vis.filter(v => onLine(v.a) && onLine(v.b))
      .map(v => [Math.min(par(v.a), par(v.b)), Math.max(par(v.a), par(v.b))]).sort((x, y) => x[0] - y[0]);
    let reach = 0;
    for (const [lo, hi] of iv) { if (lo > reach + 1e-9) break; reach = Math.max(reach, hi); }
    return reach >= 1 - 1e-9;
  };
  return { visible: vis.map(v => v.e), hidden: hid.filter(h => !covered(h)).map(h => h.e) };
}

/* ═══ SYMBOL METODY RZUTOWANIA (PN-EN ISO 5456-2) ═══
   Ścięty stożek w dwóch rzutach. Widziany od węższego końca daje dwa
   współśrodkowe okręgi, widziany z prawej — trapez z krótszym bokiem po
   lewej, bo obserwator z prawej widzi węższy koniec po swojej lewej.
   Symbol to po prostu zasada rozmieszczenia zastosowana do stożka:
     pierwszy kąt (E): [trapez][okręgi] — krótszy bok odwrócony od okręgów
     trzeci kąt  (A):  [okręgi][trapez] — krótszy bok zwrócony do okręgów
   Orientację potwierdzają Wikipedia („Multiview orthographic projection")
   i SizeMarker; treści samej normy nie przeczytano, bo dostępna próbka to
   skan. Proporcje są więc przybliżone, a znaczenie niesie kierunek trapezu. */

function methodSymbolGeometry(method, W, H) {
  const R = H * 0.36, r = R * 0.5;            // promień okręgu dużego i małego
  const trapLen = R * 2.2, gap = R * 0.8;
  const total = trapLen + gap + 2 * R;
  const x0 = (W - total) / 2, cy = H / 2;
  const trapX = method === "E" ? x0 : x0 + 2 * R + gap;
  const circX = method === "E" ? x0 + trapLen + gap + R : x0 + R;
  return { cy: cy, R: R, r: r, x0: x0, total: total, circX: circX,
           narrowX: trapX, wideX: trapX + trapLen };
}

function describeMethodSymbol(method) {
  return method === "E"
    ? "symbol metody rzutowania: trapez po lewej, dwa współśrodkowe okręgi po prawej, węższy bok trapezu odwrócony od okręgów"
    : "symbol metody rzutowania: dwa współśrodkowe okręgi po lewej, trapez po prawej, węższy bok trapezu zwrócony do okręgów";
}

function drawMethodSymbol(canvas, method, opt) {
  opt = opt || {};
  const W = opt.w || 90, H = opt.h || 38;
  const ctx = setupCanvas(canvas, W, H);
  const g = methodSymbolGeometry(method, W, H);
  ctx.strokeStyle = opt.color || "#d8e6f0";
  ctx.lineWidth = opt.lw || 1.5; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(g.narrowX, g.cy - g.r); ctx.lineTo(g.wideX, g.cy - g.R);
  ctx.lineTo(g.wideX, g.cy + g.R);   ctx.lineTo(g.narrowX, g.cy + g.r);
  ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.arc(g.circX, g.cy, g.R, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(g.circX, g.cy, g.r, 0, Math.PI * 2); ctx.stroke();
  // linie osiowe kreska-kropka, jak na rysunku technicznym
  ctx.setLineDash([4, 2, 1, 2]); ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(g.x0 - 4, g.cy); ctx.lineTo(g.x0 + g.total + 4, g.cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.circX, g.cy - g.R - 4); ctx.lineTo(g.circX, g.cy + g.R + 4); ctx.stroke();
  ctx.setLineDash([]);
  labelCanvas(canvas, describeMethodSymbol(method));
  return g;
}

/** Podpis układu rzutów: symbol metody i jej nazwa, tak jak w tabliczce rysunku. */
function methodCaption(method) {
  const row = el("div", "method-cap");
  const c = el("canvas");
  drawMethodSymbol(c, method, { w: 70, h: 30 });
  row.appendChild(c);
  row.appendChild(el("span", null, "metoda " + (method === "E" ? "pierwszego kąta (E)" : "trzeciego kąta (A)")));
  return row;
}

/** Układ trzech rzutów zgodny z wybraną metodą rzutowania. */
function viewsLayout(solid, method, side) {
  const wrap = el("div", "views-layout");
  wrap.style.gridTemplateColumns = "auto auto";
  const place = (node, r, c) => { node.style.gridRow = r; node.style.gridColumn = c; wrap.appendChild(node); };
  const slot = (kind, cap) => {
    const s = el("div", "view-slot");
    const c = el("canvas");
    if (solid.isPoly) {
      drawPolyOrtho(c, solid, kind, { cell: 24 });
      labelCanvas(c, cap + ": " + describeWedge(solid.spec));
    } else {
      const vw = orthoView(solid, kind);
      drawOrtho(c, vw, { cell: 24 });
      labelCanvas(c, cap + ": " + describeView(vw));
    }
    const fr = el("div", "canvas-frame"); fr.appendChild(c);
    s.appendChild(fr); s.appendChild(el("div", "fig-cap", cap));
    return s;
  };
  if (method === "E") {
    place(slot("front", "rzut główny"), 1, 1);
    place(slot(side, VIEW_LABEL[side]),  1, 2);
    place(slot("top", "rzut z góry"),    2, 1);
  } else {
    place(slot("top", "rzut z góry"),    1, 1);
    place(slot("front", "rzut główny"),  2, 1);
    place(slot(side, VIEW_LABEL[side]),  2, 2);
  }
  const box = el("div", "views-card");
  box.appendChild(wrap);
  box.appendChild(methodCaption(method));
  return box;
}

/** Schemat rozmieszczenia rzutów z zaznaczonym pytanym polem. */
function layoutDiagram(method, slot) {
  const wrap = el("div", "views-layout");
  wrap.style.gridTemplateColumns = "repeat(3, 92px)";
  const cellBox = (txt, on) => {
    const d = el("div");
    d.style.cssText = "height:62px;display:flex;align-items:center;justify-content:center;text-align:center;" +
      "border-radius:7px;font-size:11px;padding:5px;line-height:1.3;border:2px " + (on ? "solid #00C2FF" : "dashed #2a2a2a") + ";" +
      "background:" + (on ? "#0d2230" : "#141414") + ";color:" + (on ? "#00C2FF" : "#5a5a5a") + ";font-weight:" + (on ? "700" : "400");
    d.textContent = txt;
    return d;
  };
  const put = (node, r, c) => { node.style.gridRow = r; node.style.gridColumn = c; wrap.appendChild(node); };
  put(cellBox("rzut główny", false), 2, 2);
  put(cellBox(slot === "left" ? "?" : "", slot === "left"), 2, 1);
  put(cellBox(slot === "right" ? "?" : "", slot === "right"), 2, 3);
  put(cellBox(slot === "above" ? "?" : "", slot === "above"), 1, 2);
  put(cellBox(slot === "below" ? "?" : "", slot === "below"), 3, 2);
  const box = el("div", "views-card");
  box.appendChild(wrap);
  box.appendChild(methodCaption(method));
  return box;
}

function renderStimulus(list, scale) {
  const row = el("div", "stimulus");
  for (const s of list) {
    if (s.type === "iso")            row.appendChild(isoFigure(s.solid, s.cap, { w: 214, h: 182 }, scale));
    else if (s.type === "plan")      row.appendChild(planFigure(s.hm, s.cap));
    else if (s.type === "views")     row.appendChild(viewsLayout(s.solid, s.method, s.side));
    else if (s.type === "layoutDiagram") row.appendChild(layoutDiagram(s.method, s.slot));
    else if (s.type === "psvt") {
      const box = el("div", "psvt");
      const sz = { w: 152, h: 132 };
      box.appendChild(isoFigure(s.a, "przed obrotem", sz, scale));
      box.appendChild(el("div", "psvt-arrow", "→"));
      box.appendChild(isoFigure(s.b, "po obrocie", sz, scale));
      box.appendChild(el("div", "psvt-sep"));
      box.appendChild(isoFigure(s.target, "obróć tę bryłę", sz, scale));
      box.appendChild(el("div", "psvt-arrow", "→"));
      const qbox = el("div", "fig");
      const qm = el("div", "psvt-q", "?");
      qm.setAttribute("aria-hidden", "true");
      qbox.appendChild(qm);
      qbox.appendChild(el("div", "fig-cap", "wynik"));
      box.appendChild(qbox);
      row.appendChild(box);
    }
    else if (s.type === "draw") {
      const c = el("canvas");
      s.draw(c);
      labelCanvas(c, s.desc);
      row.appendChild(figure(s.cap, c));
    }
    else if (s.type === "symbol") {
      const c = el("canvas");
      drawMethodSymbol(c, s.method, { w: 200, h: 88, lw: 2.2 });
      row.appendChild(figure("symbol metody rzutowania", c));
    }
  }
  return row;
}

function renderOptionBody(opt, scale) {
  // Etykietę dla czytnika niesie przycisk opcji, więc samo płótno pomijamy,
  // żeby treść nie była zapowiadana dwa razy.
  const hide = c => { c.setAttribute("aria-hidden", "true"); return c; };
  if (opt.kind === "iso")   { const c = el("canvas"); drawIso(c, opt.solid, { w: 152, h: 132, scale: scale }); return hide(c); }
  if (opt.kind === "ortho") { const c = el("canvas"); drawOrtho(c, opt.view, { cell: 19 }); return hide(c); }
  if (opt.kind === "draw")  { const c = el("canvas"); opt.draw(c); return hide(c); }
  if (opt.kind === "poly")  { const c = el("canvas"); drawPolyIso(c, opt.poly, { w: 152, h: 132, scale: opt.scale }); return hide(c); }
  if (opt.kind === "num")   { const d = el("div", null, String(opt.value)); d.style.cssText = "font-size:32px;font-weight:800;color:#EAEAEA;padding:14px 0;"; return d; }
  const d = el("div", null, opt.text);
  d.style.cssText = "font-size:14px;color:#EAEAEA;padding:12px 4px;line-height:1.35;";
  return d;
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 11 — SESJA TRENINGOWA
   ═══════════════════════════════════════════════════════════════ */

const UI = { screen: "kurs", module: null, error: null };
const DIAG_LEVELS = [1, 2, 3, 4, 5, 6, 7, 8];
// Wersja narzędzia pomiarowego. Wynik z innej wersji nie jest porównywalny,
// dlatego przyrost liczy się tylko, gdy oba testy mają tę samą wartość.
const PSVT_INSTRUMENT = "psvt-v1";

/** Dopisek o numerze podejścia — pierwsze podejście jest pomiarem, kolejne to już ćwiczenie. */
function attemptNote(g) {
  return g.attempt > 1 ? ", podejście " + g.attempt + " do testu końcowego" : "";
}

/** Przyrost między testem wstępnym a końcowym, albo powód, dla którego go brak. */
function measuredGain() {
  const pre = State.diag, post = State.diagPost;
  if (!pre) return { ok: false, why: "brak testu wstępnego" };
  if (pre.instrument !== PSVT_INSTRUMENT)
    return { ok: false, why: "test wstępny wykonano w starszej wersji narzędzia, której wyniku nie da się porównać" };
  if (!post) return { ok: false, why: "test końcowy niewykonany" };
  const a = Math.round(pre.score / pre.total * 100), b = Math.round(post.score / post.total * 100);
  return { ok: true, pre: a, post: b, delta: b - a, attempt: post.attempt || 1 };
}

const Session = { active: false, mode: "trening", diag: false, queue: null, moduleId: null,
                  i: 0, len: SESSION_LEN, ok: 0, q: null, answered: false, chosen: -1, summary: null };

/** opts: {mode, queue, moduleId}. Bez kolejki zadania dobiera model ucznia. */
function startSession(opts) {
  opts = opts || {};
  Session.active   = true;
  Session.mode     = opts.mode || "trening";
  Session.diag     = Session.mode === "diag" || Session.mode === "post";
  Session.queue    = opts.queue || null;
  Session.moduleId = opts.moduleId || null;
  Session.i = 0; Session.ok = 0; Session.summary = null;
  // Testy i trening wyświetla zakładka Trening; bez tego test uruchomiony
  // ze spisu kursu startowałby na ekranie, który go nie pokazuje.
  if (Session.mode === "trening" || Session.diag) UI.screen = "trening";
  Session.len = Session.queue ? Session.queue.length : (Session.diag ? DIAG_LEVELS.length : SESSION_LEN);
  // Podejście liczy się od chwili rozpoczęcia, także gdy zostanie przerwane.
  // Inaczej zapis pokazywałby wyłącznie udane próby.
  if (Session.mode === "kurs-test" && Session.moduleId) { courseProgress(Session.moduleId).attempts++; save(); }
  loadQuestion();
}

function loadQuestion() {
  try {
    if (Session.queue) {
      const spec = Session.queue[Session.i];
      Session.q = nextQuestion(spec.skill, spec.level, spec.opts);
    } else if (Session.diag) {
      const lvl = DIAG_LEVELS[Session.i];
      Session.q = nextQuestion("psvt", lvl, { level: lvl });
    } else {
      Session.q = nextQuestion();
    }
  } catch (e) {
    // Generator może zgłosić błąd zamiast podmienić typ zadania. Wtedy sesję
    // kończymy bez zapisu wyniku i mówimy o tym wprost, zamiast zostawić
    // zamrożony ekran. Niepełne podejście nie jest liczone jako wynik.
    Session.active = false; Session.summary = null; Session.q = null;
    UI.error = "Nie udało się przygotować zadania, więc ta sesja została przerwana bez zapisu wyniku. Spróbuj ponownie.";
    render();
    return;
  }
  Session.answered = false; Session.chosen = -1;
  Session.sk = Session.q.kind === "sketch" ? newSketchState(Session.q) : null;
  render();
}

/** Rozstrzygnięty szkic liczy się jak odpowiedź: zaliczony, jeśli poprawny w dwóch próbach. */
function answerSketch(ok) {
  if (Session.answered) return;
  Session.answered = true; Session.chosen = ok ? 0 : -1; justAnswered = true;
  if (ok) Session.ok++;
  if (!Session.diag) recordAnswer(Session.q.skill, ok);
}

let justAnswered = false;   // przenosi fokus na „Dalej" zaraz po odpowiedzi

/** Sesję da się przejść bez myszy: cyfry wybierają odpowiedź, Enter idzie dalej. */
function sessionKeys(e) {
  if (!Session.active || !Session.q) return;
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!Session.answered) {
    let idx = "123456789".indexOf(e.key);
    if (idx < 0) idx = "abcdefghi".indexOf(String(e.key).toLowerCase());
    if (idx >= 0 && idx < Session.q.options.length) { e.preventDefault(); answer(idx); }
  } else if (e.key === "Enter" && document.activeElement === document.body) {
    e.preventDefault(); nextStep();
  }
}

function answer(idx) {
  if (Session.answered) return;
  Session.answered = true; Session.chosen = idx; justAnswered = true;
  const correct = idx === Session.q.correct;
  if (correct) Session.ok++;
  if (!Session.diag) recordAnswer(Session.q.skill, correct);
  render();
}

function nextStep() {
  Session.i++;
  if (Session.i >= Session.len) finishSession();
  else loadQuestion();
}

function finishSession() {
  const m = Session.mode;
  if (m === "diag") {
    const lvl = clamp(1 + Session.ok, 1, 8);
    State.diag = { score: Session.ok, total: Session.len, level: lvl, date: Date.now(), instrument: PSVT_INSTRUMENT };
    State.level = lvl;
    State.diagPost = null;   // nowy punkt wyjścia unieważnia stary test końcowy
    State.diagPostAttempts = 0;
  } else if (m === "post") {
    // Test końcowy nie zmienia poziomu: mierzy, a nie steruje nauką.
    // Liczba podejść jest zapisywana, bo zachowujemy ostatni wynik, a test
    // powtarzany do skutku zawyża przyrost — zapis ma to pokazywać.
    State.diagPostAttempts = (State.diagPostAttempts || 0) + 1;
    State.diagPost = { score: Session.ok, total: Session.len, date: Date.now(),
                       instrument: PSVT_INSTRUMENT, attempt: State.diagPostAttempts };
  } else if (m === "trening") {
    State.sessions++;
  } else if (m === "kurs-drill") {
    courseProgress(Session.moduleId).drill = true;
  } else if (m === "kurs-test") {
    const mod = COURSE_BY_ID[Session.moduleId];
    const pr  = courseProgress(Session.moduleId);
    if (Session.ok > (pr.best || 0)) pr.best = Session.ok;
    if (mod && Session.ok >= mod.pass) pr.passed = true;
  } else if (m === "kurs-exam") {
    const passed = Session.ok >= EXAM.pass;
    const prev = State.course.exam;
    if (!prev || Session.ok > prev.score) State.course.exam = { score: Session.ok, total: Session.len, passed: passed, date: Date.now() };
    else if (passed) State.course.exam.passed = true;
  }
  save();
  Session.summary = { ok: Session.ok, len: Session.len, mode: m, moduleId: Session.moduleId };
  Session.active = false;
  render();
}

function screenTrening(root) {
  if (Session.active) { renderQuestion(root); return; }

  if (Session.summary && String(Session.summary.mode).indexOf("kurs") !== 0) {
    const s = Session.summary;
    const pct = Math.round(s.ok / s.len * 100);
    const card = el("div", "card center");
    card.appendChild(el("h2", null, s.mode === "diag" ? "Test wstępny zakończony"
                                   : s.mode === "post" ? "Test końcowy zakończony" : "Sesja zakończona"));
    const big = el("div", "stat-n", s.ok + " / " + s.len);
    big.style.fontSize = "42px";
    card.appendChild(big);
    card.appendChild(el("p", null, "Skuteczność " + pct + "%."));
    if (s.mode === "post") {
      const g = measuredGain();
      card.appendChild(el("p", null, g.ok
        ? "Test wstępny " + g.pre + "% → test końcowy " + g.post + "%" + attemptNote(g) + ". " +
          (g.delta > 0 ? "Przyrost: " + g.delta + " pkt proc." : g.delta < 0 ? "Spadek: " + (-g.delta) + " pkt proc." : "Bez zmiany.") +
          " Oba wyniki pochodzą z tego samego narzędzia, więc da się je porównać."
        : "Przyrostu nie da się policzyć: " + g.why + "."));
      card.appendChild(el("p", "muted", "Przy ośmiu zadaniach różnica jednego zadania to 12,5 punktu procentowego. " +
        "Pojedynczy wynik pokazuje kierunek zmiany, nie jej dokładną wielkość."));
    } else {
      card.appendChild(el("p", null, s.mode === "diag"
        ? "Poziom startowy ustawiony na " + State.level + ". Ten wynik jest punktem odniesienia: po nauce zrób test końcowy, żeby zmierzyć przyrost."
        : "Aktualny poziom trudności: " + State.level + " z 8. Kolejne powtórki materiału zaplanowane są w czasie."));
    }
    const row = el("div", "row center mt");
    row.style.justifyContent = "center";
    const b1 = el("button", "btn", "Następna sesja");
    b1.onclick = () => { Session.summary = null; startSession({ mode: "trening" }); };
    row.appendChild(b1);
    const b2 = el("button", "btn ghost", "Zobacz postępy");
    b2.onclick = () => { UI.screen = "postepy"; Session.summary = null; render(); };
    row.appendChild(b2);
    card.appendChild(row);
    root.appendChild(card);
    return;
  }

  const card = el("div", "card");
  card.appendChild(el("h2", null, "Trening przestrzenny"));
  const p = el("p", "lead", "Sesja to " + SESSION_LEN + " zadań z różnych umiejętności, przeplatanych celowo. " +
    "Trudność dobiera się sama, a materiał wraca do powtórki w rosnących odstępach czasu.");
  card.appendChild(p);

  if (!State.diag) {
    const note = el("div", "note");
    note.textContent = "Nie masz jeszcze wyniku testu wstępnego. Osiem zadań w formacie testu PSVT:R ustawi poziom " +
      "startowy i stanie się punktem odniesienia, do którego porówna się test końcowy. Test można pominąć, " +
      "ale wtedy przyrostu nie da się zmierzyć.";
    card.appendChild(note);
  }

  const row = el("div", "row mt");
  const b1 = el("button", "btn", "Zacznij sesję");
  b1.onclick = () => startSession({ mode: "trening" });
  row.appendChild(b1);
  if (!State.diag) {
    const b2 = el("button", "btn ghost", "Test wstępny (8 zadań)");
    b2.onclick = () => startSession({ mode: "diag" });
    row.appendChild(b2);
  } else {
    const b2 = el("button", "btn ghost", State.diagPost ? "Powtórz test końcowy" : "Test końcowy (8 zadań)");
    b2.onclick = () => startSession({ mode: "post" });
    row.appendChild(b2);
    const b3 = el("button", "btn ghost sm", "Powtórz test wstępny");
    b3.onclick = () => {
      if (!window.confirm("Powtórzenie testu wstępnego zastąpi punkt odniesienia i skasuje wynik testu końcowego. " +
                          "Robi się to tylko na początku nauki. Kontynuować?")) return;
      startSession({ mode: "diag" });
    };
    row.appendChild(b3);
  }
  card.appendChild(row);
  const g = measuredGain();
  if (g.ok) {
    const m = el("div", "muted", "Test wstępny " + g.pre + "% → test końcowy " + g.post + "%.");
    m.style.marginTop = "10px";
    card.appendChild(m);
  }
  root.appendChild(card);

  // Co jest zaplanowane do powtórki
  const now = Date.now();
  const due = SKILL_IDS.filter(id => skillOf(id).seen > 0 && skillOf(id).due <= now);
  if (due.length) {
    const c2 = el("div", "card");
    c2.appendChild(el("h3", null, "Do powtórki teraz"));
    c2.appendChild(el("p", null, due.map(id => SKILLS[id].name).join(" · ")));
    root.appendChild(c2);
  }
}

function renderQuestion(root) {
  const q = Session.q;
  if (q.kind === "sketch") { renderSketchQuestion(root); return; }
  const card = el("div", "card");

  const head = el("div", "q-head");
  head.appendChild(el("div", "q-tag", Session.diag ? "test wstępny" : SKILLS[q.skill].name));
  const txt = el("div", "q-text");
  txt.appendChild(document.createTextNode(q.prompt));
  if (q.hint && !Session.diag) { const h = el("div", "q-hint", q.hint); txt.appendChild(h); }
  head.appendChild(txt);
  card.appendChild(head);

  // Jedna skala dla bodźca i wszystkich opcji — porównywalność rysunków
  const isoSolids = q.options.filter(o => o.kind === "iso").map(o => o.solid)
    .concat(q.stimulus.filter(s => s.type === "iso").map(s => s.solid));
  for (const st of q.stimulus) if (st.type === "psvt") isoSolids.push(st.a, st.b, st.target);
  const isoScale = isoSolids.length ? sharedIsoScale(isoSolids, 152, 132, 12) : null;
  const polys = q.options.filter(o => o.kind === "poly");
  if (polys.length) {
    const ps = Math.min.apply(null, polys.map(o => polyIsoFitScale(o.poly, 152, 132, 12)));
    for (const o of polys) o.scale = ps;
  }

  card.appendChild(renderStimulus(q.stimulus, isoScale));

  const opts = el("div", "opts");
  const letters = "ABCDE";
  q.options.forEach((o, i) => {
    const d = el("button", "opt");
    d.type = "button";
    const letter = letters[i] || String(i + 1);
    d.appendChild(el("div", "lbl", letter));
    d.appendChild(renderOptionBody(o, isoScale));
    let label = "Odpowiedź " + letter + ": " + describeOption(o);
    if (Session.answered) {
      d.classList.add("locked");
      d.setAttribute("aria-disabled", "true");
      if (i === q.correct) { d.classList.add("correct"); label += ". Odpowiedź poprawna"; }
      else if (i === Session.chosen) { d.classList.add("wrong"); label += ". Twój wybór, niepoprawny"; }
      else d.classList.add("dim");
    } else {
      d.onclick = () => answer(i);
    }
    d.setAttribute("aria-label", label);
    opts.appendChild(d);
  });
  card.appendChild(opts);

  if (Session.answered) {
    const good = Session.chosen === q.correct;
    const fb = el("div", "fb " + (good ? "ok" : "err"));
    fb.setAttribute("role", "status");
    fb.setAttribute("aria-live", "polite");
    fb.appendChild(el("div", "fb-title", good ? "✓ Dobrze" : "✗ Niepoprawnie"));
    const body = el("div", "fb-body");
    if (Session.diag) {
      body.textContent = good ? "Poprawna odpowiedź." : "Poprawna była odpowiedź " + letters[q.correct] + ".";
    } else if (good) {
      body.textContent = q.note || "Poprawna odpowiedź.";
    } else {
      const tag = q.options[Session.chosen].tag;
      body.innerHTML = "Wybrana odpowiedź: <b>" + (WHY[tag] || "odpowiedź niepoprawna") +
                       "</b>. Poprawna to <b>" + letters[q.correct] + "</b>." + (q.note ? " " + q.note : "");
    }
    fb.appendChild(body);
    card.appendChild(fb);

    const row = el("div", "row mt");
    const b = el("button", "btn", Session.i + 1 >= Session.len ? "Zakończ sesję" : "Dalej");
    b.onclick = nextStep;
    row.appendChild(b);
    if (justAnswered) { justAnswered = false; setTimeout(() => b.focus(), 0); }
    const prog = el("div", "muted", "Zadanie " + (Session.i + 1) + " z " + Session.len + " · poprawnych " + Session.ok);
    row.appendChild(prog);
    card.appendChild(row);
  } else {
    const bar = el("div", "bar mt");
    const fill = el("i");
    fill.style.width = (Session.i / Session.len * 100) + "%";
    bar.appendChild(fill);
    card.appendChild(bar);
    const m = el("div", "muted", "Zadanie " + (Session.i + 1) + " z " + Session.len +
                (Session.diag ? "" : " · poziom " + q.level));
    m.style.marginTop = "8px";
    card.appendChild(m);
    const kb = el("div", "kbd-hint");
    kb.innerHTML = "Z klawiatury: <kbd>1</kbd>–<kbd>" + q.options.length +
      "</kbd> wybierają odpowiedź, <kbd>Enter</kbd> przechodzi dalej.";
    card.appendChild(kb);
  }
  root.appendChild(card);
}

function renderSketchQuestion(root) {
  const card = sketchCard(Session.q, Session.sk, { onFinal: answerSketch });
  const row = el("div", "row mt");
  if (Session.answered) {
    const b = el("button", "btn", Session.i + 1 >= Session.len ? "Zakończ sesję" : "Dalej");
    b.onclick = nextStep;
    row.appendChild(b);
    if (justAnswered) { justAnswered = false; setTimeout(() => b.focus(), 0); }
  }
  row.appendChild(el("div", "muted", "Zadanie " + (Session.i + 1) + " z " + Session.len + " · poprawnych " + Session.ok));
  card.appendChild(row);
  root.appendChild(card);
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 13 — TRYB BUDUJ
   Konstruowanie zamiast rozpoznawania — METODYKA.md, sekcja 3.
   ═══════════════════════════════════════════════════════════════ */

const Builder = { target: null, hm: null, w: 3, d: 3, maxH: 3, checked: false, ok: false, alt: false, revealed: false, focusCell: null, courseModule: null };

function newBuild() {
  const cfg = cfgFor(State.level);
  Builder.w = cfg.w; Builder.d = cfg.d; Builder.maxH = cfg.maxH;
  Builder.target = generateSolid(cfg);
  Builder.hm = Array.from({ length: cfg.w }, () => new Array(cfg.d).fill(0));
  Builder.checked = false; Builder.ok = false; Builder.alt = false; Builder.revealed = false;
}

function builderSolid() {
  let n = 0;
  for (let x = 0; x < Builder.w; x++) for (let y = 0; y < Builder.d; y++) n += Builder.hm[x][y];
  return n === 0 ? null : solidFromHeights(Builder.hm);
}

function screenBuduj(root) {
  if (!Builder.target) newBuild();
  const side = State.method === "E" ? "left" : "right";

  const card = el("div", "card");
  card.appendChild(el("h2", null, "Zbuduj bryłę z rzutów"));
  card.appendChild(el("p", null,
    "Odczytaj rzuty i odtwórz bryłę, wpisując wysokości słupków. Kliknięcie w pole podnosi słupek o jedną kostkę, " +
    "kliknięcie z klawiszem Shift obniża. Sprawdzenie jest ścisłe — liczy się dokładna zgodność, nie podobieństwo."));

  const top = el("div", "stimulus");
  top.appendChild(viewsLayout(Builder.target, State.method, side));
  card.appendChild(top);
  root.appendChild(card);

  const work = el("div", "card");
  const wrap = el("div", "stimulus");

  // ── Edytor planu ──
  const left = el("div", "fig");
  const grid = el("div", "plan-grid");
  grid.style.gridTemplateColumns = "repeat(" + Builder.w + ", auto)";
  for (let r = 0; r < Builder.d; r++) for (let c = 0; c < Builder.w; c++) {
    const x = c, y = Builder.d - 1 - r;              // górny wiersz = tył
    const h = Builder.hm[x][y];
    const cell = el("button", "plan-cell" + (h > 0 ? " set" : ""), h > 0 ? String(h) : "");
    cell.type = "button";
    cell.setAttribute("aria-label", "Kolumna " + (x + 1) + ", rząd " + (Builder.d - y) +
      " od przodu, wysokość " + h + ". Strzałki w górę i w dół zmieniają wysokość.");
    const bump = (d) => {
      Builder.hm[x][y] = d > 0 ? (Builder.hm[x][y] + 1) % (Builder.maxH + 1) : Math.max(0, Builder.hm[x][y] - 1);
      Builder.checked = false; Builder.alt = false;
      Builder.focusCell = x + "," + y;
      render();
    };
    cell.onclick = (ev) => bump(ev.shiftKey ? -1 : 1);
    cell.oncontextmenu = (ev) => { ev.preventDefault(); bump(-1); };
    cell.onkeydown = (ev) => {
      if (ev.key === "ArrowUp")   { ev.preventDefault(); bump(1); }
      if (ev.key === "ArrowDown") { ev.preventDefault(); bump(-1); }
    };
    if (Builder.focusCell === x + "," + y) setTimeout(() => cell.focus(), 0);
    grid.appendChild(cell);
  }
  left.appendChild(grid);
  left.appendChild(el("div", "fig-cap", "twój plan kodowany — góra siatki to tył"));
  wrap.appendChild(left);

  // ── Podgląd na żywo ──
  const cur = builderSolid();
  if (cur) wrap.appendChild(isoFigure(cur, "twoja bryła · " + cur.count + " kostek", { w: 214, h: 182 }));
  else {
    const ph = el("div", "fig");
    const box = el("div", "canvas-frame");
    box.style.cssText += "width:214px;height:182px;display:flex;align-items:center;justify-content:center;";
    box.appendChild(el("div", "muted", "kliknij w siatkę"));
    ph.appendChild(box); ph.appendChild(el("div", "fig-cap", "twoja bryła"));
    wrap.appendChild(ph);
  }

  if (Builder.revealed || Builder.alt) wrap.appendChild(isoFigure(Builder.target, Builder.alt ? "bryła, z której narysowano rzuty" : "rozwiązanie", { w: 214, h: 182 }));
  work.appendChild(wrap);

  const row = el("div", "row mt");
  const bCheck = el("button", "btn", "Sprawdź");
  bCheck.disabled = !cur;
  bCheck.onclick = () => {
    const s = builderSolid();
    if (!s) return;
    Builder.checked = true;
    // Rzuty nie zawsze wyznaczają bryłę jednoznacznie. Bryła o identycznych
    // trzech rzutach jest więc równie poprawną odpowiedzią — pierwsza wersja
    // ją odrzucała, a dotyczyło to 3–30% brył zależnie od poziomu.
    Builder.alt = s.id !== Builder.target.id && threeViewKey(s, side) === threeViewKey(Builder.target, side);
    Builder.ok = s.id === Builder.target.id || Builder.alt;
    recordAnswer("rzuty-bryla", Builder.ok);
    if (Builder.ok && Builder.courseModule) { courseProgress(Builder.courseModule).built = true; save(); }
    render();
  };
  row.appendChild(bCheck);

  const bClear = el("button", "btn ghost sm", "Wyczyść");
  bClear.onclick = () => { Builder.hm = Array.from({ length: Builder.w }, () => new Array(Builder.d).fill(0)); Builder.checked = false; Builder.alt = false; render(); };
  row.appendChild(bClear);

  const bNew = el("button", "btn ghost sm", "Nowa bryła");
  bNew.onclick = () => { newBuild(); render(); };
  row.appendChild(bNew);

  const bShow = el("button", "btn ghost sm", "Pokaż rozwiązanie");
  bShow.onclick = () => { Builder.revealed = true; render(); };
  row.appendChild(bShow);
  work.appendChild(row);

  if (Builder.checked) {
    const fb = el("div", "fb " + (Builder.ok ? "ok" : "err"));
    fb.appendChild(el("div", "fb-title", !Builder.ok ? "✗ To jeszcze nie ta bryła"
      : Builder.alt ? "✓ Rzuty Twojej bryły są identyczne z podanymi" : "✓ Bryła zgadza się co do kostki"));
    const b = el("div", "fb-body");
    if (Builder.alt) {
      b.textContent = "Twoja bryła różni się od tej, z której narysowano rzuty, ale ma dokładnie te same trzy rzuty, " +
        "więc jest poprawną odpowiedzią. Te rzuty nie wyznaczają bryły jednoznacznie — różnice kryją się tam, " +
        "gdzie żaden z trzech kierunków patrzenia nie sięga. Na rysunku technicznym rozstrzyga to dodatkowy rzut.";
    } else if (Builder.ok) {
      b.textContent = "Zgodność dokładna: " + Builder.target.count + " kostek w tych samych miejscach.";
    } else {
      const s = builderSolid();
      const diff = s ? s.count - Builder.target.count : 0;
      b.textContent = "Twoja bryła ma " + (s ? s.count : 0) + " kostek, szukana ma " + Builder.target.count + ". " +
        (diff === 0
          ? "Liczba kostek się zgadza, więc błąd leży w ich rozmieszczeniu. Porównaj rzut z góry z zarysem swojego planu."
          : "Różnica: " + Math.abs(diff) + " " + (diff > 0 ? "za dużo" : "za mało") + ". Sprawdź wysokości słupków w rzucie z przodu i z boku.");
    }
    fb.appendChild(b);
    work.appendChild(fb);
    if (Builder.ok) {
      const r2 = el("div", "row mt");
      const nb = el("button", "btn", "Następna bryła");
      nb.onclick = () => { newBuild(); render(); };
      r2.appendChild(nb);
      if (Builder.courseModule) {
        const back = el("button", "btn ghost", "Wróć do modułu kursu");
        back.onclick = () => { UI.module = Builder.courseModule; Builder.courseModule = null; UI.screen = "kurs"; render(); };
        r2.appendChild(back);
      }
      work.appendChild(r2);
    }
  }
  root.appendChild(work);
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 13a — SZKICOWANIE NA SIATCE IZOMETRYCZNEJ
   Edytor siatki punktowej. Kliknięcie w punkt zaczyna odcinek, kliknięcie
   w drugi punkt na tej samej linii siatki go rysuje (albo zmazuje, jeśli
   już był) i od razu zaczyna następny. Kliknięcie w punkt początkowy
   przerywa rysowanie. Z klawiatury: strzałki przesuwają kursor, Enter
   działa jak kliknięcie. Szkic sprawdza compareSketch() — dwie próby.
   ═══════════════════════════════════════════════════════════════ */

const SKETCH_MAX_CHECKS = 2;

function newSketchState(task) {
  const t = task.target;
  const U = t.nx + t.ny + 4, V = t.nx + t.ny + 2 * t.nz + 6;
  const s = Math.min(30, 320 / (U * ISO_C));
  let cu = Math.floor(U / 2), cv = Math.floor(V / 2);
  if ((cu + cv) % 2) cv++;
  return { segs: new Set(), hist: [], anchor: null, cursor: { u: cu, v: cv }, U: U, V: V, s: s, pad: 12,
           checks: 0, cmp: null, final: null, msg: "", focus: false };
}

/** Przesunięcie, które stawia rozwiązanie na środku siatki — gdy uczeń nic nie narysował. */
function centerSegs(st, lines) {
  const b = segBounds(lines);
  const du = Math.round((st.U - (b.u1 - b.u0)) / 2) - b.u0;
  let dv = Math.round((st.V - (b.v1 - b.v0)) / 2) - b.v0;
  if ((du + dv) % 2) dv++;
  return shiftSegs(lines, du, dv);
}

function compareOnPad(st, lines) {
  const cmp = compareSketch(st.segs, lines);
  if (!cmp.placed) { cmp.placed = centerSegs(st, lines); cmp.missing = new Set(cmp.placed); }
  return cmp;
}

function drawSketch(canvas, st) {
  const s = st.s, pad = st.pad;
  const X = u => pad + u * s * ISO_C, Y = v => pad + v * s / 2;
  const W = Math.ceil(X(st.U) + pad), H = Math.ceil(Y(st.V) + pad);
  const ctx = setupCanvas(canvas, W, H);
  ctx.fillStyle = "#46596a";
  for (let u = 0; u <= st.U; u++) for (let v = 0; v <= st.V; v++)
    if ((u + v) % 2 === 0) { ctx.beginPath(); ctx.arc(X(u), Y(v), 1.7, 0, Math.PI * 2); ctx.fill(); }
  const line = (k, color, lw, dash) => {
    const p = segPts(k);
    ctx.beginPath(); ctx.moveTo(X(p[0]), Y(p[1])); ctx.lineTo(X(p[2]), Y(p[3]));
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = dash ? "butt" : "round";
    ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
  };
  const cmp = st.cmp;
  const good = st.final === "ok";
  for (const k of st.segs) line(k, good ? "#30D158" : "#EAEAEA", 2.6);
  if (cmp && !good) {
    for (const k of cmp.extra) if (st.segs.has(k)) line(k, "#FF3B30", 3);
    if (st.final) for (const k of cmp.missing) line(k, "#FFD60A", 2.2, [5, 4]);
  }
  if (st.anchor) {
    ctx.beginPath(); ctx.arc(X(st.anchor.u), Y(st.anchor.v), 6, 0, Math.PI * 2);
    ctx.strokeStyle = "#00C2FF"; ctx.lineWidth = 2.5; ctx.stroke();
  }
  if (st.focus) {
    ctx.beginPath(); ctx.arc(X(st.cursor.u), Y(st.cursor.v), 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#FFD60A"; ctx.lineWidth = 1.6; ctx.stroke();
  }
  return { X, Y, W, H };
}

/** Najbliższy punkt siatki w promieniu 0,6 kroku, albo null. */
function sketchPick(st, x, y) {
  const s = st.s, pad = st.pad;
  const fu = (x - pad) / (s * ISO_C), fv = (y - pad) / (s / 2);
  let best = null, bd = Infinity;
  for (let u = Math.round(fu) - 1; u <= Math.round(fu) + 1; u++) {
    if (u < 0 || u > st.U) continue;
    for (let v = Math.floor(fv) - 1; v <= Math.ceil(fv) + 1; v++) {
      if (v < 0 || v > st.V || (u + v) % 2) continue;
      const d = Math.hypot((u - fu) * s * ISO_C, (v - fv) * s / 2);
      if (d < bd) { bd = d; best = { u, v }; }
    }
  }
  return bd <= 0.6 * s ? best : null;
}

/** Kliknięcie w punkt siatki (myszą, dotykiem albo Enterem). */
function sketchAct(st, p) {
  if (st.final) return;
  if (!st.anchor) { st.anchor = p; st.msg = "Początek odcinka w punkcie " + p.u + ", " + p.v + "."; return; }
  if (st.anchor.u === p.u && st.anchor.v === p.v) { st.anchor = null; st.msg = "Rysowanie przerwane."; return; }
  const path = latticePath(st.anchor, p);
  if (!path) { st.anchor = p; st.msg = "Te punkty nie leżą na jednej linii siatki. Nowy początek w punkcie " + p.u + ", " + p.v + "."; return; }
  st.hist.push(new Set(st.segs)); if (st.hist.length > 60) st.hist.shift();
  const all = path.every(k => st.segs.has(k));
  for (const k of path) { if (all) st.segs.delete(k); else st.segs.add(k); }
  st.cmp = null;
  const n = path.length, form = n === 1 ? " odcinek" : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? " odcinki" : " odcinków";
  st.msg = (all ? "Zmazano " : "Narysowano ") + n + form +
           ". Na rysunku: " + st.segs.size + ". Kolejny odcinek zaczyna się w tym punkcie.";
  st.anchor = p;
}

const SKETCH_KEYS = {
  ArrowUp:    [[0, -2], [0, -2]],
  ArrowDown:  [[0, 2],  [0, 2]],
  ArrowRight: [[1, -1], [1, 1]],
  ArrowLeft:  [[-1, 1], [-1, -1]],
};

/** Edytor szkicu z przyciskami i informacją zwrotną.
    cfg: { onFinal(ok) } — wywoływane raz, gdy szkic zostanie rozstrzygnięty. */
function sketchPad(task, st, cfg) {
  const box = el("div", "sketch-box");
  const c = el("canvas", "sketch-canvas");
  c.tabIndex = 0;
  c.setAttribute("role", "application");
  const frame = el("div", "canvas-frame"); frame.appendChild(c);
  box.appendChild(frame);
  const live = el("div", "muted sketch-status");
  live.setAttribute("role", "status"); live.setAttribute("aria-live", "polite");
  box.appendChild(live);

  const row = el("div", "row mt");
  const bCheck = el("button", "btn", "Sprawdź" + (st.checks && !st.final ? " ponownie" : ""));
  const bUndo = el("button", "btn ghost sm", "Cofnij");
  const bClear = el("button", "btn ghost sm", "Wyczyść");
  row.appendChild(bCheck); row.appendChild(bUndo); row.appendChild(bClear);
  if (!st.final) {
    const bGive = el("button", "btn ghost sm", "Pokaż rozwiązanie");
    bGive.onclick = () => { st.cmp = compareOnPad(st, task.lines); st.final = "fail"; st.anchor = null; cfg.onFinal(false); render(); };
    row.appendChild(bGive);
  }
  box.appendChild(row);

  // Rysowanie odświeża tylko płótno, komunikat i przyciski. Przebudowa całego
  // ekranu po każdym ruchu odbierała płótnu fokus i gubiła kolejne klawisze.
  let fbNode = null;
  const refresh = () => {
    drawSketch(c, st);
    c.setAttribute("aria-label", "Siatka izometryczna do szkicowania. Strzałki w górę i w dół przesuwają kursor pionowo, " +
      "w prawo i w lewo ukośnie, z klawiszem Shift po drugiej przekątnej. Enter zaczyna odcinek i rysuje go do kolejnego punktu. " +
      "Escape przerywa, Backspace cofa. Narysowanych odcinków: " + st.segs.size + ".");
    live.textContent = st.msg || "Kliknij punkt, potem drugi na tej samej linii siatki.";
    bCheck.disabled = !!st.final || st.segs.size === 0;
    bUndo.disabled = !!st.final || !st.hist.length;
    bClear.disabled = !!st.final || !st.segs.size;
    if (fbNode && !st.cmp) { fbNode.remove(); fbNode = null; }
  };
  const undo = () => {
    if (st.final || !st.hist.length) return;
    st.segs = st.hist.pop(); st.anchor = null; st.cmp = null;
    st.msg = "Cofnięto. Na rysunku: " + st.segs.size + " odcinków.";
  };

  c.onclick = ev => {
    const r = c.getBoundingClientRect();
    const p = sketchPick(st, ev.clientX - r.left, ev.clientY - r.top);
    if (!p) return;
    st.cursor = p; sketchAct(st, p); refresh();
  };
  c.onkeydown = ev => {
    if (SKETCH_KEYS[ev.key]) {
      ev.preventDefault();
      const d = SKETCH_KEYS[ev.key][ev.shiftKey ? 1 : 0];
      const nu = st.cursor.u + d[0], nv = st.cursor.v + d[1];
      if (nu >= 0 && nu <= st.U && nv >= 0 && nv <= st.V) st.cursor = { u: nu, v: nv };
      st.msg = "Kursor: punkt " + st.cursor.u + ", " + st.cursor.v + (st.anchor ? ". Początek odcinka: " + st.anchor.u + ", " + st.anchor.v : "") + ".";
    } else if (ev.key === "Enter" || ev.key === " ") {
      ev.preventDefault(); ev.stopPropagation(); sketchAct(st, st.cursor);
    } else if (ev.key === "Escape") {
      st.anchor = null; st.msg = "Rysowanie przerwane.";
    } else if (ev.key === "Backspace") {
      ev.preventDefault(); undo();
    } else return;
    refresh();
  };
  c.onfocus = () => { st.focus = true; drawSketch(c, st); };
  c.onblur = () => { st.focus = false; drawSketch(c, st); };

  bCheck.onclick = () => {
    st.checks++;
    st.cmp = compareOnPad(st, task.lines);
    st.anchor = null;
    if (st.cmp.ok) { st.final = "ok"; cfg.onFinal(true); }
    else if (st.checks >= SKETCH_MAX_CHECKS) { st.final = "fail"; cfg.onFinal(false); }
    render();
  };
  bUndo.onclick = () => { undo(); refresh(); };
  bClear.onclick = () => { st.hist.push(new Set(st.segs)); st.segs = new Set(); st.anchor = null; st.cmp = null; st.msg = "Wyczyszczono."; refresh(); };

  if (st.cmp) {
    const ok = st.final === "ok";
    const fb = el("div", "fb " + (ok ? "ok" : "err"));
    fb.setAttribute("role", "status");
    fb.appendChild(el("div", "fb-title", ok ? "✓ Szkic poprawny" : st.final ? "✗ Szkic niepoprawny" : "✗ Jeszcze nie"));
    const b = el("div", "fb-body");
    const nm = st.cmp.missing.size, ne = st.cmp.extra.size;
    if (ok) b.textContent = "Wszystkie odcinki (" + task.lines.size + ") na swoim miejscu" + (st.checks > 1 ? ", za drugim podejściem." : ".");
    else if (!st.final) b.textContent = "Brakuje " + nm + " odc., zbędnych jest " + ne + " — zaznaczono je na czerwono. " +
      "Popraw rysunek; została jedna próba.";
    else b.textContent = "Brakujące odcinki zaznaczono żółtą linią przerywaną, zbędne — czerwoną. Obok bryła narysowana przez program. " +
      "Najczęstsze błędy: linie między kostkami na płaskiej ścianie i pominięta krawędź tam, gdzie słupek styka się z wyższym.";
    fb.appendChild(b);
    box.appendChild(fb);
    fbNode = fb;
  }
  refresh();
  return box;
}

/** Karta zadania szkicu — wspólna dla sesji (trening, kurs) i zakładki Szkicuj. */
function sketchCard(q, st, cfg) {
  const card = el("div", "card");
  const head = el("div", "q-head");
  head.appendChild(el("div", "q-tag", cfg.tag || SKILLS[q.skill].name));
  const txt = el("div", "q-text");
  txt.appendChild(document.createTextNode(q.prompt));
  if (q.hint) txt.appendChild(el("div", "q-hint", q.hint));
  head.appendChild(txt);
  card.appendChild(head);
  const stim = renderStimulus(q.stimulus, null);
  if (st.final) stim.appendChild(isoFigure(q.target, "rysunek wzorcowy", { w: 200, h: 172 }));
  card.appendChild(stim);
  card.appendChild(sketchPad(q, st, cfg));
  return card;
}

function drawIsoAxes(canvas) {
  const W = 300, H = 210, s = 42;
  const ctx = setupCanvas(canvas, W, H);
  const ox = W / 2 - 34, oy = H / 2 + 34;
  const P = (x, y, z) => { const p = isoPt(x, y, z, s); return [p.x + ox, p.y + oy]; };

  const arrow = (to, label, col) => {
    const a = P(0, 0, 0), b = P(to[0], to[1], to[2]);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.font = "bold 12px system-ui, Arial";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, b[0], b[1]);
  };
  arrow([2.55, 0, 0], "x", "#FF6B60");
  arrow([0, 2.55, 0], "y", "#5ED17A");
  arrow([0, 0, 2.35], "z", "#00C2FF");

  const cube = makeSolid([[0, 0, 0]]);
  const top = "hsl(199,55%,64%)", front = "hsl(199,55%,45%)", side = "hsl(199,55%,31%)", edge = "hsl(199,45%,14%)";
  poly(ctx, [P(0, 0, 1), P(1, 0, 1), P(1, 1, 1), P(0, 1, 1)], top, edge, 1);
  poly(ctx, [P(0, 0, 0), P(1, 0, 0), P(1, 0, 1), P(0, 0, 1)], front, edge, 1);
  poly(ctx, [P(1, 0, 0), P(1, 1, 0), P(1, 1, 1), P(1, 0, 1)], side, edge, 1);
  return cube;
}

function lesson(title, buildBody) {
  const box = el("div", "lesson");

  head.type = "button";
  head.setAttribute("aria-expanded", "false");
  head.appendChild(el("span", "caret", "▸"));
  head.appendChild(el("span", null, title));
  const body = el("div", "lesson-b");
  body.id = "lekcja-" + Math.random().toString(36).slice(2, 9);

  return box;
}

/* ── Wspólne bryły demonstracyjne (stałe, żeby rysunki w teorii się nie zmieniały) ──
   DEMO_C jest chiralna: jej odbicia nie da się uzyskać obrotem. Pierwsza wersja
   lekcji o odbiciach pokazywała bryłę [[2,1,0],[1,3,1],[0,1,2]], która ma dwie
   płaszczyzny symetrii — jej „odbicie lustrzane" było zwykłym obrotem o 90°,
   a lekcja twierdziła, że obrotem go uzyskać nie można. Pilnuje tego test. */
const DEMO_A = solidFromHeights([[3, 1], [2, 0]]);
const DEMO_B = solidFromHeights([[2, 1, 0], [1, 3, 1], [0, 1, 2]]);
const DEMO_C = solidFromHeights([[2, 1, 0], [3, 1, 0], [0, 1, 2]]);

const DEMO_WEDGE = { W: 4, D: 2, H: 3, plane: "front", corner: "far", a: 2, b: 2 };

function stimRow() {
  const r = el("div", "stimulus");
  for (let i = 0; i < arguments.length; i++) if (arguments[i]) r.appendChild(arguments[i]);
  return r;
}
function para(b, t) { b.appendChild(el("p", null, t)); }
function bullets(b, items) {
  const ul = el("ul");
  for (const t of items) { const n = el("li"); n.innerHTML = t; ul.appendChild(n); }
  b.appendChild(ul);
}
function noteBox(b, t) { const n = el("div", "note"); n.textContent = t; b.appendChild(n); }
function srcLine(b, t) { const n = el("p", "muted"); n.textContent = "Źródło: " + t; b.appendChild(n); }

/** Szkic bryły na siatce punktowej — tak, jak powinien wyglądać rysunek ucznia. */
function sketchFigure(solid, cap) {
  const st = newSketchState({ target: solid });
  st.segs = centerSegs(st, isoLineSet(solid));
  const c = el("canvas");
  drawSketch(c, st);
  labelCanvas(c, (cap ? cap + ": " : "") + "szkic na siatce izometrycznej, " + st.segs.size + " odcinków");
  return figure(cap, c);
}

const LESSON_BY_ID = {};
for (const L of LESSONS) LESSON_BY_ID[L.id] = L;

function renderLessons(container, ids, openAll) {
  const wrap = el("div", "card pad0");
  const list = ids ? ids.map(i => LESSON_BY_ID[i]).filter(Boolean) : LESSONS;
  list.forEach((L, i) => {
    const num = ids ? "" : (LESSONS.indexOf(L) + 1) + ". ";
    const box = lesson(num + L.title, L.build);
    if (openAll) { box.classList.add("open"); box.firstChild.setAttribute("aria-expanded", "true"); }
    wrap.appendChild(box);
  });
  container.appendChild(wrap);
  return wrap;
}

function screenTeoria(root) { renderLessons(root, null, false); }

function fmtDue(due) {
  const d = due - Date.now();
  if (d <= 0) return "teraz";
  const m = Math.round(d / 60000);
  if (m < 60) return "za " + m + " min";
  const h = Math.round(m / 60);
  if (h < 24) return "za " + h + " h";
  return "za " + Math.round(h / 24) + " dni";
}

function screenPostepy(root) {
  const acc = State.seen ? Math.round(State.ok / State.seen * 100) : 0;

  const c1 = el("div", "card");
  c1.appendChild(el("h2", null, "Postępy"));
  const st = el("div", "stats");
  const stat = (n, l) => { const d = el("div", "stat"); d.appendChild(el("div", "stat-n", String(n))); d.appendChild(el("div", "stat-l", l)); return d; };
  st.appendChild(stat(State.level, "poziom z 8"));
  st.appendChild(stat(State.seen, "rozwiązanych zadań"));
  st.appendChild(stat(acc + "%", "skuteczność"));
  st.appendChild(stat(State.best, "najdłuższa seria"));
  st.appendChild(stat(State.sessions, "ukończonych sesji"));
  c1.appendChild(st);
  if (State.diag) {
    const g = measuredGain();
    const p = el("p", null, "Test wstępny: " + State.diag.score + " / " + State.diag.total +
      ", poziom startowy " + State.diag.level + ". " +
      (g.ok ? "Test końcowy: " + State.diagPost.score + " / " + State.diagPost.total +
              " (" + (g.delta >= 0 ? "+" : "") + g.delta + " pkt proc.)" + attemptNote(g) + "."
            : "Przyrost: " + g.why + "."));
    p.style.marginTop = "14px";
    c1.appendChild(p);
  }
  root.appendChild(c1);

  const c2 = el("div", "card");
  c2.appendChild(el("h2", null, "Opanowanie umiejętności"));
  for (const id of SKILL_IDS) {
    const s = skillOf(id);
    const pct = Math.round(s.m * 100);
    const rowEl = el("div", "skill");
    const leftCol = el("div");
    leftCol.appendChild(el("div", "skill-name", SKILLS[id].name));
    const sub = s.seen
      ? SKILLS[id].modul + " · " + s.ok + "/" + s.seen + " trafień · powtórka " + fmtDue(s.due)
      : SKILLS[id].modul + " · jeszcze nie ćwiczone";
    leftCol.appendChild(el("div", "skill-sub", sub));
    const bar = el("div", "bar" + (pct >= 70 ? " good" : ""));
    bar.style.marginTop = "8px";
    const fill = el("i"); fill.style.width = pct + "%"; bar.appendChild(fill);
    leftCol.appendChild(bar);
    rowEl.appendChild(leftCol);
    rowEl.appendChild(el("div", "skill-pct", pct + "%"));
    c2.appendChild(rowEl);
  }
  root.appendChild(c2);

  const c3 = el("div", "card");
  c3.appendChild(el("h2", null, "Ustawienia"));
  c3.appendChild(el("p", null, "Metoda rzutowania używana w zadaniach i w trybie Buduj. " +
    "Polska norma to metoda pierwszego kąta."));
  const tg = el("div", "toggle");
  const mk = (val, txt) => {
    const b = el("button", State.method === val ? "on" : "", txt);
    b.onclick = () => { State.method = val; save(); render(); };
    return b;
  };
  tg.appendChild(mk("E", "Pierwszego kąta (E)"));
  tg.appendChild(mk("A", "Trzeciego kąta (A)"));
  c3.appendChild(tg);

  const lvlRow = el("div", "row mt");
  lvlRow.appendChild(el("span", "muted", "Poziom trudności ustawia się sam, ale możesz go zmienić ręcznie:"));
  const dn = el("button", "btn ghost sm", "−");
  dn.onclick = () => { State.level = clamp(State.level - 1, 1, 8); State.recent = []; save(); render(); };
  const up = el("button", "btn ghost sm", "+");
  up.onclick = () => { State.level = clamp(State.level + 1, 1, 8); State.recent = []; save(); render(); };
  lvlRow.appendChild(dn); lvlRow.appendChild(el("b", null, String(State.level))); lvlRow.appendChild(up);
  c3.appendChild(lvlRow);

  const rst = el("div", "row mt");
  const rb = el("button", "btn danger sm", "Wyczyść wszystkie postępy");
  rb.onclick = () => {
    if (!window.confirm("Usunąć cały zapisany postęp? Tej operacji nie da się cofnąć.")) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    State.skills = {}; State.seen = 0; State.ok = 0; State.streak = 0; State.best = 0;
    State.recent = []; State.lastSkills = []; State.diag = null; State.diagPost = null; State.diagPostAttempts = 0;
    State.sessions = 0; State.level = 2;
    State.course = { mods: {}, exam: null }; UI.module = null;
    for (const id of SKILL_IDS) skillOf(id);
    save(); render();
  };
  rst.appendChild(rb);
  c3.appendChild(rst);
  const note = el("p", "muted");
  note.style.marginTop = "12px";
  note.textContent = "Postęp zapisuje się w pamięci przeglądarki na tym urządzeniu. Tryb prywatny i czyszczenie danych witryny go usuwają.";
  c3.appendChild(note);
  root.appendChild(c3);
}

function renderNav() {

    const b = el("button", UI.screen === t[0] ? "on" : "", t[1]);

    // końcowego, był osiągalny tylko okrężną drogą przez zakładkę Postępy.

function renderHud() {
  const hud = $("#hud");
  hud.innerHTML = "";
  const chip = (label, value, hot) => {
    const c = el("div", "chip" + (hot ? " hot" : ""));
    c.appendChild(document.createTextNode(label));
    c.appendChild(el("b", null, String(value)));
    return c;
  };

  renderHud();
  renderNav();
  const root = $("#view");
  root.innerHTML = "";

    const c = el("div", "fb err");

  if (UI.screen === "kurs")         screenKurs(root);
  else if (UI.screen === "trening") screenTrening(root);
  else if (UI.screen === "buduj")   screenBuduj(root);
  else if (UI.screen === "szkicuj") screenSzkicuj(root);
  else if (UI.screen === "teoria")  screenTeoria(root);
  else                              screenPostepy(root);
}
