const COURSE_BY_ID = {};
for (const m of COURSE) COURSE_BY_ID[m.id] = m;
const COURSE_MINUTES = COURSE.reduce((a, m) => a + parseInt(m.time, 10), 0);

const EXAM = {
  pass: 11,
  specs: [
    { skill: "liczenie",    n: 1, level: 4 },
    { skill: "plan-bryla",  n: 1, level: 4 },
    { skill: "szkic",       n: 1, level: 3, opts: { from: "plan" } },
    { skill: "bryla-rzut",  n: 2, level: 4 },
    { skill: "rzuty-bryla", n: 2, level: 4 },
    { skill: "skos",        n: 1, level: 4 },
    { skill: "elipsa",      n: 1, level: 4 },
    { skill: "obrot",       n: 1, level: 4, opts: { axes: ["z"] } },
    { skill: "obrot",       n: 1, level: 5, opts: { axes: ["x", "y"] } },
    { skill: "odbicie",     n: 1, level: 4 },
    { skill: "przekroj",    n: 1, level: 4 },
    { skill: "uklad",       n: 1 },
  ],
};
EXAM.total = EXAM.specs.reduce((a, s) => a + s.n, 0);

function courseProgress(id) {
  if (!State.course.mods[id]) State.course.mods[id] = { drill: false, best: 0, passed: false, attempts: 0, built: false };
  const pr = State.course.mods[id];
  if (pr.attempts == null) pr.attempts = 0;
  if (pr.built == null) pr.built = false;
  return pr;
}
function moduleIndex(id) { for (let i = 0; i < COURSE.length; i++) if (COURSE[i].id === id) return i; return -1; }
/** Moduł jest otwarty, gdy poprzedni jest zaliczony — albo gdy sam był już zaliczony.
    Drugi warunek chroni postęp sprzed dodania nowych modułów w środku kursu. */
function moduleUnlocked(i) { return i === 0 || courseProgress(COURSE[i - 1].id).passed || courseProgress(COURSE[i].id).passed; }
function passedCount() { let n = 0; for (const m of COURSE) if (courseProgress(m.id).passed) n++; return n; }
function examUnlocked() { return passedCount() === COURSE.length; }
function courseDone() { return !!(State.course.exam && State.course.exam.passed); }

function expandQueue(specs, mix) {
  const out = [];
  for (const sp of specs) for (let i = 0; i < sp.n; i++) out.push({ skill: sp.skill, level: sp.level, opts: sp.opts });
  return mix ? shuffle(out) : out;
}

/* ── Ekran główny kursu ── */
function screenKurs(root) {
  if (Session.active && String(Session.mode).indexOf("kurs") === 0) {
    root.appendChild(courseSessionBar());
    renderQuestion(root);
    return;
  }
  if (Session.summary && String(Session.summary.mode).indexOf("kurs") === 0) { courseSummary(root); return; }
  if (UI.module) { moduleDetail(root, UI.module); return; }
  syllabus(root);
}

function courseSessionBar() {
  const m = COURSE_BY_ID[Session.moduleId];
  const stage = Session.mode === "kurs-drill" ? "Ćwiczenia" : Session.mode === "kurs-test" ? "Sprawdzian" : "Egzamin końcowy";
  const c = el("div", "card");
  const row = el("div", "row");
  row.appendChild(el("div", "q-tag", stage));
  row.appendChild(el("b", null, m ? m.title : "Egzamin końcowy"));
  row.appendChild(el("div", "spacer"));
  const stop = el("button", "btn ghost sm", "Przerwij");
  stop.onclick = () => {
    if (Session.mode !== "kurs-drill" &&
        !window.confirm("Przerwać? Wynik tego podejścia nie zostanie zapisany, ale samo podejście jest liczone.")) return;
    Session.active = false; Session.summary = null;
    UI.module = Session.moduleId; render();
  };
  row.appendChild(stop);
  row.style.alignItems = "center";
  c.appendChild(row);
  c.style.padding = "14px 18px";
  return c;
}

/* ── Spis modułów ── */
function syllabus(root) {
  const done = passedCount();

  const intro = el("div", "card");
  intro.appendChild(el("h1", null, "Kurs izometryki"));
  intro.appendChild(el("p", "lead",
    COURSE.length + " modułów w ustalonej kolejności, każdy zamknięty sprawdzianem, na końcu egzamin. " +
    "Kolejny moduł otwiera się po zaliczeniu poprzedniego. Całość zajmuje około " +
    Math.round(COURSE_MINUTES / 10) * 10 + " minut."));
  const bar = el("div", "bar good");
  bar.style.margin = "16px 0 8px";
  const fill = el("i"); fill.style.width = (done / COURSE.length * 100) + "%"; bar.appendChild(fill);
  intro.appendChild(bar);
  intro.appendChild(el("div", "muted", "Zaliczone moduły: " + done + " z " + COURSE.length +
    (courseDone() ? " · kurs ukończony" : "")));
  if (!State.diag && done === 0) {
    const n = el("div", "note");
    n.textContent = "Zanim zaczniesz: zrób test wstępny. Osiem zadań na obroty, kilka minut. " +
      "Bez niego nie da się na końcu zmierzyć, ile kurs Ci dał.";
    intro.appendChild(n);
    const b = el("button", "btn ghost sm", "Test wstępny (8 zadań)");
    b.onclick = () => startSession({ mode: "diag" });
    intro.appendChild(b);
  } else if (courseDone() && State.diag && !State.diagPost) {
    const n = el("div", "note");
    n.textContent = "Kurs ukończony. Zrób teraz test końcowy — to samo narzędzie co test wstępny, więc wynik pokaże przyrost.";
    intro.appendChild(n);
    const b = el("button", "btn sm", "Test końcowy (8 zadań)");
    b.onclick = () => startSession({ mode: "post" });
    intro.appendChild(b);
  }
  root.appendChild(intro);

  if (courseDone()) root.appendChild(certificate());

  const list = el("div", "card");
  COURSE.forEach((m, i) => {
    const pr = courseProgress(m.id);
    const unlocked = moduleUnlocked(i);
    const row = el("button", "mod" + (pr.passed ? " done" : "") + (unlocked ? "" : " locked"));
    row.type = "button";
    if (!unlocked) row.setAttribute("aria-disabled", "true");
    row.appendChild(el("div", "mod-num", pr.passed ? "✓" : String(i + 1)));
    const body = el("div", "mod-body");
    body.appendChild(el("div", "mod-title", m.title));
    body.appendChild(el("div", "mod-meta", m.time + " · " +
      (pr.passed ? "sprawdzian " + pr.best + "/" + (m.test.reduce((a, t) => a + t.n, 0)) :
       unlocked ? "gotowy do rozpoczęcia" : "wymaga zaliczenia modułu " + i)));
    row.appendChild(body);
    const badge = el("div", "mod-badge " + (pr.passed ? "badge-done" : unlocked ? "badge-open" : "badge-lock"),
      pr.passed ? "zaliczony" : unlocked ? "otwarty" : "zamknięty");
    row.appendChild(badge);
    if (unlocked) row.onclick = () => { UI.module = m.id; render(); };
    list.appendChild(row);
  });

  // Egzamin końcowy
  const ex = State.course.exam;
  const exOpen = examUnlocked();
  const exRow = el("button", "mod" + (courseDone() ? " done" : "") + (exOpen ? "" : " locked"));
  exRow.type = "button";
  if (!exOpen) exRow.setAttribute("aria-disabled", "true");
  exRow.appendChild(el("div", "mod-num", courseDone() ? "✓" : "★"));
  const eb = el("div", "mod-body");
  eb.appendChild(el("div", "mod-title", "Egzamin końcowy"));
  eb.appendChild(el("div", "mod-meta", EXAM.total + " zadań ze wszystkich modułów · próg zaliczenia " + EXAM.pass + "/" + EXAM.total +
    (ex ? " · najlepszy wynik " + ex.score + "/" + ex.total : "")));
  exRow.appendChild(eb);
  exRow.appendChild(el("div", "mod-badge " + (courseDone() ? "badge-done" : exOpen ? "badge-open" : "badge-lock"),
    courseDone() ? "zdany" : exOpen ? "otwarty" : "zamknięty"));
  if (exOpen) exRow.onclick = () => startSession({ mode: "kurs-exam", queue: expandQueue(EXAM.specs, true) });
  list.appendChild(exRow);
  root.appendChild(list);
}

/* ── Widok pojedynczego modułu ── */
function moduleDetail(root, id) {
  const m = COURSE_BY_ID[id];
  const i = moduleIndex(id);
  const pr = courseProgress(id);
  const testTotal = m.test.reduce((a, t) => a + t.n, 0);
  const drillTotal = m.drill.reduce((a, t) => a + t.n, 0);

  const head = el("div", "card");
  const back = el("button", "btn ghost sm", "← Spis modułów");
  back.onclick = () => { UI.module = null; render(); };
  head.appendChild(back);
  const h = el("h1"); h.style.marginTop = "14px";
  h.textContent = "Moduł " + (i + 1) + ". " + m.title;
  head.appendChild(h);
  head.appendChild(el("div", "muted", m.time + (pr.passed ? " · moduł zaliczony" : "")));
  const goal = el("div", "note");
  goal.textContent = "Cel: " + m.goal;
  head.appendChild(goal);
  root.appendChild(head);

  const th = el("div", "card");
  th.appendChild(el("h3", null, "1. Teoria"));
  th.style.paddingBottom = "6px";
  root.appendChild(th);
  renderLessons(root, m.lessons, true);

  const act = el("div", "card");
  act.appendChild(el("h3", null, "2. Ćwiczenia i sprawdzian"));
  act.appendChild(el("p", null,
    "Ćwiczenia (" + drillTotal + " zadań) mają informację zwrotną po każdej odpowiedzi i nie są oceniane. " +
    "Sprawdzian (" + testTotal + " zadań) wymaga " + m.pass + " poprawnych odpowiedzi, żeby otworzyć kolejny moduł."));
  const row = el("div", "row mt");
  const bd = el("button", "btn" + (pr.drill ? " ghost" : ""), (pr.drill ? "Powtórz ćwiczenia" : "Ćwiczenia") + " (" + drillTotal + ")");
  bd.onclick = () => startSession({ mode: "kurs-drill", moduleId: id, queue: expandQueue(m.drill, false) });
  row.appendChild(bd);
  const bt = el("button", "btn" + (pr.drill ? "" : " ghost"), (pr.passed ? "Popraw sprawdzian" : "Sprawdzian") + " (" + testTotal + ")");
  bt.onclick = () => startSession({ mode: "kurs-test", moduleId: id, queue: expandQueue(m.test, true) });
  row.appendChild(bt);
  if (m.build) {
    const bb = el("button", "btn ghost", pr.built ? "Powtórz zadanie konstrukcyjne" : "Zadanie konstrukcyjne");
    bb.onclick = () => { Builder.courseModule = id; newBuild(); UI.screen = "buduj"; render(); };
    row.appendChild(bb);
  }
  act.appendChild(row);
  if (m.build) act.appendChild(el("div", "muted", pr.built
    ? "Zadanie konstrukcyjne zaliczone."
    : "Zadanie konstrukcyjne: odtwórz bryłę z rzutów w trybie Buduj. Nie jest wymagane do zaliczenia modułu."));
  if (!pr.drill) act.appendChild(el("div", "muted", "Zalecana kolejność: najpierw ćwiczenia, potem sprawdzian."));
  if (pr.attempts) act.appendChild(el("div", "muted", "Podejść do sprawdzianu: " + pr.attempts +
    (pr.best ? " · najlepszy wynik " + pr.best + " / " + testTotal : " · brak ukończonego podejścia")));
  if (m.tip) { const t = el("div", "note"); t.textContent = m.tip; act.appendChild(t); }
  root.appendChild(act);
}

/* ── Podsumowanie etapu kursu ── */
function courseSummary(root) {
  const s = Session.summary;
  const m = COURSE_BY_ID[s.moduleId];
  const i = m ? moduleIndex(m.id) : -1;
  const card = el("div", "card center");
  const back = () => { Session.summary = null; };

  if (s.mode === "kurs-drill") {
    card.appendChild(el("h2", null, "Ćwiczenia zakończone"));
    const big = el("div", "stat-n", s.ok + " / " + s.len); big.style.fontSize = "42px";
    card.appendChild(big);
    card.appendChild(el("p", null, "Ćwiczenia nie są oceniane. Gdy czujesz się pewnie, przejdź do sprawdzianu."));
    const row = el("div", "row center mt"); row.style.justifyContent = "center";
    const b1 = el("button", "btn", "Sprawdzian (" + m.test.reduce((a, t) => a + t.n, 0) + ")");
    b1.onclick = () => { back(); startSession({ mode: "kurs-test", moduleId: m.id, queue: expandQueue(m.test, true) }); };
    row.appendChild(b1);
    const b2 = el("button", "btn ghost", "Powtórz ćwiczenia");
    b2.onclick = () => { back(); startSession({ mode: "kurs-drill", moduleId: m.id, queue: expandQueue(m.drill, false) }); };
    row.appendChild(b2);
    const b3 = el("button", "btn ghost", "Wróć do modułu");
    b3.onclick = () => { back(); UI.module = m.id; render(); };
    row.appendChild(b3);
    card.appendChild(row);

  } else if (s.mode === "kurs-test") {
    const ok = s.ok >= m.pass;
    card.appendChild(el("h2", null, ok ? "Moduł zaliczony" : "Sprawdzian niezaliczony"));
    const big = el("div", "stat-n", s.ok + " / " + s.len);
    big.style.fontSize = "42px"; big.style.color = ok ? "var(--good)" : "var(--bad)";
    card.appendChild(big);
    card.appendChild(el("p", null, ok
      ? "Próg wynosił " + m.pass + ". Kolejny moduł jest już otwarty."
      : "Do zaliczenia brakuje " + (m.pass - s.ok) + " poprawnych odpowiedzi. Wróć do ćwiczeń i spróbuj ponownie."));
    const row = el("div", "row center mt"); row.style.justifyContent = "center";
    if (ok && i + 1 < COURSE.length) {
      const b1 = el("button", "btn", "Moduł " + (i + 2) + ": " + COURSE[i + 1].title);
      b1.onclick = () => { back(); UI.module = COURSE[i + 1].id; render(); };
      row.appendChild(b1);
    } else if (ok && examUnlocked()) {
      const b1 = el("button", "btn", "Egzamin końcowy");
      b1.onclick = () => { back(); startSession({ mode: "kurs-exam", queue: expandQueue(EXAM.specs, true) }); };
      row.appendChild(b1);
    }
    const b2 = el("button", "btn" + (ok ? " ghost" : ""), ok ? "Powtórz sprawdzian" : "Powtórz ćwiczenia");
    b2.onclick = () => {
      back();
      if (ok) startSession({ mode: "kurs-test", moduleId: m.id, queue: expandQueue(m.test, true) });
      else    startSession({ mode: "kurs-drill", moduleId: m.id, queue: expandQueue(m.drill, false) });
    };
    row.appendChild(b2);
    const b3 = el("button", "btn ghost", "Spis modułów");
    b3.onclick = () => { back(); UI.module = null; render(); };
    row.appendChild(b3);
    card.appendChild(row);

  } else {
    const ok = s.ok >= EXAM.pass;
    card.appendChild(el("h2", null, ok ? "Egzamin zdany" : "Egzamin niezaliczony"));
    const big = el("div", "stat-n", s.ok + " / " + s.len);
    big.style.fontSize = "42px"; big.style.color = ok ? "var(--good)" : "var(--bad)";
    card.appendChild(big);
    card.appendChild(el("p", null, ok
      ? "Kurs ukończony. Certyfikat znajdziesz na stronie spisu modułów."
      : "Próg wynosi " + EXAM.pass + " z " + s.len + ". Wróć do modułów, w których idzie Ci najsłabiej — pokazuje je zakładka Postępy."));
    const row = el("div", "row center mt"); row.style.justifyContent = "center";
    const b1 = el("button", "btn", ok ? "Zobacz certyfikat" : "Spis modułów");
    b1.onclick = () => { back(); UI.module = null; render(); };
    row.appendChild(b1);
    if (!ok) {
      const b2 = el("button", "btn ghost", "Powtórz egzamin");
      b2.onclick = () => { back(); startSession({ mode: "kurs-exam", queue: expandQueue(EXAM.specs, true) }); };
      row.appendChild(b2);
    }
    card.appendChild(row);
  }
  root.appendChild(card);
}

/* ── Certyfikat ── */
function certificate() {
  const ex = State.course.exam;
  const box = el("div", "card");
  const c = el("div", "cert");
  c.appendChild(el("div", "cert-seal", "◆"));
  c.appendChild(el("h2", null, "KURS UKOŃCZONY"));
  c.appendChild(el("div", "meta", "Izometryka i czytanie rysunku technicznego"));
  c.appendChild(el("div", "who", "Zaliczono " + passedCount() + " z " + COURSE.length + " modułów oraz egzamin końcowy"));
  const d = new Date(ex.date);
  c.appendChild(el("div", "meta", "Wynik egzaminu: " + ex.score + " / " + ex.total +
    " · data: " + d.toLocaleDateString("pl-PL")));
  // Przyrost liczy się tylko między testem wstępnym a końcowym — to samo
  // narzędzie. Wcześniej porównywano test wstępny z egzaminem, czyli dwa
  // różne narzędzia, i różnica niczego nie mierzyła.
  const g = measuredGain();
  c.appendChild(el("div", "meta", g.ok
    ? "Test wstępny " + g.pre + "% → test końcowy " + g.post + "% (" + (g.delta >= 0 ? "+" : "") + g.delta + " pkt proc.)" + attemptNote(g)
    : "Przyrost niezmierzony: " + g.why));
  let att = 0;
  for (const m of COURSE) att += courseProgress(m.id).attempts;
  c.appendChild(el("div", "meta", "Łączna liczba podejść do sprawdzianów: " + att));
  const disc = el("div", "meta");
  disc.style.cssText = "margin-top:18px;font-size:11px;color:#6a7a86;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.6";
  disc.textContent = "Zapis nauki własnej. Wynik powstaje w przeglądarce na tym urządzeniu, " +
    "nie jest przez nikogo weryfikowany ani poświadczany i nie stanowi dokumentu potwierdzającego kwalifikacje.";
  c.appendChild(disc);
  box.appendChild(c);
  const row = el("div", "row mt"); row.style.justifyContent = "center";
  const pr = el("button", "btn ghost sm", "Drukuj / zapisz PDF");
  pr.onclick = () => window.print();
  row.appendChild(pr);
  box.appendChild(row);
  return box;
}
