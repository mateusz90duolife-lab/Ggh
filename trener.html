<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO Master — Trener Izometryki</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   ISO MASTER — TRENER IZOMETRYKI
   Aplikacja jednoplikowa, bez zależności, działa offline.
   Metodyka i źródła: METODYKA.md
   ═══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0D0D0D;
  --bg-soft:   #151515;
  --card:      #1a1a1a;
  --card-hi:   #202028;
  --line:      #2a2a2a;
  --line-hi:   #3a3a48;
  --txt:       #EAEAEA;
  --txt-dim:   #8a8a8a;
  --txt-faint: #5a5a5a;
  --accent:    #00C2FF;
  --accent-dk: #007ea8;
  --good:      #30D158;
  --bad:       #FF3B30;
  --warn:      #FFD60A;
  --radius:    10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--txt);
  min-height: 100vh; font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ───── UKŁAD ───── */
.shell { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,13,13,0.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 18px;
  padding: 12px 0; margin-bottom: 22px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 1.5px; font-size: 15px; }
.brand span { color: var(--accent); }
.spacer { flex: 1; }

.hud { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 13px; font-size: 12px; color: var(--txt-dim);
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip b { color: var(--txt); font-size: 13px; }
.chip.hot b { color: var(--warn); }

/* ───── NAWIGACJA ───── */
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 24px; }
.nav button {
  background: transparent; border: 1px solid transparent; color: var(--txt-dim);
  padding: 9px 16px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-family: inherit; transition: all .15s;
}
.nav button:hover { background: var(--bg-soft); color: var(--txt); }
.nav button.on { background: #10222e; border-color: #1d4a63; color: var(--accent); font-weight: 600; }

/* ───── KARTY ───── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
.card.pad0 { padding: 0; overflow: hidden; }

h1 { font-size: 24px; margin-bottom: 6px; letter-spacing: -0.3px; }
h2 { font-size: 19px; margin-bottom: 14px; letter-spacing: -0.2px; }
h3 { font-size: 15px; margin-bottom: 10px; color: var(--txt); }
p  { color: var(--txt-dim); margin-bottom: 10px; }
p.lead { color: var(--txt); }
a { color: var(--accent); }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9em; background: #000; padding: 2px 6px; border-radius: 4px; color: var(--accent); }

/* ───── PRZYCISKI ───── */
button.btn {
  background: var(--accent); border: none; color: #062a38;
  padding: 11px 22px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 700; font-family: inherit;
  transition: opacity .15s, transform .08s;
}
button.btn:hover:not(:disabled) { opacity: .88; }
button.btn:active:not(:disabled) { transform: scale(.975); }
button.btn:disabled { opacity: .35; cursor: not-allowed; }
button.btn.ghost { background: transparent; border: 1px solid var(--line-hi); color: var(--txt); }
button.btn.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.btn.danger { background: transparent; border: 1px solid #4a2020; color: #b04b44; }
button.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
button.btn.sm { padding: 7px 14px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ───── ZADANIE ───── */
.q-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.q-tag {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); background: #0d2230; border: 1px solid #1d4a63;
  padding: 4px 10px; border-radius: 5px; white-space: nowrap;
}
.q-text { font-size: 17px; color: var(--txt); flex: 1; min-width: 240px; line-height: 1.45; }
.q-hint { font-size: 13px; color: var(--txt-faint); margin-top: 5px; }

.stimulus { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; align-items: flex-start; padding: 18px 0 6px; }

/* ───── OPCJE ODPOWIEDZI ───── */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.opt {
  background: var(--bg-soft); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 12px; cursor: pointer; text-align: center;
  transition: border-color .12s, background .12s, transform .08s;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.opt:hover:not(.locked) { border-color: var(--accent); background: var(--card-hi); }
.opt:active:not(.locked) { transform: scale(.985); }
.opt .lbl { font-size: 12px; color: var(--txt-faint); font-weight: 700; letter-spacing: 1px; }
.opt.locked { cursor: default; }
.opt.correct { border-color: var(--good); background: #0e2415; }
.opt.correct .lbl { color: var(--good); }
.opt.wrong   { border-color: var(--bad);  background: #2a1210; }
.opt.wrong .lbl { color: var(--bad); }
.opt.dim { opacity: .4; }

/* ───── INFORMACJA ZWROTNA ───── */
.fb { margin-top: 18px; border-radius: var(--radius); padding: 16px 18px; border: 1px solid; animation: rise .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fb.ok  { background: #0e2415; border-color: #245c34; }
.fb.err { background: #241210; border-color: #5c2420; }
.fb-title { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-size: 15px; }
.fb.ok  .fb-title { color: var(--good); }
.fb.err .fb-title { color: var(--bad); }
.fb-body { color: #bdbdbd; font-size: 14px; }
.fb-body b { color: var(--txt); }

/* ───── PODPISY POD RYSUNKAMI ───── */
.fig { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.fig-cap { font-size: 11px; color: var(--txt-faint); text-transform: uppercase; letter-spacing: 1.2px; text-align: center; }
canvas { display: block; max-width: 100%; }
.canvas-frame { background: #0a0a12; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }

/* ───── PASKI POSTĘPU ───── */
.bar { height: 7px; background: #000; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-dk), var(--accent)); border-radius: 999px; transition: width .35s ease; }
.bar.good > i { background: linear-gradient(90deg, #1d7a38, var(--good)); }

.skill { display: grid; grid-template-columns: 1fr 90px; gap: 12px 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.skill:last-child { border-bottom: 0; }
.skill-name { font-size: 14px; }
.skill-sub { font-size: 12px; color: var(--txt-faint); margin-top: 3px; }
.skill-pct { text-align: right; font-size: 13px; color: var(--txt-dim); font-variant-numeric: tabular-nums; }

/* ───── STATYSTYKI ───── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: center; }
.stat-n { font-size: 28px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; color: var(--txt-faint); margin-top: 3px; }

/* ───── EDYTOR PLANU (TRYB BUDUJ) ───── */
.plan-grid { display: inline-grid; gap: 4px; background: var(--line); padding: 4px; border-radius: 8px; }
.plan-cell {
  width: 46px; height: 46px; background: #12121a; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; cursor: pointer; user-select: none;
  color: var(--txt-faint); transition: background .1s, color .1s;
  border: 1px solid transparent;
}
.plan-cell:hover { border-color: var(--accent); }
.plan-cell.set { background: #10303f; color: var(--accent); }
.plan-axis { font-size: 10px; color: var(--txt-faint); text-transform: uppercase; letter-spacing: 1px; }

/* ───── TEORIA ───── */
.lesson { border-bottom: 1px solid var(--line); }
.lesson:last-child { border-bottom: 0; }
.lesson-h {
  padding: 16px 22px; cursor: pointer; display: flex; align-items: center; gap: 12px;
  font-weight: 600; font-size: 15px; transition: background .12s;
}
.lesson-h:hover { background: var(--bg-soft); }
.lesson-h .caret { color: var(--txt-faint); transition: transform .2s; font-size: 12px; }
.lesson.open .lesson-h .caret { transform: rotate(90deg); }
.lesson-b { padding: 0 22px 22px; display: none; }
.lesson.open .lesson-b { display: block; }
.lesson-b ul { margin: 0 0 12px 20px; color: var(--txt-dim); }
.lesson-b li { margin-bottom: 6px; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
table.tbl th, table.tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
table.tbl th { color: var(--txt-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
table.tbl td { color: var(--txt-dim); }
table.tbl td b { color: var(--txt); }

.note { background: #0d1c26; border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 0 6px 6px 0; margin: 14px 0; font-size: 14px; color: #a8c4d0; }

/* ───── UKŁAD RZUTÓW ───── */
.views-layout { display: grid; gap: 10px; justify-content: center; }
.views-card { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 12px; background: #101014; }
.view-slot { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.view-slot.empty { visibility: hidden; }

.toggle { display: inline-flex; border: 1px solid var(--line-hi); border-radius: 7px; overflow: hidden; }
.toggle button {
  background: transparent; border: 0; color: var(--txt-dim); padding: 7px 14px;
  cursor: pointer; font-size: 13px; font-family: inherit;
}
.toggle button.on { background: var(--accent); color: #062a38; font-weight: 700; }

/* ───── KURS ───── */
.mod {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px;
  background: var(--bg-soft); cursor: pointer; transition: border-color .12s, background .12s;
}
.mod:hover:not(.locked) { border-color: var(--accent); background: var(--card-hi); }
.mod.locked { opacity: .45; cursor: not-allowed; }
.mod.done { border-color: #245c34; }
.mod-num {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; background: #10222e; color: var(--accent); border: 1px solid #1d4a63;
}
.mod.done .mod-num { background: #0e2415; color: var(--good); border-color: #245c34; }
.mod-body { flex: 1; min-width: 0; }
.mod-title { font-size: 15px; font-weight: 600; }
.mod-meta { font-size: 12px; color: var(--txt-faint); margin-top: 3px; }
.mod-badge { font-size: 11px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid; }
.badge-done { color: var(--good); border-color: #245c34; background: #0e2415; }
.badge-open { color: var(--accent); border-color: #1d4a63; background: #0d2230; }
.badge-lock { color: var(--txt-faint); border-color: var(--line); }

.cert { border: 2px solid var(--accent); border-radius: 14px; padding: 40px 32px; text-align: center;
        background: linear-gradient(160deg, #0e2230, #0c1620); }
.cert h2 { font-size: 26px; color: var(--accent); margin-bottom: 6px; letter-spacing: 1px; }
.cert .who { font-size: 15px; color: var(--txt); margin: 18px 0 6px; }
.cert .meta { font-size: 13px; color: var(--txt-dim); }
.cert-seal { font-size: 44px; margin-bottom: 10px; }

@media print {
  body { background: #fff; color: #000; }
  .topbar, .nav, button { display: none !important; }
  .cert { border-color: #000; background: #fff; }
  .cert h2, .cert .who, .cert .meta { color: #000; }
}

/* ───── DOSTĘPNOŚĆ ─────
   Opcje odpowiedzi, pola planu, pozycje kursu i nagłówki lekcji są
   przyciskami, więc działają z klawiatury i są zapowiadane przez czytniki
   ekranu. Poniższe reguły zdejmują z nich domyślny wygląd przycisku. */
.opt, .plan-cell, .mod, .lesson-h {
  font: inherit; color: inherit; margin: 0; -webkit-appearance: none; appearance: none;
}
.opt { width: 100%; text-align: center; }
.mod { width: 100%; text-align: left; }
.lesson-h { width: 100%; text-align: left; background: transparent; border: 0; }
.plan-cell { line-height: 1; }
.mod[aria-disabled="true"], .opt[aria-disabled="true"] { cursor: default; }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
.psvt { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.psvt-arrow { font-size: 26px; color: var(--txt-faint); }
.psvt-sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 14px; }
.psvt-q {
  width: 152px; height: 132px; display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: var(--txt-faint); border: 2px dashed var(--line-hi); border-radius: 8px;
}
.method-cap {
  display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px;
  font-size: 11px; color: var(--txt-faint); text-transform: uppercase; letter-spacing: 1.2px;
}
.kbd-hint { font-size: 12px; color: var(--txt-faint); margin-top: 10px; }
kbd {
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
  background: #000; border: 1px solid var(--line-hi); border-radius: 4px;
  padding: 1px 5px; color: var(--txt-dim);
}

.sketch-box { display: flex; flex-direction: column; align-items: center; margin-top: 8px; }
.sketch-box .row { justify-content: center; }
.sketch-canvas { cursor: crosshair; touch-action: manipulation; }
.sketch-status { margin-top: 8px; min-height: 20px; text-align: center; }
.sketch-box .fb { align-self: stretch; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hide { display: none !important; }
.center { text-align: center; }
.mt { margin-top: 18px; }
.muted { color: var(--txt-faint); font-size: 13px; }

@media (max-width: 640px) {
  .shell { padding: 0 14px 60px; }
  .stimulus { gap: 16px; }
  .plan-cell { width: 40px; height: 40px; font-size: 15px; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">ISO<span>MASTER</span></div>
    <div class="hud" id="hud"></div>
    <div class="spacer"></div>
  </div>
  <div class="nav" id="nav"></div>
  <div id="view"></div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 1 — NARZĘDZIA
   ═══════════════════════════════════════════════════════════════ */

const $  = (sel, root) => (root || document).querySelector(sel);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const randInt = n => Math.floor(Math.random() * n);
const pick    = a => a[randInt(a.length)];
const clamp   = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = randInt(i + 1); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function setupCanvas(canvas, w, h) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width  = w + "px";
  canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return ctx;
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 2 — BRYŁA WOKSELOWA

   Układ współrzędnych (prawoskrętny, umowa aplikacji):
     x — szerokość, rośnie w PRAWO patrząc od przodu
     y — głębokość, rośnie w GŁĄB (y=0 to płaszczyzna najbliższa obserwatorowi)
     z — wysokość, rośnie w GÓRĘ
   ═══════════════════════════════════════════════════════════════ */

const K = (x, y, z) => x + "," + y + "," + z;

function makeSolid(cells) {
  let mnx = Infinity, mny = Infinity, mnz = Infinity;
  for (const c of cells) { if (c[0] < mnx) mnx = c[0]; if (c[1] < mny) mny = c[1]; if (c[2] < mnz) mnz = c[2]; }
  const norm = cells.map(c => [c[0] - mnx, c[1] - mny, c[2] - mnz]);
  norm.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  const set = new Set(norm.map(c => K(c[0], c[1], c[2])));
  let mxx = 0, mxy = 0, mxz = 0;
  for (const c of norm) { if (c[0] > mxx) mxx = c[0]; if (c[1] > mxy) mxy = c[1]; if (c[2] > mxz) mxz = c[2]; }
  return {
    cells: norm,
    set,
    nx: mxx + 1, ny: mxy + 1, nz: mxz + 1,
    count: norm.length,
    id: norm.map(c => K(c[0], c[1], c[2])).join("|"),
    has(x, y, z) { return set.has(K(x, y, z)); },
  };
}

function solidFromHeights(hm) {
  const cells = [];
  for (let x = 0; x < hm.length; x++)
    for (let y = 0; y < hm[x].length; y++)
      for (let z = 0; z < hm[x][y]; z++) cells.push([x, y, z]);
  return makeSolid(cells);
}

/** Mapa wysokości bryły. Wierna tylko dla brył bez nawisów (patrz isStackable). */
function heightsOf(solid) {
  const hm = Array.from({ length: solid.nx }, () => new Array(solid.ny).fill(0));
  for (const [x, y, z] of solid.cells) if (z + 1 > hm[x][y]) hm[x][y] = z + 1;
  return hm;
}

/** Czy bryła jest "postawiona" — każdy słupek pełny od z=0 w górę, bez nawisów. */
function isStackable(solid) {
  const hm = heightsOf(solid);
  let n = 0;
  for (let x = 0; x < solid.nx; x++) for (let y = 0; y < solid.ny; y++) n += hm[x][y];
  return n === solid.count;
}

/* ── Przekształcenia izometryczne (obroty o 90° i odbicia) ── */
const XF = {
  rotZ:  c => [ c[1], -c[0],  c[2]],   // 90° w prawo, patrząc z góry
  rotZi: c => [-c[1],  c[0],  c[2]],   // 90° w lewo
  rotX:  c => [ c[0], -c[2],  c[1]],   // wokół osi poziomej biegnącej w prawo
  rotXi: c => [ c[0],  c[2], -c[1]],
  rotY:  c => [ c[2],  c[1], -c[0]],   // wokół osi poziomej biegnącej w głąb
  rotYi: c => [-c[2],  c[1],  c[0]],
  mirX:  c => [-c[0],  c[1],  c[2]],   // odbicie lewo-prawo
  mirY:  c => [ c[0], -c[1],  c[2]],   // odbicie przód-tył
};

function xform(solid, fn, times) {
  let cells = solid.cells;
  for (let i = 0; i < (times || 1); i++) cells = cells.map(fn);
  return makeSolid(cells);
}

/* ── Modyfikacje używane do budowy dystraktorów ── */

/** Przenosi jedną kostkę z wierzchu jednego słupka na wierzch innego. */
function moveOneCube(solid) {
  const hm = heightsOf(solid);
  const tall = [], room = [];
  for (let x = 0; x < solid.nx; x++) for (let y = 0; y < solid.ny; y++) {
    if (hm[x][y] > 0) tall.push([x, y]);
    if (hm[x][y] > 0 && hm[x][y] < 6) room.push([x, y]);
  }
  for (let t = 0; t < 40; t++) {
    const from = pick(tall), to = pick(room);
    if (from[0] === to[0] && from[1] === to[1]) continue;
    if (hm[from[0]][from[1]] <= 1) continue;   // nie kasujemy całego słupka
    const h2 = hm.map(r => r.slice());
    h2[from[0]][from[1]]--; h2[to[0]][to[1]]++;
    const s = solidFromHeights(h2);
    if (s.id !== solid.id) return s;
  }
  return null;
}

/** Dokłada albo zabiera jedną kostkę. */
function addOrRemoveCube(solid, add) {
  const hm = heightsOf(solid);
  const spots = [];
  for (let x = 0; x < solid.nx; x++) for (let y = 0; y < solid.ny; y++) {
    if (add && hm[x][y] > 0) spots.push([x, y]);
    if (!add && hm[x][y] > 1) spots.push([x, y]);
  }
  if (!spots.length) return null;
  const [x, y] = pick(spots);
  const h2 = hm.map(r => r.slice());
  h2[x][y] += add ? 1 : -1;
  const s = solidFromHeights(h2);
  return s.id === solid.id ? null : s;
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 3 — GENERATOR BRYŁ
   Bryły powstają jako mapy wysokości, więc każda ma jednoznaczny
   plan kodowany (metodyka, sekcja 4).
   ═══════════════════════════════════════════════════════════════ */

function randomFootprint(W, D, n) {
  const start = [randInt(W), randInt(D)];
  const cells = [start];
  const seen  = new Set([start.join(",")]);
  const dirs  = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let guard = 0;
  while (cells.length < n && guard++ < 600) {
    const c = pick(cells), d = pick(dirs);
    const nx = c[0] + d[0], ny = c[1] + d[1];
    if (nx < 0 || ny < 0 || nx >= W || ny >= D) continue;
    const k = nx + "," + ny;
    if (seen.has(k)) continue;
    seen.add(k); cells.push([nx, ny]);
  }
  return cells;
}

function isFullBox(s) { return s.count === s.nx * s.ny * s.nz; }

/** Bryła chiralna: jej odbicia lustrzanego nie da się uzyskać żadnym z 24 obrotów.
    Pierwsza wersja sprawdzała tylko mirX, mirY i rotZ, więc przepuszczała bryły
    z płaszczyzną symetrii po przekątnej — na najniższym poziomie 45% losowań.
    Dla takiej bryły „odbicie" jest zwykłym obrotem, a informacja zwrotna
    „odbicia nie da się uzyskać obrotem" była nieprawdziwa. */
function isChiral(s) {
  const m = xform(s, XF.mirX);
  for (const g of cubeRotations()) if (applySeq(m, g).id === s.id) return false;
  return true;
}

/** Bryła nadaje się do zadań na obrót i odbicie: chiralna i bez symetrii
    obrotowej wokół osi pionowej (inaczej obrót niczego by nie zmieniał). */
function isChiralEnough(s) {
  return isChiral(s) && xform(s, XF.rotZ).id !== s.id && xform(s, XF.rotZ, 2).id !== s.id;
}

function generateSolid(cfg) {
  for (let attempt = 0; attempt < 300; attempt++) {
    const n = cfg.minFoot + randInt(cfg.maxFoot - cfg.minFoot + 1);
    const foot = randomFootprint(cfg.w, cfg.d, n);
    if (foot.length < cfg.minFoot) continue;
    const hm = Array.from({ length: cfg.w }, () => new Array(cfg.d).fill(0));
    for (const f of foot) hm[f[0]][f[1]] = 1 + randInt(cfg.maxH);
    const s = solidFromHeights(hm);
    if (s.count < cfg.minCubes || s.count > cfg.maxCubes) continue;
    if (isFullBox(s)) continue;
    if (s.nx < 2 || s.ny < 2) continue;
    if (cfg.chiral && !isChiralEnough(s)) continue;
    return s;
  }
  // Awaryjna bryła — chiralna, gdyby losowanie zawiodło. Poprzednia,
  // [[2,1],[1,3]], była symetryczna względem przekątnej, więc achiralna.
  return solidFromHeights([[3, 1], [2, 0]]);
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 4 — RENDER IZOMETRYCZNY

   Rzut izometryczny (kąty osi 30°):
     ekranX = (x + y) · s · cos30
     ekranY = (x − y) · s · sin30 − z · s
   Obserwator znajduje się z przodu, z prawej i od góry, więc widoczne
   są trzy ściany każdej kostki: górna, przednia i prawa.
   ═══════════════════════════════════════════════════════════════ */

const ISO_C = 0.8660254, ISO_S = 0.5;

function isoPt(x, y, z, s) {
  return { x: (x + y) * s * ISO_C, y: (x - y) * s * ISO_S - z * s };
}

function isoBounds(solid, s) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  for (const X of [0, solid.nx]) for (const Y of [0, solid.ny]) for (const Z of [0, solid.nz]) {
    const p = isoPt(X, Y, Z, s);
    if (p.x < a) a = p.x; if (p.x > b) b = p.x;
    if (p.y < c) c = p.y; if (p.y > d) d = p.y;
  }
  return { minX: a, minY: c, w: b - a, h: d - c };
}

/** Skala, przy której bryła mieści się w płótnie. */
function isoFitScale(solid, W, H, pad) {
  const u = isoBounds(solid, 1);
  return Math.min((W - 2 * pad) / u.w, (H - 2 * pad) / u.h);
}

/** Wspólna skala dla zestawu brył — bez niej opcje odpowiedzi miałyby
    różną wielkość, co samo w sobie podpowiadałoby odpowiedź. */
function sharedIsoScale(solids, W, H, pad) {
  let s = Infinity;
  for (const sd of solids) s = Math.min(s, isoFitScale(sd, W, H, pad));
  return isFinite(s) ? s : 20;
}

function poly(ctx, pts, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.lineJoin = "round"; ctx.stroke(); }
}

function drawIso(canvas, solid, opt) {
  opt = opt || {};
  const W = opt.w || 190, H = opt.h || 165, pad = opt.pad == null ? 12 : opt.pad;
  const ctx = setupCanvas(canvas, W, H);
  const s = opt.scale || isoFitScale(solid, W, H, pad);
  const b = isoBounds(solid, s);
  const ox = (W - b.w) / 2 - b.minX;
  const oy = (H - b.h) / 2 - b.minY;

  const hue  = opt.hue == null ? 199 : opt.hue;
  const sat  = opt.sat == null ? 55  : opt.sat;
  const top  = "hsl(" + hue + "," + sat + "%,64%)";
  const front= "hsl(" + hue + "," + sat + "%,45%)";
  const side = "hsl(" + hue + "," + sat + "%,31%)";
  const edge = "hsl(" + hue + ",45%,14%)";

  const P = (x, y, z) => { const p = isoPt(x, y, z, s); return [p.x + ox, p.y + oy]; };

  // Malarz: od najdalszych do najbliższych. Obserwator w kierunku (+x, −y, +z).
  const order = solid.cells.slice().sort((a, c) => (a[0] - a[1] + a[2]) - (c[0] - c[1] + c[2]));
  for (const cell of order) {
    const x = cell[0], y = cell[1], z = cell[2];
    if (!solid.has(x, y, z + 1)) poly(ctx, [P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], top,   edge, 1);
    if (!solid.has(x, y - 1, z)) poly(ctx, [P(x, y, z),     P(x + 1, y, z),     P(x + 1, y, z + 1),     P(x, y, z + 1)],     front, edge, 1);
    if (!solid.has(x + 1, y, z)) poly(ctx, [P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], side,  edge, 1);
  }
  return ctx;
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 5 — RZUTY PROSTOKĄTNE

   Obraz rzutu to dokładnie to, co widzi obserwator z danej strony.
   Metoda rzutowania (pierwszego / trzeciego kąta) nie zmienia obrazu,
   zmienia wyłącznie ROZMIESZCZENIE rzutów na arkuszu.
   depth = odległość od obserwatora (0 = powierzchnia najbliższa),
   różnica głębokości między sąsiednimi polami daje widoczną krawędź.

   Linie jak w PN-EN ISO 128: krawędzie widoczne — zarys i krawędzie
   wewnątrz niego — ciągłą grubą, krawędzie niewidoczne cienką kreskową.
   Pierwsza wersja rysowała krawędzie wewnętrzne cienką linią ciągłą i nie
   pokazywała krawędzi niewidocznych, co było umową aplikacji, a nie normą.
   ═══════════════════════════════════════════════════════════════ */

const VIEW_LABEL = {
  front: "rzut z przodu",
  top:   "rzut z góry",
  left:  "rzut z lewej strony",
  right: "rzut z prawej strony",
};

function orthoView(solid, kind) {
  const nx = solid.nx, ny = solid.ny, nz = solid.nz;
  let cols, rows;
  if (kind === "front")      { cols = nx; rows = nz; }
  else if (kind === "top")   { cols = nx; rows = ny; }
  else                       { cols = ny; rows = nz; }

  const filled = [], depth = [];
  for (let r = 0; r < rows; r++) { filled.push(new Array(cols).fill(false)); depth.push(new Array(cols).fill(null)); }

  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let f = false, d = null;
    if (kind === "front") {                       // obserwator od przodu (−y)
      const x = c, z = nz - 1 - r;
      for (let y = 0; y < ny; y++) if (solid.has(x, y, z)) { f = true; d = y; break; }
    } else if (kind === "top") {                  // obserwator z góry (+z); tył u góry obrazu
      const x = c, y = ny - 1 - r;
      for (let z = nz - 1; z >= 0; z--) if (solid.has(x, y, z)) { f = true; d = nz - 1 - z; break; }
    } else if (kind === "left") {                 // obserwator z lewej (−x); tył po lewej obrazu
      const y = ny - 1 - c, z = nz - 1 - r;
      for (let x = 0; x < nx; x++) if (solid.has(x, y, z)) { f = true; d = x; break; }
    } else if (kind === "right") {                // obserwator z prawej (+x); przód po lewej obrazu
      const y = c, z = nz - 1 - r;
      for (let x = nx - 1; x >= 0; x--) if (solid.has(x, y, z)) { f = true; d = nx - 1 - x; break; }
    }
    filled[r][c] = f; depth[r][c] = d;
  }
  const v = { kind, cols, rows, filled, depth, label: VIEW_LABEL[kind] };
  v.hid = hiddenEdges(solid, v);
  v.id = viewSignature(v);
  return v;
}

/** Kostka bryły w układzie rzutu: wiersz r, kolumna c, warstwa t licząc od obserwatora. */
function viewCell(solid, kind, r, c, t) {
  const nx = solid.nx, ny = solid.ny, nz = solid.nz;
  if (kind === "front") return solid.has(c, t, nz - 1 - r);
  if (kind === "top")   return solid.has(c, ny - 1 - r, nz - 1 - t);
  if (kind === "left")  return solid.has(t, ny - 1 - c, nz - 1 - r);
  return solid.has(nx - 1 - t, c, nz - 1 - r);
}

/** Czy wzdłuż prostej, wokół której leżą cztery kostki, biegnie krawędź bryły.
    a1, a2 — kostki po jednej stronie granicy pól (warstwy t−1 i t), b1, b2 — po drugiej.
    Krawędzi nie ma, gdy wszystkie są pełne albo puste, oraz gdy dwie pełne
    tworzą płaską ścianę (ten sam bok albo ta sama warstwa). */
function edgeAlong(a1, a2, b1, b2) {
  const n = a1 + a2 + b1 + b2;
  if (n === 0 || n === 4) return false;
  if (n === 2 && ((a1 && a2) || (b1 && b2) || (a1 && b1) || (a2 && b2))) return false;
  return true;
}

/** Krawędzie niewidoczne rzutu: odcinki granic między polami o tej samej
    głębokości widocznej, wzdłuż których biegnie krawędź bryły położona głębiej.
    Gdzie głębokości się różnią, leży już krawędź widoczna — ona ma
    pierwszeństwo, więc pokrywająca się z nią krawędź niewidoczna nie jest
    rysowana. Klucz "h:r,c" to granica pod polem (r,c), "v:r,c" — na prawo od niego. */
function hiddenEdges(solid, view) {
  const T = view.kind === "front" ? solid.ny : view.kind === "top" ? solid.nz : solid.nx;
  const has = (r, c, t) => t >= 0 && t < T && viewCell(solid, view.kind, r, c, t) ? 1 : 0;
  const out = new Set();
  const check = (r1, c1, r2, c2, key) => {
    if (!view.filled[r1][c1] || !view.filled[r2][c2] || view.depth[r1][c1] !== view.depth[r2][c2]) return;
    for (let t = 0; t <= T; t++)
      if (edgeAlong(has(r1, c1, t - 1), has(r1, c1, t), has(r2, c2, t - 1), has(r2, c2, t))) { out.add(key); return; }
  };
  for (let r = 0; r < view.rows; r++) for (let c = 0; c < view.cols; c++) {
    if (r + 1 < view.rows) check(r, c, r + 1, c, "h:" + r + "," + c);
    if (c + 1 < view.cols) check(r, c, r, c + 1, "v:" + r + "," + c);
  }
  return out;
}

/** Dokładnie to, co drawOrtho narysuje: zarys, krawędzie widoczne i niewidoczne.
    Identyfikator oparty na samym wypełnieniu uznawał rzuty różniące się
    wyłącznie uskokami za duplikaty i usuwał je z opcji odpowiedzi —
    czyli kasował dokładnie tę różnicę, której uczy moduł o uskokach. */
function viewSignature(view) {
  const at = (r, c) => (r < 0 || c < 0 || r >= view.rows || c >= view.cols)
    ? null : (view.filled[r][c] ? view.depth[r][c] : null);
  const hid = view.hid || new Set();
  let sig = view.cols + "x" + view.rows + ":";
  for (let r = 0; r < view.rows; r++) for (let c = 0; c < view.cols; c++) {
    if (!view.filled[r][c]) { sig += "."; continue; }
    const d = view.depth[r][c];
    const hk = ["h:" + (r - 1) + "," + c, "h:" + r + "," + c, "v:" + r + "," + (c - 1), "v:" + r + "," + c];
    sig += "[";
    [at(r - 1, c), at(r + 1, c), at(r, c - 1), at(r, c + 1)].forEach((nb, i) => {
      sig += nb === null ? "T" : nb !== d ? "t" : hid.has(hk[i]) ? "h" : "-";
    });
    sig += "]";
  }
  return sig;
}

function drawOrtho(canvas, view, opt) {
  opt = opt || {};
  const cell = opt.cell || 20, pad = 11;
  const W = opt.w || (view.cols * cell + pad * 2);
  const H = opt.h || (view.rows * cell + pad * 2);
  const ctx = setupCanvas(canvas, W, H);
  const ox = (W - view.cols * cell) / 2;
  const oy = (H - view.rows * cell) / 2;

  ctx.fillStyle = opt.fill || "#2c3a4a";
  for (let r = 0; r < view.rows; r++) for (let c = 0; c < view.cols; c++)
    if (view.filled[r][c]) ctx.fillRect(ox + c * cell, oy + r * cell, cell, cell);

  const line = opt.line || "#d8e6f0";

  // Kład (figura przekroju) — kreskowanie cienkimi liniami pod 45°, jak w normie.
  if (view.kind === "section") {
    ctx.save();
    ctx.beginPath();
    for (let r = 0; r < view.rows; r++) for (let c = 0; c < view.cols; c++)
      if (view.filled[r][c]) ctx.rect(ox + c * cell, oy + r * cell, cell, cell);
    ctx.clip();
    ctx.strokeStyle = line; ctx.globalAlpha = 0.55; ctx.lineWidth = 0.8;
    const step = Math.max(5, cell / 4), span = (view.cols + view.rows) * cell;
    for (let k = -view.rows * cell; k < span; k += step) {
      ctx.beginPath(); ctx.moveTo(ox + k, oy + view.rows * cell); ctx.lineTo(ox + k + view.rows * cell, oy); ctx.stroke();
    }
    ctx.restore();
  }

  const seg = (x1, y1, x2, y2, lw, dash) => {
    ctx.beginPath(); ctx.moveTo(ox + x1 * cell, oy + y1 * cell); ctx.lineTo(ox + x2 * cell, oy + y2 * cell);
    ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.lineCap = dash ? "butt" : "round";
    ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
  };
  // Krawędzie niewidoczne pod spodem: linia cienka kreskowa
  const dash = [Math.max(3, cell * 0.2), Math.max(2, cell * 0.13)];
  for (const k of (view.hid || [])) {
    const [r, c] = k.slice(2).split(",").map(Number);
    if (k[0] === "h") seg(c, r + 1, c + 1, r + 1, 1.1, dash);
    else              seg(c + 1, r, c + 1, r + 1, 1.1, dash);
  }
  const at = (r, c) => (r < 0 || c < 0 || r >= view.rows || c >= view.cols) ? null : (view.filled[r][c] ? view.depth[r][c] : null);

  for (let r = 0; r < view.rows; r++) for (let c = 0; c < view.cols; c++) {
    if (!view.filled[r][c]) continue;
    const d = view.depth[r][c];
    const sides = [
      [at(r - 1, c), c, r,     c + 1, r    ],  // góra
      [at(r + 1, c), c, r + 1, c + 1, r + 1],  // dół
      [at(r, c - 1), c, r,     c,     r + 1],  // lewo
      [at(r, c + 1), c + 1, r, c + 1, r + 1],  // prawo
    ];
    // Zarys i krawędzie widoczne wewnątrz zarysu — ta sama linia ciągła gruba
    for (const s of sides) if (s[0] === null || s[0] !== d) seg(s[1], s[2], s[3], s[4], 2.2);
  }
  return ctx;
}

/* ── Plan kodowany: siatka rzutu z góry z liczbą kostek w polu ── */
function drawPlan(canvas, hm, opt) {
  opt = opt || {};
  const nx = hm.length, ny = hm[0].length;
  const cell = opt.cell || 30, pad = 12;
  const W = opt.w || (nx * cell + pad * 2), H = opt.h || (ny * cell + pad * 2);
  const ctx = setupCanvas(canvas, W, H);
  const ox = (W - nx * cell) / 2, oy = (H - ny * cell) / 2;
  ctx.font = "bold 15px system-ui, Arial";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) {
    const y = ny - 1 - r;                       // tył u góry, jak w rzucie z góry
    const h = hm[c][y];
    const X = ox + c * cell, Y = oy + r * cell;
    ctx.fillStyle = h > 0 ? "#10303f" : "#101018";
    ctx.fillRect(X, Y, cell, cell);
    ctx.strokeStyle = "#2a3a48"; ctx.lineWidth = 1;
    ctx.strokeRect(X + 0.5, Y + 0.5, cell - 1, cell - 1);
    if (h > 0) { ctx.fillStyle = "#00C2FF"; ctx.fillText(String(h), X + cell / 2, Y + cell / 2 + 1); }
  }
  return ctx;
}

/* ═══════════════════════════════════════════════════════════════
   CZĘŚĆ 6 — PRZEKROJE I POMIARY POMOCNICZE
   ═══════════════════════════════════════════════════════════════ */

/** Przekrój płaszczyzną prostopadłą do osi. Zwraca strukturę zgodną z drawOrtho. */
function sectionView(solid, axis, index) {
  const nx = solid.nx, ny = solid.ny, nz = solid.nz;
  let cols, rows, get;
  if (axis === "y") {                      // płaszczyzna równoległa do rzutu z przodu
    cols = nx; rows = nz;
    get = (r, c) => solid.has(c, index, nz - 1 - r);
  } else if (axis === "x") {               // płaszczyzna równoległa do rzutu z boku
    cols = ny; rows = nz;
    get = (r, c) => solid.has(index, ny - 1 - c, nz - 1 - r);
  } else {                                 // pozioma, równoległa do rzutu z góry
    cols = nx; rows = ny;
    get = (r, c) => solid.has(c, ny - 1 - r, index);
  }
  const filled = [], depth = [];
  for (let r = 0; r < rows; r++) {
    filled.push([]); depth.push([]);
    for (let c = 0; c < cols; c++) { const f = get(r, c); filled[r].push(f); depth[r].push(f ? 0 : null); }
  }
  const v = { kind: "section", cols, rows, filled, depth };
  v.id = viewSignature(v);
  return v;
}

function isEmptyView(v) { return v.filled.every(r => r.every(x => !x)); }

/** Liczba kostek, z których na rysunku widać choćby skrawek.

    Dwie analityczne reguły, które wydawały się oczywiste, okazały się
    błędne przy konfrontacji z rzeczywistym rysunkiem: ani „kostka ma
    odsłoniętą ścianę", ani „zasłania ją wyłącznie sąsiad na promieniu
    widzenia" nie zgadzały się z tym, co widać. Dlatego zamiast wzoru
    działa tu ta sama kolejność malowania co w drawIso, tyle że do bufora
    indeksów zamiast na ekran. Kostka jest widoczna, jeśli po zamalowaniu
    całości została przy niej choć jedna próbka.

    Koszt jest pomijalny: bryły mają kilkanaście do trzydziestu kostek,
    a funkcja liczona jest raz na zadanie. Zgodność z rasteryzacją
    o wysokiej rozdzielczości sprawdza testy/logika.js. */
function visibleCubes(solid, scale) {
  const s = scale || 22, pad = 2;
  const b = isoBounds(solid, s);
  const W = Math.ceil(b.w) + pad * 2, H = Math.ceil(b.h) + pad * 2;
  const buf = new Int32Array(W * H).fill(-1);
  const P = (x, y, z) => { const p = isoPt(x, y, z, s); return [p.x - b.minX + pad, p.y - b.minY + pad]; };

  const inside = (q, px, py) => {
    let sign = 0;
    for (let i = 0; i < 4; i++) {
      const a = q[i], c = q[(i + 1) % 4];
      const cr = (c[0] - a[0]) * (py - a[1]) - (c[1] - a[1]) * (px - a[0]);
      if (cr !== 0) { const sg = cr > 0 ? 1 : -1; if (sign === 0) sign = sg; else if (sg !== sign) return false; }
    }
    return true;
  };
  const paint = (q, id) => {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const v of q) { if (v[0] < x0) x0 = v[0]; if (v[0] > x1) x1 = v[0]; if (v[1] < y0) y0 = v[1]; if (v[1] > y1) y1 = v[1]; }
    for (let py = Math.floor(y0); py <= Math.ceil(y1); py++)
      for (let px = Math.floor(x0); px <= Math.ceil(x1); px++) {
        if (px < 0 || py < 0 || px >= W || py >= H) continue;
        if (inside(q, px + 0.5, py + 0.5)) buf[py * W + px] = id;
      }
  };

  const order = solid.cells.map((c, i) => ({ c: c, i: i }))
    .sort((a, d) => (a.c[0] - a.c[1] + a.c[2]) - (d.c[0] - d.c[1] + d.c[2]));
  for (const o of order) {
    const x = o.c[0], y = o.c[1], z = o.c[2];
    if (!solid.has(x, y, z + 1)) paint([P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], o.i);
    if (!solid.has(x, y - 1, z)) paint([P(x, y, z), P(x + 1, y, z), P(x + 1, y, z + 1), P(x, y, z + 1)], o.i);
    if (!solid.has(x + 1, y, z)) paint([P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], o.i);
  }
  const seen = new Set();
  for (let k = 0; k < buf.length; k++) if (buf[k] >= 0) seen.add(buf[k]);
  return seen.size;
}

function footprintArea(solid) {
  const hm = heightsOf(solid);
  let n = 0;
  for (let x = 0; x < solid.nx; x++) for (let y = 0; y < solid.ny; y++) if (hm[x][y] > 0) n++;
  return n;
}

function generateSolidWhere(cfg, pred, tries) {
  for (let i = 0; i < (tries || 150); i++) { const s = generateSolid(cfg); if (pred(s)) return s; }
  return generateSolid(cfg);
}

/** Buduje listę opcji z unikatowymi identyfikatorami; odrzuca duplikaty. */
function assembleOptions(correctOpt, candidates, want, keepOrder) {
  const out = [correctOpt];
  const seen = new Set([correctOpt.id]);
  for (const c of (keepOrder ? candidates : shuffle(candidates))) {
    if (out.length >= want) break;
    if (!c || !c.id || seen.has(c.id)) continue;
    seen.add(c.id); out.push(c);
  }
  return shuffle(out);
}

const isoOpt = (solid, tag) => ({ kind: "iso", solid, id: "S" + solid.id, tag });
const orthoOpt = (view, tag) => ({ kind: "ortho", view, id: "V" + view.id, tag });
const numOpt = (n, tag) => ({ kind: "num", value: n, id: "N" + n, tag });
const textOpt = (t, tag) => ({ kind: "text", text: t, id: "T" + t, tag });

/* ── 1. Plan kodowany → bryła ── */
function exPlanBryla(cfg) {
  const s = generateSolid(cfg);
  const hm = heightsOf(s);
  const cand = [];
  cand.push(isoOpt(xform(s, XF.mirX), "mirror"));
  const mv = moveOneCube(s);  if (mv) cand.push(isoOpt(mv, "moved"));
  const ad = addOrRemoveCube(s, true);  if (ad) cand.push(isoOpt(ad, "added"));
  const rm = addOrRemoveCube(s, false); if (rm) cand.push(isoOpt(rm, "removed"));
  cand.push(isoOpt(xform(s, XF.rotZ), "planRot"));
  return {
    skill: "plan-bryla",
    prompt: "Plan kodowany podaje liczbę kostek w każdym słupku. Która bryła mu odpowiada?",
    hint: "Górny wiersz planu to tył bryły, dolny — przód.",
    stimulus: [{ type: "plan", hm, cap: "plan kodowany" }],
    options: assembleOptions(isoOpt(s, "ok"), cand, cfg.opts),
    solution: s,
  };
}

/* ── 2. Bryła → rzut prostokątny ── */
function exBrylaRzut(cfg, opts) {
  const s = generateSolidWhere(cfg, q => q.nx === q.ny && q.ny === q.nz);
  const kind = pick((opts && opts.kinds) || ["front", "top", "left", "right"]);
  const correct = orthoView(s, kind);
  const sameOutline = !!(opts && opts.sameOutline);

  // Dystraktory o identycznym zarysie, różniące się wyłącznie liniami wewnątrz
  // zarysu — krawędziami widocznymi albo niewidocznymi. To jedyny rodzaj
  // zadania, który naprawdę sprawdza czytanie tych linii.
  const hard = [];
  if (sameOutline) {
    const outline = JSON.stringify(correct.filled);
    for (let t = 0; t < 120 && hard.length < 5; t++) {
      const m = moveOneCube(s) || addOrRemoveCube(s, Math.random() < 0.5);
      if (!m) continue;
      const v = orthoView(m, kind);
      if (v.cols === correct.cols && v.rows === correct.rows &&
          JSON.stringify(v.filled) === outline && v.id !== correct.id) hard.push(orthoOpt(v, "stepLine"));
    }
  }

  const cand = [];
  for (const k of ["front", "top", "left", "right"]) if (k !== kind) cand.push(orthoOpt(orthoView(s, k), "otherView"));
  cand.push(orthoOpt(orthoView(xform(s, XF.mirX), kind), "viewFlip"));
  const mv = moveOneCube(s); if (mv) cand.push(orthoOpt(orthoView(mv, kind), "moved"));

  return {
    skill: "bryla-rzut",
    prompt: "Który rysunek jest poprawnym rzutem tej bryły — " + VIEW_LABEL[kind] + "?",
    hint: sameOutline
      ? "Wszystkie rysunki mają ten sam zarys. Decydują linie wewnątrz: ciągłe to krawędzie widoczne, kreskowe — niewidoczne."
      : "Linia ciągła gruba to krawędź widoczna, cienka kreskowa — niewidoczna.",
    stimulus: [{ type: "iso", solid: s, cap: "bryła" }],
    options: assembleOptions(orthoOpt(correct, "ok"), hard.concat(shuffle(cand)), cfg.opts, true),
    solution: s,
  };
}

/** To, co uczeń widzi na układzie trzech rzutów: rzut główny, z góry i boczny. */
function threeViewKey(solid, side) {
  return ["front", "top", side].map(k => orthoView(solid, k).id).join("/");
}

/* ── 3. Rzuty → bryła ── */
function exRzutyBryla(cfg, method) {
  const s = generateSolid(cfg);
  const side = method === "E" ? "left" : "right";
  const key = threeViewKey(s, side);
  const cand = [];
  cand.push(isoOpt(xform(s, XF.mirX), "mirror"));
  const mv = moveOneCube(s); if (mv) cand.push(isoOpt(mv, "moved"));
  const rm = addOrRemoveCube(s, false); if (rm) cand.push(isoOpt(rm, "removed"));
  const ad = addOrRemoveCube(s, true);  if (ad) cand.push(isoOpt(ad, "added"));
  cand.push(isoOpt(xform(s, XF.rotZ), "planRot"));
  // Dystraktor o identycznych trzech rzutach byłby drugą poprawną odpowiedzią —
  // w pierwszej wersji zdarzało się to w 0,5–3% zadań.
  const distinct = cand.filter(o => threeViewKey(o.solid, side) !== key);
  return {
    skill: "rzuty-bryla",
    prompt: "Trzy rzuty prostokątne opisują jedną bryłę. Którą?",
    hint: "Rysunek w metodzie " + (method === "E" ? "pierwszego kąta (europejskiej)" : "trzeciego kąta (amerykańskiej)") + ".",
    stimulus: [{ type: "views", solid: s, method, side }],
    options: assembleOptions(isoOpt(s, "ok"), distinct, cfg.opts),
    solution: s,
  };
}

/* ── 6. Przekroje ── */
function exPrzekroj(cfg, opts) {
  const axesAll = [
    { a: "y", n: s => s.ny, txt: (i, s) => "pionową, równoległą do rzutu z przodu, przez " + (i + 1) + ". rząd licząc od przodu" },
    { a: "x", n: s => s.nx, txt: (i, s) => "pionową, równoległą do rzutu z boku, przez " + (i + 1) + ". kolumnę licząc od lewej" },
    { a: "z", n: s => s.nz, txt: (i, s) => "poziomą, na wysokości " + (i + 1) + ". warstwy licząc od dołu" },
  ];
  const axes = (opts && opts.cuts) ? axesAll.filter(a => opts.cuts.indexOf(a.a) >= 0) : axesAll;
  const axPool = axes.length ? axes : axesAll;
  let s, ax, idx, correct, tries = 0;
  do {
    s = generateSolid(cfg);
    ax = pick(axPool);
    const n = ax.n(s);
    if (n < 2) { tries++; continue; }
    idx = randInt(n);
    correct = sectionView(s, ax.a, idx);
    tries++;
  } while ((!correct || isEmptyView(correct)) && tries < 60);
  if (!correct || isEmptyView(correct)) { s = solidFromHeights([[2, 1], [1, 2]]); ax = axesAll[0]; idx = 0; correct = sectionView(s, "y", 0); }

  const cand = [];
  for (let i = 0; i < ax.n(s); i++) if (i !== idx) {
    const v = sectionView(s, ax.a, i);
    if (!isEmptyView(v)) cand.push(orthoOpt(v, "otherSec"));
  }
  const mirrored = sectionView(xform(s, XF.mirX), ax.a, idx);
  if (!isEmptyView(mirrored)) cand.push(orthoOpt(mirrored, "viewFlip"));
  // Przekroje bryły z jedną przestawioną kostką — uzupełniają pulę, gdy bryła
  // ma mało warstw i samych innych przekrojów nie starcza na komplet opcji.
  for (let t = 0; t < 40 && cand.length < 8; t++) {
    const m = moveOneCube(s);
    if (!m || idx >= ax.n(m)) continue;
    const v = sectionView(m, ax.a, idx);
    if (!isEmptyView(v) && v.cols === correct.cols && v.rows === correct.rows) cand.push(orthoOpt(v, "moved"));
  }
  return {
    skill: "przekroj",
    prompt: "Bryłę przecięto płaszczyzną " + ax.txt(idx, s) + ". Który rysunek pokazuje figurę przekroju (kład)?",
    hint: "Kład pokazuje tylko materiał leżący dokładnie w płaszczyźnie cięcia; pole przekroju jest kreskowane.",
    stimulus: [{ type: "iso", solid: s, cap: "bryła" }, { type: "plan", hm: heightsOf(s), cap: "plan kodowany" }],
    options: assembleOptions(orthoOpt(correct, "ok"), cand, cfg.opts),
    solution: s,
  };
}

/* ═══ SZKIC IZOMETRYCZNY JAKO ZBIÓR ODCINKÓW SIATKI ═══
   Kurs Sorby (moduł 3) uczy szkicowania brył na papierze z siatką punktów
   izometrycznych. Rysunek na takiej siatce składa się z odcinków między
   sąsiednimi punktami, więc da się go sprawdzić ściśle, bez rozpoznawania
   obrazu: porównuje się zbiory odcinków z dokładnością do przesunięcia.

   Współrzędne siatki: u = x + y, v = x − y − 2z; punkt siatki ma u + v
   parzyste. Na ekranie X = u·s·cos30, Y = v·s/2 — ten sam rzut co drawIso. */

const segKey = (u1, v1, u2, v2) =>
  (u1 < u2 || (u1 === u2 && v1 < v2)) ? u1 + "," + v1 + "," + u2 + "," + v2 : u2 + "," + v2 + "," + u1 + "," + v1;
const segPts = k => k.split(",").map(Number);

/** Każda widoczna ściana kostki to romb z dwóch trójkątów siatki. Trójkąt
    R(k,a) ma bok pionowy na u = k (od v = a do a + 2) i wierzchołek w u = k + 1,
    trójkąt L(k,a) — bok pionowy na u = k + 1 i wierzchołek w u = k.
    Trójkątowi przypisujemy ścianę najbliższą obserwatorowi: głębokość
    d = x − y + z w punkcie, w którym promień przez środek trójkąta trafia
    w płaszczyznę ściany. Większe d — bliżej obserwatora. Etykieta trójkąta
    to płaszczyzna ściany ("z3" — płaszczyzna z = 3 itd.). */
function isoTriangles(solid) {
  const tri = new Map();
  const put = (k, a, side, lab, depth) => {
    const d = depth(side === "R" ? k + 1 / 3 : k + 2 / 3, a + 1);
    const key = k + "," + a + "," + side, cur = tri.get(key);
    if (!cur || d > cur.d + 1e-9) tri.set(key, { d: d, lab: lab });
  };
  for (const [x, y, z] of solid.cells) {
    const u = x + y, v = x - y - 2 * z;
    if (!solid.has(x, y, z + 1)) {             // ściana górna, płaszczyzna z = Z
      const Z = z + 1, f = (uc, vc) => vc + 3 * Z;
      put(u, v - 3, "L", "z" + Z, f); put(u + 1, v - 3, "R", "z" + Z, f);
    }
    if (!solid.has(x, y - 1, z)) {             // ściana przednia, płaszczyzna y = Y
      const Y = y, f = (uc, vc) => (3 * uc - 6 * Y - vc) / 2;
      put(u, v - 2, "R", "y" + Y, f); put(u, v - 1, "L", "y" + Y, f);
    }
    if (!solid.has(x + 1, y, z)) {             // ściana prawa, płaszczyzna x = X
      const X = x + 1, f = (uc, vc) => (6 * X - 3 * uc - vc) / 2;
      put(u + 1, v - 1, "R", "x" + X, f); put(u + 1, v - 2, "L", "x" + X, f);
    }
  }
  return tri;
}

/** Rysunek izometryczny bryły jako zbiór odcinków siatki. Odcinek leży tam,
    gdzie sąsiednie trójkąty należą do różnych płaszczyzn albo jeden jest pusty.
    Ściany leżące w jednej płaszczyźnie tworzą jedną powierzchnię, więc granic
    między kostkami na płaskiej ścianie się nie rysuje — jak na rysunku bryły.
    Krawędzi niewidocznych też nie, zgodnie z praktyką rysunku izometrycznego. */
function isoLineSet(solid) {
  const tri = isoTriangles(solid);
  const lab = (k, a, side) => { const t = tri.get(k + "," + a + "," + side); return t ? t.lab : null; };
  const out = new Set();
  const test = (l1, l2, u1, v1, u2, v2) => { if (l1 !== l2) out.add(segKey(u1, v1, u2, v2)); };
  for (const key of tri.keys()) {
    const p = key.split(","), k = +p[0], a = +p[1];
    if (p[2] === "R") {
      const me = lab(k, a, "R");
      test(me, lab(k - 1, a, "L"), k, a, k, a + 2);
      test(me, lab(k, a - 1, "L"), k, a, k + 1, a + 1);
      test(me, lab(k, a + 1, "L"), k, a + 2, k + 1, a + 1);
    } else {
      const me = lab(k, a, "L");
      test(me, lab(k + 1, a, "R"), k + 1, a, k + 1, a + 2);
      test(me, lab(k, a + 1, "R"), k, a + 1, k + 1, a + 2);
      test(me, lab(k, a - 1, "R"), k, a + 1, k + 1, a);
    }
  }
  return out;
}

function shiftSegs(set, du, dv) {
  const out = new Set();
  for (const k of set) { const p = segPts(k); out.add(segKey(p[0] + du, p[1] + dv, p[2] + du, p[3] + dv)); }
  return out;
}
function segBounds(set) {
  let u0 = Infinity, v0 = Infinity, u1 = -Infinity, v1 = -Infinity;
  for (const k of set) {
    const p = segPts(k);
    u0 = Math.min(u0, p[0], p[2]); v0 = Math.min(v0, p[1], p[3]);
    u1 = Math.max(u1, p[0], p[2]); v1 = Math.max(v1, p[1], p[3]);
  }
  return { u0, v0, u1, v1 };
}

/** Odcinki siatki między dwoma punktami, jeśli leżą na jednej linii siatki
    (pionowej albo jednej z dwóch ukośnych); w przeciwnym razie null. */
function latticePath(a, b) {
  const du = b.u - a.u, dv = b.v - a.v;
  let su, sv, n;
  if (du === 0 && dv !== 0 && dv % 2 === 0) { su = 0; sv = Math.sign(dv) * 2; n = Math.abs(dv) / 2; }
  else if (du !== 0 && Math.abs(du) === Math.abs(dv)) { su = Math.sign(du); sv = Math.sign(dv); n = Math.abs(du); }
  else return null;
  const out = [];
  for (let i = 0; i < n; i++) out.push(segKey(a.u + su * i, a.v + sv * i, a.u + su * (i + 1), a.v + sv * (i + 1)));
  return out;
}

/** Porównanie szkicu z rozwiązaniem z dokładnością do przesunięcia o wektor
    siatki. Przesunięcie wybiera głosowanie: każda para odcinków o tym samym
    kierunku głosuje na wektor, który by je nałożył. Zwraca braki i nadmiary
    względem rozwiązania ustawionego w najlepszym miejscu. */
function compareSketch(user, target) {
  const votes = new Map();
  let best = null, bestN = 0;
  const tl = [...target].map(segPts);
  for (const k of user) {
    const a = segPts(k);
    for (const b of tl) {
      if (a[2] - a[0] !== b[2] - b[0] || a[3] - a[1] !== b[3] - b[1]) continue;
      const key = (a[0] - b[0]) + "," + (a[1] - b[1]);
      const n = (votes.get(key) || 0) + 1;
      votes.set(key, n);
      if (n > bestN) { bestN = n; best = key; }
    }
  }
  const sh = best ? best.split(",").map(Number) : null;
  const placed = sh ? shiftSegs(target, sh[0], sh[1]) : null;
  const missing = placed ? new Set([...placed].filter(k => !user.has(k))) : new Set(target);
  const extra = placed ? new Set([...user].filter(k => !placed.has(k))) : new Set(user);
  return { ok: !!placed && missing.size === 0 && extra.size === 0, missing, extra, placed, shift: sh };
}

/* ── 9. Szkic izometryczny ── */
function exSzkic(cfg, opts) {
  // Szkic jest wolniejszy niż wybór z listy, więc bryły są ograniczone

  });
  const from = (opts && opts.from) || (Math.random() < 0.5 ? "plan" : "views");
  const s = generateSolid(c);
  const method = (opts && opts.forceMethod) || State.method;

  return {
    skill: "szkic", kind: "sketch",
    prompt: from === "plan"
      ? "Narysuj na siatce rysunek izometryczny bryły opisanej planem kodowanym."
      : "Narysuj na siatce rysunek izometryczny bryły przedstawionej w trzech rzutach.",
    hint: "Kierunek patrzenia jak w całej aplikacji: z przodu, z prawej i z góry. Rysuj tylko krawędzie bryły — " +
          "bez linii między kostkami na płaskiej ścianie i bez krawędzi niewidocznych.",
    stimulus: from === "plan"
      ? [{ type: "plan", hm: heightsOf(s), cap: "plan kodowany" }]
      : [{ type: "views", solid: s, method: method, side: side }],
    options: [],
    target: s,
    lines: isoLineSet(s),
    solution: s,
  };
}

/* ═══ OKRĘGI W IZOMETRII ═══
   Okrąg o średnicy d leżący na ścianie bryły jest elipsą wpisaną w romb
   ściany, styczną do środków jego boków. Rysując bez skrótu (współczynnik 1
   wzdłuż osi) dostajemy osie √1,5·d ≈ 1,22·d i √0,5·d ≈ 0,71·d; w rzucie
   ścisłym ze skrótem 0,816 — d i 0,58·d. Duża oś jest prostopadła do osi
   otworu, czyli leży wzdłuż dłuższej przekątnej rombu. Kąty poniżej to
   kierunki dużej osi na ekranie (oś Y ekranu w dół), wyprowadzone z rozkładu
   według wartości osobliwych rzutu ściany — sprawdza je testy/logika.js. */
const ELLIPSE = { major: Math.sqrt(1.5), minor: Math.sqrt(0.5) };
const FACE_ANGLE = { top: 0, front: Math.PI / 3, right: -Math.PI / 3 };
const FACE_TXT = { top: "górnej", front: "przedniej", right: "prawej" };
const FACE_AXIS = { top: "jest pionowa", front: "biegnie w głąb", right: "biegnie w prawo" };

/** Środek ściany sześcianu jednostkowego i dwa wektory jej boków (w 3D). */
const FACE_GEOM = {
  top:   { c: [0.5, 0.5, 1], e1: [1, 0, 0], e2: [0, 1, 0] },
  front: { c: [0.5, 0, 0.5], e1: [1, 0, 0], e2: [0, 0, 1] },
  right: { c: [1, 0.5, 0.5], e1: [0, 1, 0], e2: [0, 0, 1] },
};

function exElipsa(cfg, opts) {

    const r = x => Math.round(x);
    const t = (a, b) => "duża oś ≈ " + a + " mm, mała ≈ " + b + " mm";
    const cand = [

    return {

      prompt: "Rysujesz izometrię bez skrótu — wymiary wzdłuż osi odmierzasz w rzeczywistej wielkości. " +
              "Na jednej ze ścian leży okrąg o średnicy " + d + " mm. Jakie osie ma elipsa, która go przedstawia?",
      hint: "Wielkość elipsy nie zależy od tego, na której ścianie leży okrąg — zmienia się tylko jej obrót.",
      stimulus: [{ type: "draw", cap: "okrąg ⌀ " + d + " mm na ścianie " + FACE_TXT[f],

      note: "W rzucie ścisłym (skrót 0,816) osie mają d i 0,58·d. Bez skrótu cały rysunek jest √1,5 ≈ 1,22 raza " +

    };
  }
  const face = (opts && opts.face) || pick(["top", "front", "right"]);

  const variant = (tag, v) => ({

    draw: c => drawHoleCube(c, face, v, { w: 152, h: 132 }),

  });
  const cand = [

    variant("ellFace", { angle: FACE_ANGLE[others[0]] }),

    variant("ellCircle", { circle: true }),
  ];
  return {
    skill: "elipsa",
    prompt: "Na ścianie " + FACE_TXT[face] + " sześcianu wywiercono okrągły otwór; jego oś " + FACE_AXIS[face] +
            ". Który rysunek pokazuje otwór poprawnie?",
    hint: "Elipsa jest wpisana w romb ściany i dotyka środków jego boków.",
    stimulus: [{ type: "draw", cap: "ściana " + FACE_TXT[face], desc: "sześcian z zaznaczoną ścianą " + FACE_TXT[face],
                 draw: c => drawHoleCube(c, face, null, { w: 200, h: 172, mark: true }) }],
    options: assembleOptions(variant("ok", { angle: a }), cand, 4),
    note: "Duża oś elipsy jest prostopadła do osi otworu i leży wzdłuż dłuższej przekątnej rombu ściany.",
