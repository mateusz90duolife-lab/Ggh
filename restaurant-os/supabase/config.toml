# Konfiguracja Supabase CLI (funkcje Edge).
# Obie funkcje same uwierzytelniają wywołującego: token użytkownika sprawdzają w Auth (/auth/v1/user), a rolę
# w tabeli profiles (daily-shopping-summary przyjmuje też CRON_SECRET z crona). Brama JWT jest wyłączona,
# bo nie współpracuje z nowymi kluczami podpisu JWT Supabase.
[functions.admin-users]
verify_jwt = false

[functions.daily-shopping-summary]
verify_jwt = false

[functions.scan-receipt]
verify_jwt = false

# Logowanie nickiem i PIN-em: funkcja publiczna (bez tokenu), sama ogranicza liczbę prób.
[functions.pin-login]
verify_jwt = false
