# Konfiguracja Supabase CLI (funkcje Edge).
# daily-shopping-summary jest wywoływana przez pg_cron sekretem CRON_SECRET (nie JWT), więc brama JWT jest wyłączona,
# a funkcja sama weryfikuje albo CRON_SECRET, albo JWT użytkownika (manager+).
[functions.admin-users]
verify_jwt = true

[functions.daily-shopping-summary]
verify_jwt = false
