<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurs instalatora pomp ciepła i klimatyzacji</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   KURS INSTALATORA POMP CIEPŁA I KLIMATYZACJI — POZIOM ZAAWANSOWANY
   Aplikacja jednoplikowa, bez zależności, działa offline.
   Opis kursu, zakres i źródła: KURS-POMPY.md
   ═══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0D0D0D;
  --bg-soft:   #151515;
  --card:      #1a1a1a;
  --card-hi:   #202028;
  --line:      #2a2a2a;
  --line-hi:   #3a3a48;
  --txt:       #EAEAEA;
  --txt-dim:   #9a9a9a;
  --txt-faint: #666;
  --accent:    #00C2FF;
  --accent-dk: #007ea8;
  --hot:       #FF7A45;
  --cold:      #4DA3FF;
  --good:      #30D158;
  --bad:       #FF453A;
  --warn:      #FFD60A;
  --radius:    10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--txt);
  min-height: 100vh; font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.shell { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,13,13,0.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px;
  padding: 12px 0; margin-bottom: 20px; flex-wrap: wrap;
}
.brand { font-weight: 800; letter-spacing: 1.2px; font-size: 15px; }
.brand span { color: var(--hot); }
.brand em { font-style: normal; color: var(--cold); }
.spacer { flex: 1; }
.hud { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--txt-dim);
  white-space: nowrap;
}
.chip b { color: var(--txt); font-size: 13px; }

.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 22px; }
.nav button {
  background: transparent; border: 1px solid transparent; color: var(--txt-dim);
  padding: 9px 15px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-family: inherit; transition: all .15s;
}
.nav button:hover { background: var(--bg-soft); color: var(--txt); }
.nav button.on { background: #10222e; border-color: #1d4a63; color: var(--accent); font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
.center { text-align: center; }
.mt { margin-top: 14px; }
.muted { color: var(--txt-faint); font-size: 13px; margin-top: 8px; }

h1 { font-size: 24px; margin-bottom: 6px; letter-spacing: -0.3px; }
h2 { font-size: 19px; margin-bottom: 12px; letter-spacing: -0.2px; }
h3 { font-size: 15px; margin-bottom: 10px; }
h4 { font-size: 14px; margin: 16px 0 8px; color: var(--txt); }
p  { color: var(--txt-dim); margin-bottom: 10px; }
p.lead { color: var(--txt); }
b, strong { color: var(--txt); }
a { color: var(--accent); }
code, .f {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em;
  background: #000; padding: 2px 6px; border-radius: 4px; color: var(--accent);
}
.f { display: block; padding: 10px 14px; margin: 10px 0; overflow-x: auto; white-space: pre; line-height: 1.6; }

button.btn {
  background: var(--accent); border: none; color: #062a38;
  padding: 11px 20px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 700; font-family: inherit;
  transition: opacity .15s, transform .08s;
}
button.btn:hover:not(:disabled) { opacity: .88; }
button.btn:active:not(:disabled) { transform: scale(.975); }
button.btn:disabled { opacity: .35; cursor: not-allowed; }
button.btn.ghost { background: transparent; border: 1px solid var(--line-hi); color: var(--txt); }
button.btn.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.btn.danger { background: transparent; border: 1px solid #4a2020; color: #c05a52; }
button.btn.sm { padding: 7px 13px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ───── ZADANIE ───── */
.q-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.q-tag {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); background: #0d2230; border: 1px solid #1d4a63;
  padding: 4px 10px; border-radius: 5px; white-space: nowrap;
}
.q-tag.calc { color: var(--hot); background: #2a150c; border-color: #6a3418; }
.q-text { font-size: 17px; color: var(--txt); flex: 1; min-width: 220px; line-height: 1.5; }
.q-count { font-size: 12px; color: var(--txt-faint); white-space: nowrap; }
.opts { display: grid; gap: 10px; margin-top: 16px; }
.opt {
  background: var(--bg-soft); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 12px 16px; cursor: pointer; text-align: left; color: var(--txt);
  font-size: 15px; font-family: inherit; line-height: 1.45;
  transition: border-color .12s, background .12s;
}
.opt:hover:not(:disabled) { border-color: var(--line-hi); background: var(--card-hi); }
.opt:disabled { cursor: default; }
.opt.ok  { border-color: var(--good); background: #0f2616; }
.opt.no  { border-color: var(--bad);  background: #2a1110; }
.opt .k { display: inline-block; width: 22px; color: var(--txt-faint); font-weight: 700; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 8px; border-left: 4px solid; background: var(--bg-soft); }
.fb.good { border-color: var(--good); }
.fb.bad  { border-color: var(--bad); }
.fb b.t { display: block; margin-bottom: 6px; font-size: 15px; }
.fb.good b.t { color: var(--good); }
.fb.bad b.t  { color: var(--bad); }
.fb p { margin: 6px 0 0; color: var(--txt); }
.fb p.why-wrong { color: #ffb4ae; }

.bar { height: 8px; background: #000; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.good i { background: var(--good); }

/* ───── MODUŁY ───── */
.mod {
  display: flex; align-items: center; gap: 14px; padding: 13px 12px;
  border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px;
}
.mod:last-child { border-bottom: none; }
.mod:hover { background: var(--bg-soft); }
.mod.locked { cursor: not-allowed; opacity: .5; }
.mod.locked:hover { background: transparent; }
.mod-num {
  width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: #000; border: 1px solid var(--line-hi); font-weight: 700; font-size: 14px;
}
.mod.done .mod-num { background: #0f2616; border-color: var(--good); color: var(--good); }
.mod-body { flex: 1; min-width: 0; }
.mod-title { font-weight: 600; color: var(--txt); }
.mod-meta { font-size: 12px; color: var(--txt-faint); }
.mod-badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.badge-done { color: var(--good); border-color: #1f5a2e; }
.badge-open { color: var(--accent); border-color: #1d4a63; }
.badge-lock { color: var(--txt-faint); border-color: var(--line); }
.part-h { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--txt-faint); margin: 14px 12px 4px; }
.part-h:first-child { margin-top: 0; }

/* ───── LEKCJE ───── */
.lesson { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; background: var(--card); overflow: hidden; }
.lesson-h {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  padding: 15px 18px; font-weight: 600; color: var(--txt);
}
.lesson-h:hover { background: var(--card-hi); }
.lesson-h::after { content: "+"; margin-left: auto; color: var(--txt-faint); font-size: 18px; }
.lesson.open .lesson-h::after { content: "−"; }
.lesson-b { display: none; padding: 4px 20px 18px; }
.lesson.open .lesson-b { display: block; }
.lesson-b ul, .lesson-b ol { margin: 6px 0 12px 22px; color: var(--txt-dim); }
.lesson-b li { margin-bottom: 5px; }
.note { background: #0d2230; border: 1px solid #1d4a63; border-radius: 8px; padding: 11px 14px; margin: 12px 0; color: var(--txt); font-size: 14px; }
.note.warn { background: #2a2208; border-color: #6a5510; }
.note.danger { background: #2a1110; border-color: #6a2420; }
.tbl { overflow-x: auto; margin: 10px 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: #111; color: var(--txt); font-weight: 600; }
td { color: var(--txt-dim); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.fig { margin: 12px 0; text-align: center; }
.fig svg { max-width: 100%; height: auto; }
.fig .cap { font-size: 12px; color: var(--txt-faint); margin-top: 6px; }
svg text { font-family: inherit; }

/* ───── KALKULATORY ───── */
.calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
.calc-grid .card { margin-bottom: 0; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.fld label { font-size: 12px; color: var(--txt-dim); }
.fld input, .fld select {
  background: #000; border: 1px solid var(--line-hi); color: var(--txt);
  border-radius: 7px; padding: 8px 10px; font-size: 14px; font-family: inherit; width: 100%;
}
.fld input:focus, .fld select:focus { outline: none; border-color: var(--accent); }
.fld.chk { flex-direction: row; align-items: center; gap: 8px; }
.fld.chk input { width: auto; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.out { background: #000; border-radius: 8px; padding: 12px 14px; margin-top: 6px; font-size: 14px; color: var(--txt-dim); }
.out b.big { display: block; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.out .ok { color: var(--good); }
.out .no { color: var(--bad); }
.out .wn { color: var(--warn); }

/* ───── STATYSTYKI / CERTYFIKAT ───── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.stat-n { font-size: 26px; font-weight: 800; color: var(--txt); }
.stat-l { font-size: 12px; color: var(--txt-faint); }
.cert {
  border: 2px solid var(--hot); border-radius: 12px; padding: 34px 22px; text-align: center;
  background: radial-gradient(circle at 50% 0%, #2a150c 0%, var(--card) 70%);
}
.cert h2 { font-size: 22px; letter-spacing: 3px; color: var(--hot); margin: 8px 0; }
.cert .who { font-size: 24px; font-weight: 800; color: var(--txt); margin: 14px 0 6px; }
.cert .meta { color: var(--txt-dim); font-size: 13px; margin-top: 4px; }
.cert .disc { color: var(--txt-faint); font-size: 11px; margin-top: 16px; }
.cert-seal { font-size: 30px; color: var(--hot); }

@media (max-width: 560px) {
  .card { padding: 16px; }
  .lesson-b { padding: 4px 14px 14px; }
  .two { grid-template-columns: 1fr; }
  .q-text { font-size: 16px; }
  h1 { font-size: 21px; }
}
@media print {
  body { background: #fff; }
  .topbar, .nav, .no-print, button { display: none !important; }
  .card { border: none; background: #fff; }
  .cert { background: #fff; border-color: #000; }
  .cert h2, .cert-seal { color: #000; }
  .cert .who, .cert .meta, .cert .disc { color: #000; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><span>POMPY</span> CIEPŁA <em>&amp; KLIMA</em> · kurs zaawansowany</div>
    <div class="spacer"></div>
    <div class="hud" id="hud"></div>
  </div>
  <div class="nav" id="nav"></div>
  <div id="app"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. NARZĘDZIA
   ═══════════════════════════════════════════════════════════════ */
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
/** Liczba w zapisie polskim: przecinek dziesiętny, bez „-0”. */
function fmt(x, d) {
  const s = Number(x).toFixed(d == null ? 1 : d);
  return (/^-0(\.0+)?$/.test(s) ? s.slice(1) : s).replace(".", ",");
}
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function html(tag, cls, markup) { const e = el(tag, cls); e.innerHTML = markup; return e; }

/* ═══════════════════════════════════════════════════════════════
   2. CZYNNIKI CHŁODNICZE
   GWP: wartości 100-letnie wg IPCC AR4, stosowane w przepisach
   F-gazowych UE do przeliczeń na ekwiwalent CO2. Do dokumentacji
   urzędowej używaj wartości z tabliczki znamionowej urządzenia.
   LFL: dolna granica palności wg EN 378-1 / ISO 817 [kg/m³].
   Ciśnienia nasycenia [bar abs] co 5 K od −30 do +60 °C,
   wygładzone równaniem Antoine'a. Dla R410A: ciśnienie wrzenia
   (poślizg < 0,2 K, pomijalny w praktyce serwisowej).
   ═══════════════════════════════════════════════════════════════ */
const PT_T = [-30, -25, -20, -15, -10, -5, 0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60];
const REF = {
  R32:   { gwp: 675,  cls: "A2L", lfl: 0.307, fgas: true,  note: "czysty związek (HFC), bez poślizgu",
           pt: [2.72, 3.33, 4.04, 4.86, 5.81, 6.89, 8.13, 9.52, 11.08, 12.84, 14.79, 16.95, 19.34, 21.96, 24.84, 27.97, 31.39, 35.09, 39.08] },
  R410A: { gwp: 2088, cls: "A1",  lfl: null,  fgas: true,  note: "mieszanina prawie azeotropowa R32/R125",
           pt: [2.69, 3.29, 3.99, 4.79, 5.72, 6.78, 7.99, 9.35, 10.87, 12.58, 14.48, 16.57, 18.89, 21.43, 24.21, 27.24, 30.53, 34.09, 37.94] },
  R290:  { gwp: 3,    cls: "A3",  lfl: 0.038, fgas: false, note: "propan, czynnik naturalny, skrajnie łatwopalny",
           pt: [1.67, 2.03, 2.44, 2.91, 3.44, 4.05, 4.74, 5.51, 6.37, 7.32, 8.37, 9.53, 10.81, 12.20, 13.71, 15.36, 17.14, 19.06, 21.12] },
  R454B: { gwp: 466,  cls: "A2L", lfl: 0.296, fgas: true,  note: "mieszanina R32/R1234yf, poślizg ok. 1 K" },
  R407C: { gwp: 1774, cls: "A1",  lfl: null,  fgas: true,  note: "mieszanina zeotropowa, poślizg ok. 5–7 K" },
  R134a: { gwp: 1430, cls: "A1",  lfl: null,  fgas: true,  note: "czysty związek (HFC)" },
  R744:  { gwp: 1,    cls: "A1",  lfl: null,  fgas: false, note: "CO₂, praca nadkrytyczna, bardzo wysokie ciśnienia" },
};
const PT_REFS = ["R32", "R410A", "R290"];
const P_ATM = 1.013;   // bar — do przeliczeń manometr ↔ ciśnienie bezwzględne

/** Temperatura nasycenia [°C] przy ciśnieniu bezwzględnym [bar] — interpolacja ln p. */
function tsat(ref, pAbs) {
  const pt = REF[ref].pt, lp = Math.log(pAbs);
  let i = 0;
  if (pAbs <= pt[0]) i = 0;
  else if (pAbs >= pt[pt.length - 1]) i = pt.length - 2;
  else while (pt[i + 1] < pAbs) i++;
  const a = Math.log(pt[i]), b = Math.log(pt[i + 1]);
  return PT_T[i] + (lp - a) / (b - a) * (PT_T[i + 1] - PT_T[i]);
}
/** Ciśnienie nasycenia [bar abs] w temperaturze [°C]. */
function psat(ref, t) {
  const pt = REF[ref].pt;
  let i = Math.min(PT_T.length - 2, Math.max(0, Math.floor((t - PT_T[0]) / 5)));
  const f = (t - PT_T[i]) / 5;
  return Math.exp(Math.log(pt[i]) + f * (Math.log(pt[i + 1]) - Math.log(pt[i])));
}

/* ═══════════════════════════════════════════════════════════════
   3. WZORY INSTALATORA
   ═══════════════════════════════════════════════════════════════ */
const K0 = 273.15;

/** Ekwiwalent CO2 [t] */
function co2e(ref, kg) { return kg * REF[ref].gwp / 1000; }

/** Częstotliwość kontroli szczelności wg art. 5 rozp. (UE) 2024/573.
    Zwraca { months, t, reason }; months = 0 oznacza brak obowiązku. */
function leakCheck(ref, kg, hermetic, detection) {
  const r = REF[ref];
  if (!r.fgas) return { months: 0, t: 0, reason: "czynnik nie jest fluorowanym gazem cieplarnianym" };
  const t = co2e(ref, kg);
  if (hermetic && t < 10) return { months: 0, t, reason: "urządzenie hermetyczne poniżej 10 t CO₂e (oznakowane jako hermetyczne)" };
  if (t < 5) return { months: 0, t, reason: "poniżej 5 t CO₂e" };
  let m = t >= 500 ? 3 : t >= 50 ? 6 : 12;
  if (detection) m *= 2;
  return { months: m, t, reason: t >= 500 ? "500 t CO₂e lub więcej" : t >= 50 ? "od 50 do 500 t CO₂e" : "od 5 do 50 t CO₂e" };
}

/** Współczynnik wydajności obiegu Carnota (grzanie) */
function carnotCOP(tCond, tEvap) { return (tCond + K0) / (tCond - tEvap); }

/** Przepływ wody [m³/h] dla mocy [kW] i różnicy temperatur [K] (woda: 0,86) */
function flowM3h(kW, dT) { return kW * 0.86 / dT; }

/** Prędkość [m/s] dla przepływu [m³/h] i średnicy wewnętrznej [mm] */
function velocity(m3h, dmm) { const d = dmm / 1000; return m3h / 3600 / (Math.PI * d * d / 4); }

/** Punkt biwalentny: przecięcie liniowego obciążenia budynku
    (qd przy td, zero przy tLim) z liniową charakterystyką mocy
    pompy ciepła zadaną w dwóch punktach (t1, p1) i (t2, p2). */
function bivalent(qd, td, tLim, t1, p1, t2, p2) {
  const a1 = -qd / (tLim - td), b1 = qd * tLim / (tLim - td);   // obciążenie: a1·t + b1
  const a2 = (p2 - p1) / (t2 - t1), b2 = p1 - a2 * t1;          // pompa:      a2·t + b2
  return (b2 - b1) / (a1 - a2);
}
function loadAt(qd, td, tLim, t) { return Math.max(0, qd * (tLim - t) / (tLim - td)); }

/** Długość sond pionowych [m]: moc dolnego źródła / moc jednostkowa */
function boreholeLength(kWheat, cop, wPerM) { return kWheat * (1 - 1 / cop) * 1000 / wPerM; }

/** Doładowanie czynnika [g] */
function addCharge(lenM, preM, gPerM) { return Math.max(0, lenM - preM) * gPerM; }

/** Próba azotem: ciśnienie manometryczne po zmianie temperatury (przemiana izochoryczna) */
function pressureAt(p1g, t1, t2) { return (p1g + P_ATM) * (t2 + K0) / (t1 + K0) - P_ATM; }

/** Maksymalne napełnienie czynnikiem palnym w pomieszczeniu (EN 378-1, zał. C / EN IEC 60335-2-40) [kg] */
function chargeLimit(lfl, h0, area) { return 2.5 * Math.pow(lfl, 1.25) * h0 * Math.sqrt(area); }
function minArea(lfl, h0, kg) { const k = kg / (2.5 * Math.pow(lfl, 1.25) * h0); return k * k; }
const H0 = { podloga: 0.6, okno: 1.0, sciana: 1.8, sufit: 2.2 };

/** Prąd [A] odbiornika o mocy [kW]: fazy 1 (230 V) lub 3 (400 V) */
function current(kW, phases, cosphi) {
  return phases === 3 ? kW * 1000 / (Math.sqrt(3) * 400 * cosphi) : kW * 1000 / (230 * cosphi);
}

/** Liniowa krzywa grzewcza */
function heatCurve(tRoom, tDesign, tSupDesign, tOut) {
  if (tOut >= tRoom) return tRoom;
  return tRoom + (tSupDesign - tRoom) * (tRoom - tOut) / (tRoom - tDesign);
}

/** 1 mikron słupa rtęci = 0,1333 Pa */
function micronToPa(um) { return um * 0.13332; }

/* ═══════════════════════════════════════════════════════════════
   4. BUDOWA ZADAŃ
   Błędne odpowiedzi nie są losowe: każda koduje typową pomyłkę,
   a informacja zwrotna nazywa ją, zamiast tylko odnotować błąd.
   ═══════════════════════════════════════════════════════════════ */

/** Zadanie z odpowiedzią poprawną i listą błędnych (z objaśnieniem każdej). */
function mkQ(tag, text, correct, wrongs, why, wrongWhy, calc) {
  const items = [{ t: correct, ok: true, w: null }];
  const seen = new Set([correct]);
  wrongs.forEach((w, i) => {
    if (items.length < 4 && !seen.has(w)) { seen.add(w); items.push({ t: w, ok: false, w: wrongWhy ? wrongWhy[i] || null : null }); }
  });
  const sh = shuffle(items);
  return { tag, text, calc: !!calc, why, options: sh.map(x => x.t), correct: sh.findIndex(x => x.ok), wrongWhy: sh.map(x => x.w) };
}

/** Zadanie obliczeniowe: dystraktory dopełniane do trzech, gdy pomyłki dają tę samą liczbę. */
function numQ(tag, text, value, dec, unit, wrongs, why, wrongWhy) {
  const f = v => fmt(v, dec) + (unit ? " " + unit : "");
  const c = f(value);
  const ws = [], wy = [];
  wrongs.forEach((w, i) => { const s = f(w); if (s !== c && ws.indexOf(s) < 0 && isFinite(w)) { ws.push(s); wy.push(wrongWhy ? wrongWhy[i] : null); } });
  for (const k of [1.25, 0.8, 1.5, 0.6, 2, 0.5]) {
    if (ws.length >= 3) break;
    const s = f(value * k);
    if (s !== c && ws.indexOf(s) < 0) { ws.push(s); wy.push(null); }
  }
  return mkQ(tag, text, c, ws, why, wy, true);
}

    const td = pick([-16, -18, -20, -22, -24]);
    const tsup = pick([35, 40, 45, 50]);
    const tout = pick([-10, -5, 0, 5]);
    const v = heatCurve(20, td, tsup, tout);
    return numQ("Krzywa grzewcza",
      `Projekt: zasilanie ${tsup} °C przy ${td} °C na zewnątrz, pokój 20 °C. Krzywa grzewcza jest liniowa i przechodzi przez 20 °C przy 20 °C na zewnątrz. Jaka temperatura zasilania przy ${tout} °C?`,
      v, 1, "°C", [tsup * (20 - tout) / (20 - td), tsup, 20 + (tsup - 20) * (tout - td) / (20 - td)],
      `T_z = 20 + (${tsup} − 20) · (20 − (${tout})) / (20 − (${td})) = ${fmt(v, 1)} °C. Niższa temperatura zasilania w cieplejsze dni to główne źródło wysokiego SCOP.`,
      ["Pominięto punkt stały krzywej: przy 20 °C na zewnątrz zasilanie ma 20 °C, a nie 0 °C.",
       "To temperatura projektowa, obowiązująca tylko przy θe. Krzywa obniża zasilanie w cieplejsze dni.",
       "Proporcję odwrócono: im zimniej, tym zasilanie ma być wyższe."]);
  },
};
const GEN_IDS = Object.keys(GEN);

/* Dwa dodatkowe generatory: hałas jednostki zewnętrznej i punkt rosy */
function soundAt(lw, r, q) { return lw + 10 * Math.log10(q / (4 * Math.PI * r * r)); }
function dewPoint(t, rh) {
  const g = Math.log(rh / 100) + 17.62 * t / (243.12 + t);
  return 243.12 * g / (17.62 - g);
}
GEN.noise = function () {
  const lw = pick([52, 55, 58, 62]);
  const r = pick([3, 4, 5, 8, 10]);
  const pl = pick([["wolnostojąca na gruncie (Q = 2)", 2], ["przy ścianie budynku (Q = 4)", 4], ["w narożniku między ścianami (Q = 8)", 8]]);
  const v = soundAt(lw, r, pl[1]);
  return numQ("Hałas",
    `Jednostka zewnętrzna o mocy akustycznej L_W = ${lw} dB(A) stoi ${pl[0]}. Jaki poziom ciśnienia akustycznego wystąpi w odległości ${r} m?`,
    v, 1, "dB(A)", [soundAt(lw, r, 1), lw + 10 * Math.log10(pl[1] / (4 * Math.PI * r)), lw - 20 * Math.log10(r)],
    `L_p = L_W + 10·log(Q / (4π r²)) = ${lw} + 10·log(${pl[1]} / (4π · ${r}²)) = ${fmt(v, 1)} dB(A). Każde podwojenie odległości obniża poziom o 6 dB, każda dodatkowa ściana odbijająca podnosi go o 3 dB.`,
    ["Pominięto współczynnik kierunkowości Q. Odbicia od gruntu i ścian podnoszą poziom hałasu.",
     "Odległość nie została podniesiona do kwadratu. Energia rozkłada się na powierzchni rosnącej z r².",
     "Pominięto człon 4π i współczynnik Q, zostało samo tłumienie odległością."]);
};
GEN.dewpoint = function () {
  const t = pick([22, 24, 26, 28]);
  const rh = pick([45, 50, 55, 60, 65, 70]);
  const v = dewPoint(t, rh);
  return numQ("Punkt rosy",
    `W pomieszczeniu jest ${t} °C i wilgotność względna ${rh}%. Jaka jest temperatura punktu rosy? Poniżej niej na zimnych powierzchniach wykrapla się woda.`,
    v, 1, "°C", [t * rh / 100, t - (100 - rh) / 10, t - rh / 10],
    `Wzór Magnusa: γ = ln(${rh}/100) + 17,62·${t}/(243,12 + ${t}); t_r = 243,12·γ/(17,62 − γ) = ${fmt(v, 1)} °C. ` +
    `Rury z zimnym czynnikiem, kanały i powierzchnie chłodzące poniżej tej temperatury muszą mieć izolację paroszczelną albo sterowanie zasilaniem powyżej punktu rosy.`,
    ["Wilgotność względna nie przekłada się proporcjonalnie na temperaturę. Zależność jest wykładnicza (wzór Magnusa).",
     "Zbyt mała poprawka. Punkt rosy leży zwykle kilka do kilkunastu stopni poniżej temperatury powietrza.",
     "To nie jest wzór na punkt rosy. Użyj wzoru Magnusa albo wykresu i-x."]);
};

<p><b>LFL</b> (dolna granica palności) to najmniejsze stężenie, przy którym mieszanina z powietrzem może się zapalić. Dla R32 to 0,307 kg/m³, dla R290 zaledwie 0,038 kg/m³, około 2% objętościowo.</p>
<h4>Zasady pracy z A2L i A3</h4>

<li>Przed pracą i w jej trakcie kontroluj atmosferę detektorem gazu właściwym dla czynnika. Zapewnij wentylację.</li>

<li>Nigdy nie lutuj instalacji zawierającej czynnik. Najpierw odzysk, potem przedmuch azotem, dopiero wtedy płomień.</li>
<li>Propan jest cięższy od powietrza i zbiera się nisko: w studzienkach, piwnicach, zagłębieniach terenu. Monobloki R290 mają <b>strefę ochronną</b> wokół jednostki zewnętrznej. Nie może w niej być otworów do budynku, wpustów kanalizacyjnych ani źródeł zapłonu. Wymiary strefy podaje producent.</li>

<p>Różnica rzędu wielkości wyjaśnia, dlaczego R290 trafia głównie do monobloków stojących na zewnątrz, a R32 do splitów.</p>

  { t: "Mieszaniny, poślizg temperaturowy i oleje", h: `
<ul>
<li><b>Czysty związek</b> (R32, R290, R134a) wrze w jednej temperaturze przy danym ciśnieniu.</li>
<li><b>Mieszanina azeotropowa lub prawie azeotropowa</b> (R410A) zachowuje się praktycznie jak czysty związek, bo poślizg nie przekracza kilku dziesiątych kelwina.</li>
<li><b>Mieszanina zeotropowa</b> (R407C, w mniejszym stopniu R454B) wrze w zakresie temperatur. <b>Poślizg</b> to różnica między temperaturą początku i końca wrzenia przy tym samym ciśnieniu.</li>

<p><b>Oleje.</b> Czynniki HFC i HFO współpracują z olejami POE lub PVE. Oba są silnie higroskopijne: chłoną wilgoć z powietrza w ciągu minut. Zaślepiaj rury, nie zostawiaj otwartych butelek z olejem i zawsze wykonuj pełną próżnię.</p>

<p>Temperatura wewnętrzna projektowa to zwykle 20 °C, w łazienkach 24 °C.</p>
<h4>Szacunki kontrolne</h4>
<ul>
<li><b>Z zużycia paliwa</b> w istniejącym budynku: roczna energia na ogrzewanie podzielona przez liczbę godzin pracy z pełnym obciążeniem, w Polsce zwykle ok. 1800–2200 h. 20 000 kWh / 2000 h ≈ 10 kW.</li>

<li><b>Ciepła woda użytkowa</b>: dodatek rzędu 0,2–0,25 kW na osobę albo osobny bilans zasobnika.</li>
</ul>
<div class="note warn">Wskaźniki nie zastąpią obliczeń. Przewymiarowana pompa ciepła częściej się wyłącza, pracuje z gorszą sprawnością i szybciej się zużywa. Niedowymiarowana zbyt często korzysta z grzałki.</div>` },

  { t: "Dobór mocy i punkt biwalentny", h: `
<p>Moc powietrznej pompy ciepła spada, gdy robi się zimniej, a zapotrzebowanie budynku rośnie. Obie linie przecinają się w <b>punkcie biwalentnym</b> θbiw. Poniżej niego brakującą moc daje źródło szczytowe: grzałka w układzie monoenergetycznym albo kocioł w układzie biwalentnym.</p>
${fig(SVG_BIVAL, "Punkt biwalentny: przecięcie obciążenia budynku z charakterystyką pompy ciepła.")}
<p>Obciążenie zmienia się liniowo od wartości projektowej przy θe do zera przy granicy ogrzewania (zwykle +15 °C, bo resztę pokrywają zyski wewnętrzne i słoneczne):</p>
<div class="f">Q(t) = Q_proj · (15 − t) / (15 − θe)</div>
<ul>
<li>W polskim klimacie typowy dobór to θbiw około −5…−10 °C. Temperatury poniżej trwają krótko, więc grzałka dostarcza zwykle tylko kilka procent rocznej energii.</li>
<li>Sprawdź <b>minimalną moc modulacji</b>. Jeśli w okresie przejściowym zapotrzebowanie jest niższe, pompa będzie często się wyłączać. Pomaga zład instalacji albo bufor.</li>
<li>Uwzględnij moc na c.w.u. i czas, w którym pompa nie grzeje budynku: ładowanie zasobnika i odszranianie.</li>
</ul>` },

  { t: "Dane katalogowe i ich pułapki", h: `

<li>Moc przy W55 jest wyraźnie niższa niż przy W35. Dla instalacji grzejnikowej dobieraj z tabel dla rzeczywistej temperatury zasilania.</li>
<li>Katalogi podają moc bez strat na odszranianie albo z nimi. Sprawdź przypis w karcie produktu.</li>

  lessons: [
  { t: "Przepływ, ΔT i średnice", h: `
<div class="f">V [m³/h] = P [kW] · 0,86 / ΔT [K]        v [m/s] = V / 3600 / (π·d²/4)</div>
<p>Kocioł pracuje często z ΔT 15–20 K, pompa ciepła z ΔT 5–7 K. Przy tej samej mocy przepływ jest więc <b>trzy do czterech razy większy</b>. Instalacje przerabiane z kotła mają za małe średnice częściej niż jakikolwiek inny błąd.</p>
${tbl(["Rura", "d_wewn [mm]", "Przepływ przy 0,8 m/s", "Moc przy ΔT = 5 K"],
  PIPES.map(p => { const V = 0.8 * 3600 * Math.PI * Math.pow(p[1] / 1000, 2) / 4; return [p[0], fmt(p[1], 1), fmt(V, 2) + " m³/h", fmt(V * 5 / 0.86, 1) + " kW"]; }))}
<ul>
<li>Celuj w prędkość 0,5–1,0 m/s w przewodach głównych. Wyżej rośnie hałas i opór, niżej rura jest przewymiarowana.</li>
<li>Pompa obiegowa w pompie ciepła ma ograniczony <b>spręż dyspozycyjny</b>. Zsumuj opory rur, wymiennika, filtra, zaworów i pętli podłogówki. Jeśli suma przekracza spręż, potrzebne jest sprzęgło albo bufor z drugą pompą.</li>
<li>Producent podaje <b>minimalny przepływ</b>. Poniżej niego sterownik zgłosi błąd przepływu, a w trybie chłodzenia grozi zamarznięcie płytowego wymiennika.</li>
</ul>` },

  { t: "Układy hydrauliczne", h: `
${fig(SVG_HYDRO, "Typowy układ: pompa ciepła, zawór trójdrogowy z priorytetem c.w.u., opcjonalny bufor i obieg grzewczy.")}
${tbl(["Układ", "Kiedy", "Uwagi"], [
  ["Bezpośredni, bez bufora", "jeden obieg podłogowy, duży zład, pętle bez zaworów strefowych", "najwyższa sprawność, wymaga zapewnienia minimalnego zładu i przepływu"],
  ["Bufor szeregowy (na powrocie)", "mały zład, potrzeba energii do odszraniania", "zwiększa pojemność bez mieszania temperatur"],

<p><b>Odszranianie</b> odwróconym obiegiem pobiera ciepło z instalacji. Producent podaje minimalną pojemność wodną instalacji, a przy jej braku trzeba dodać bufor. Zamknięte zawory termostatyczne mogą w tym czasie odciąć pojemność grzejników, więc liczy się tylko zład, który zawsze pozostaje otwarty.</p>
<h4>Ciepła woda użytkowa</h4>

<li>Ciśnienie próby podaje producent. Nie może przekroczyć dopuszczalnego ciśnienia PS podanego na tabliczce. Dla R32 i R410A instrukcje podają zwykle wartości rzędu 40 bar. Podnoś ciśnienie stopniowo i obserwuj.</li>
<li>Czas próby zgodnie z instrukcją, od kilkunastu minut do 24 h. Zanotuj ciśnienie i <b>temperaturę</b> na początku i na końcu.</li>
<li>Nieszczelności szukaj pianą do wykrywania wycieków albo detektorem elektronicznym. Mieszanina 95% N₂ + 5% H₂ (gaz formierski) pozwala użyć czułego detektora wodoru.</li>
<li>Nie dodawaj czynnika do azotu „dla wykrywacza”. To uwolnienie F-gazu do atmosfery przy spuszczaniu próby.</li>
</ul>
<h4>Korekta temperatury</h4>
<p>Azot w zamkniętej instalacji zachowuje się jak gaz doskonały w stałej objętości. Ciśnienie bezwzględne jest proporcjonalne do temperatury bezwzględnej:</p>
<div class="f">p₂_abs = p₁_abs · T₂ / T₁        (T w kelwinach)</div>
<p>Przykład: 40 bar przy 25 °C, rano 15 °C. (41,01 × 288,15 / 298,15) − 1,01 = ${fmt(pressureAt(40, 25, 15), 1)} bar. Spadek o ok. ${fmt(40 - pressureAt(40, 25, 15), 1)} bar jest więc naturalny. Obecność nieszczelności oceniasz dopiero po tej korekcie.</p>` },

<ul>
<li>Pompa dwustopniowa ze świeżym olejem, krótkie węże o dużej średnicy. Wykręcenie rdzeni zaworów Schradera narzędziem z zaworem kulowym kilkukrotnie skraca czas.</li>
<li><b>Wakuometr elektroniczny</b> podłącz od strony instalacji, jak najdalej od pompy, nie na samej pompie.</li>
<li>Cel typowy: <b>poniżej 500 µm Hg</b> (ok. 67 Pa). Manometr analogowy zestawu nie pokazuje takich ciśnień.</li>
</ul>
<div class="f">1 µm Hg = 0,1333 Pa        500 µm ≈ 67 Pa ≈ 0,67 mbar</div>
<h4>Test utrzymania próżni</h4>
<p>Po osiągnięciu celu odetnij pompę i obserwuj wakuometr przez co najmniej 10–15 minut:</p>
${fig(SVG_VACUUM, "Interpretacja testu utrzymania próżni.")}
${tbl(["Obraz", "Interpretacja", "Działanie"], [

])}
<p>Kryterium akceptacji podaje producent albo procedura firmy. Zapisz wartości w protokole.</p>` },

<div class="note">Mieszaniny zeotropowe: przegrzanie licz od temperatury <b>punktu rosy</b> (dew), dochłodzenie od temperatury <b>punktu pęcherzyków</b> (bubble). Dla R410A różnica jest pomijalna, dla R407C wynosi kilka kelwinów.</div>` },

  { t: "Protokół i przekazanie", h: `

<ul>

<li><b>Wyłącznik różnicowoprądowy</b>: urządzenia z falownikiem mogą generować prądy upływu o wysokiej częstotliwości i składowej stałej. Producenci wymagają wtedy RCD typu F lub B. Typ AC jest nieodpowiedni.</li>
<li>Przekrój przewodu dobierz do obciążalności długotrwałej, sposobu ułożenia i spadku napięcia.</li>
<li>Przewód komunikacyjny między jednostkami prowadź zgodnie z instrukcją, zwykle ekranowany i z dala od przewodów zasilających.</li>
<li>Pomiary odbiorcze: ciągłość przewodów ochronnych, rezystancja izolacji (dla obwodów 230/400 V co najmniej 1 MΩ przy 500 V DC), skuteczność ochrony przeciwporażeniowej. Przed pomiarem izolacji odłącz elektronikę, jeśli wymaga tego instrukcja.</li>
</ul>
<div class="note warn">Prace przy instalacjach elektrycznych wymagają odpowiedniego świadectwa kwalifikacyjnego (grupa G1). Certyfikat F-gazowy go nie zastępuje.</div>` },

  { t: "Krzywa grzewcza i sterowanie", h: `
<p><b>Regulacja pogodowa</b> ustala temperaturę zasilania z temperatury zewnętrznej. Liniowa krzywa przechodzi przez punkt projektowy i punkt stały, w którym zasilanie ma temperaturę pomieszczenia:</p>
<div class="f">T_z = 20 + (T_z,proj − 20) · (20 − T_zew) / (20 − θe)</div>
${tbl(["T zewn.", "−20 °C", "−10 °C", "0 °C", "+10 °C"], [
  ["Podłogówka 35 °C przy −20 °C"].concat([-20, -10, 0, 10].map(t => fmt(heatCurve(20, -20, 35, t), 1) + " °C")),
  ["Grzejniki 50 °C przy −20 °C"].concat([-20, -10, 0, 10].map(t => fmt(heatCurve(20, -20, 50, t), 1) + " °C")),
])}
<ul>
<li>Ustaw krzywę <b>możliwie nisko</b>. Zbyt wysoka krzywa obniża COP, a termostaty i tak dławią nadmiar ciepła.</li>
<li><b>Nachylenie</b> koryguj, gdy w mrozy jest za zimno lub za ciepło. <b>Przesunięcie</b> koryguj, gdy błąd jest stały w całym zakresie.</li>
<li>Nie zamykaj wszystkich pętli termostatami. Zostaw otwarte pętle w pomieszczeniu referencyjnym, żeby utrzymać przepływ i zład.</li>
<li>Ogranicz taktowanie: minimalny czas pracy i postoju, histereza, modulacja mocy.</li>
<li>C.w.u. ładuj w harmonogramie, najlepiej w tańszej strefie taryfy i w cieplejszej części dnia.</li>
</ul>` },

  { t: "SG Ready, fotowoltaika i taryfy", h: `
<p><b>SG Ready</b> to standard sterowania pompą ciepła przez dwa styki bezpotencjałowe, na przykład z falownika PV, licznika energii albo systemu zarządzania energią:</p>
${tbl(["Stan", "Styki 1 : 2", "Działanie"], [
  ["1", "1 : 0", "blokada pracy (np. wyłączenie przez operatora sieci)"],
  ["2", "0 : 0", "praca normalna"],
  ["3", "0 : 1", "zalecenie wzmożonej pracy: podniesione nastawy, ładowanie zasobnika i bufora"],
  ["4", "1 : 1", "polecenie włączenia: maksymalne nastawy, nadwyżka energii do wykorzystania"],

<ul>
<li>Nadwyżkę z fotowoltaiki najlepiej zmagazynować w c.w.u. i w masie budynku, nie w grzałce.</li>
<li>Taryfy dwu- i wielostrefowe pozwalają przesunąć ładowanie c.w.u. i bufora na tańsze godziny. Bufor i zasobnik działają jak magazyn energii.</li>
<li>Integracja przez Modbus lub API producenta daje więcej niż SG Ready, ale jest specyficzna dla urządzenia.</li>
</ul>` },
  ],
  bank: [

  { q: "Ile wynosi prąd pompy ciepła 3-fazowej 6 kW przy cos φ 0,95?", a: ["ok. 9,1 A", "ok. 15,8 A", "ok. 27,5 A", "ok. 5,3 A"], why: "6000 / (1,732 × 400 × 0,95) ≈ 9,1 A.", e: [null, "Pominięto √3.", "Podstawiono 230 V bez √3.", null] },

  { q: "Zbyt wysoko ustawiona krzywa grzewcza powoduje:", a: ["niższy COP i dławienie nadmiaru ciepła przez termostaty", "wyższy SCOP", "brak odszraniania", "mniejsze zużycie energii"], why: "Każdy zbędny kelwin temperatury zasilania to strata około 2–3% COP." },
  { q: "Stan SG Ready 1 : 0 oznacza:", a: ["blokadę pracy", "pracę normalną", "zalecenie wzmożonej pracy", "polecenie włączenia"], why: "Stany: 1:0 blokada, 0:0 normalna, 0:1 zalecenie, 1:1 polecenie." },
  { q: "Jaki jest najlepszy sposób wykorzystania nadwyżki energii z PV przez pompę ciepła?", a: ["Podniesienie nastaw i magazynowanie ciepła w c.w.u. i w budynku z wysokim COP", "Włączenie grzałki elektrycznej", "Wyłączenie pompy ciepła", "Obniżenie krzywej grzewczej"], why: "Pompa ciepła z każdej kWh daje kilka kWh ciepła, a grzałka tylko jedną." },

COURSE.push({ id: "m12", part: "IV. Automatyka i serwis", title: "Diagnostyka, serwis i odzysk czynnika", time: "55 min",
  goal: "Rozpoznasz usterkę po zestawie pomiarów i bezpiecznie odzyskasz czynnik zgodnie z przepisami.",
  gens: [],
  lessons: [
  { t: "Tabela diagnostyczna obiegu", h: `
${tbl(["Usterka", "Ssanie", "Tłoczenie", "Przegrzanie", "Dochłodzenie"], [
  ["Niedobór czynnika", "↓", "↓", "↑", "↓"],
  ["Nadmiar czynnika", "↑ lub ≈", "↑", "↓", "↑"],

  ["Niesprawna sprężarka (przecieki wewnętrzne)", "↑", "↓", "≈", "≈"],
])}
<p>Kluczowe pary do odróżnienia:</p>
<ul>
<li><b>Niedobór czy ograniczenie?</b> Oba dają wysokie przegrzanie. Niedobór ma niskie dochłodzenie, bo w skraplaczu brakuje cieczy. Ograniczenie ma wysokie dochłodzenie, bo ciecz zatrzymuje się przed przeszkodą. Przy ograniczeniu często czuć też spadek temperatury na filtrze.</li>
<li><b>Nadmiar czy słaby skraplacz?</b> Oba podnoszą ciśnienie tłoczenia. Nadmiar zalewa skraplacz cieczą, więc dochłodzenie jest wysokie.</li>
</ul>
<div class="note">W urządzeniach z EEV sterownik kompensuje zmiany: przegrzanie może pozostać w normie, a problem widać w stopniu otwarcia zaworu. Zawór otwarty maksymalnie przy wysokim przegrzaniu to typowy objaw niedoboru.</div>` },

  { t: "Usterki po stronie wody, powietrza i elektroniki", h: `
<ul>
<li><b>Błąd przepływu i wysokie ciśnienie w grzaniu</b>: zapchany filtr, zapowietrzenie, zamknięte pętle, uszkodzona pompa obiegowa. Sprawdź ΔT wody: znacznie powyżej projektowej oznacza za mały przepływ.</li>
<li><b>Oblodzenie jednostki zewnętrznej</b>: nieudane odszranianie, uszkodzony czujnik temperatury wymiennika, zamarznięty odpływ skroplin, jednostka stojąca w zagłębieniu, w którym zbiera się woda.</li>
<li><b>Czujniki NTC</b>: zmierz rezystancję i porównaj z tabelą producenta (np. 10 kΩ przy 25 °C, inne typy mają inne wartości). Sprawdź też, czy czujnik ma dobry kontakt termiczny z rurą.</li>
<li><b>Kody błędów</b> zawsze interpretuj z dokumentacją serwisową. Ten sam kod bywa objawem, a nie przyczyną. Błąd wysokiego ciśnienia często ma źródło w hydraulice.</li>
<li><b>Hałas i drgania</b>: stykające się rury, brak podkładek antywibracyjnych, luźne panele. W pompach ciepła także zbyt duża prędkość wody.</li>
</ul>` },

  { t: "Odzysk czynnika i przeglądy okresowe", h: `
<ul>
<li>Odzysk wykonuj <b>stacją odzysku</b> do butli przeznaczonej do odzysku, oznaczonej i dopuszczonej do danego czynnika. Czynniki palne wymagają stacji i butli dopuszczonych do nich.</li>
<li>Butli nie napełniaj powyżej <b>80% objętości</b> cieczą. Wzrost temperatury rozszerza ciecz i może rozerwać przepełnioną butlę. Kontroluj masę na wadze.</li>
<li>Nie mieszaj różnych czynników w jednej butli. Mieszaniny nie da się zregenerować i staje się kosztownym odpadem.</li>

  ] });

const COURSE_BY_ID = {};
for (const m of COURSE) COURSE_BY_ID[m.id] = m;

/* Liczby zadań i progi zaliczenia */
const DRILL_LEN = 6;          // ćwiczenia: bez oceny
const TEST_LEN = 8, TEST_PASS = 6;
const EXAM_PER_MOD = 2, EXAM_PASS = 19;   // 24 zadania, próg ok. 80%

/* ═══════════════════════════════════════════════════════════════
   8. STAN I MODEL POSTĘPU
   ═══════════════════════════════════════════════════════════════ */
const STORE_KEY = "hvac.kurs.v1";
function freshState() { return { mods: {}, exam: null, stats: {}, name: "", train: { sessions: 0 } }; }
let State = freshState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(State)); } catch (e) { /* tryb prywatny */ } }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) State = Object.assign(freshState(), JSON.parse(raw));
  } catch (e) { State = freshState(); }
}
function modProgress(id) {
  if (!State.mods[id]) State.mods[id] = { drill: false, best: 0, passed: false };
  return State.mods[id];
}
function modStats(id) {
  if (!State.stats[id]) State.stats[id] = { seen: 0, ok: 0 };
  return State.stats[id];
}
function record(mid, ok) { const s = modStats(mid); s.seen++; if (ok) s.ok++; }
function moduleIndex(id) { for (let i = 0; i < COURSE.length; i++) if (COURSE[i].id === id) return i; return -1; }
function moduleUnlocked(i) { return i === 0 || modProgress(COURSE[i - 1].id).passed; }
function passedCount() { let n = 0; for (const m of COURSE) if (modProgress(m.id).passed) n++; return n; }
function examUnlocked() { return passedCount() === COURSE.length; }
function courseDone() { return !!(State.exam && State.exam.passed); }
function totals() {
  let seen = 0, ok = 0;
  for (const k in State.stats) { seen += State.stats[k].seen; ok += State.stats[k].ok; }
  return { seen, ok };
}

/* ═══════════════════════════════════════════════════════════════
   9. KOLEJKI ZADAŃ
   Zadanie w kolejce to przepis { mid, gen } albo { mid, bank },
   a samo pytanie powstaje dopiero przy wyświetleniu, więc
   generatory dają świeże dane przy każdej próbie.
   ═══════════════════════════════════════════════════════════════ */
function makeQuestion(spec) {
  const m = COURSE_BY_ID[spec.mid];
  if (spec.gen) return GEN[spec.gen]();
  const b = m.bank[spec.bank];
  return mkQ("Moduł " + (moduleIndex(m.id) + 1), b.q, b.a[0], b.a.slice(1), b.why, b.e ? b.e.slice(1) : null, false);
}
function bankSpecs(m, n, avoid) {
  const idx = shuffle(m.bank.map((_, i) => i)).filter(i => !(avoid && avoid.has(i)));
  return idx.slice(0, n).map(i => ({ mid: m.id, bank: i }));
}
function genSpecs(m, n) {
  const out = [];
  const g = shuffle(m.gens);
  for (let i = 0; i < n && g.length; i++) out.push({ mid: m.id, gen: g[i % g.length] });
  return out;
}
function drillQueue(m) {
  const g = genSpecs(m, m.gens.length ? 2 : 0);
  const b = bankSpecs(m, DRILL_LEN - g.length);
  const out = [];
  while (b.length || g.length) { if (b.length) out.push(b.shift()); if (b.length) out.push(b.shift()); if (g.length) out.push(g.shift()); }
  return out;
}
function testQueue(m) {
  const g = genSpecs(m, m.gens.length ? 3 : 0);
  return shuffle(g.concat(bankSpecs(m, TEST_LEN - g.length)));
}
function examQueue() {
  const out = [];
  for (const m of COURSE) {
    const g = genSpecs(m, m.gens.length ? 1 : 0);
    out.push(...g, ...bankSpecs(m, EXAM_PER_MOD - g.length));
  }
  return shuffle(out);
}
/** Trening: moduły już otwarte, słabsze częściej, bez dwóch zadań z tego samego modułu pod rząd. */
function trainingQueue(n) {
  const open = COURSE.filter((m, i) => moduleUnlocked(i));
  const w = open.map(m => { const s = modStats(m.id); const acc = s.seen ? s.ok / s.seen : 0.5; return 1 + 3 * (1 - acc); });
  const out = [];
  let last = null;
  for (let k = 0; k < n; k++) {
    let m = null;
    for (let t = 0; t < 20; t++) {
      let r = Math.random() * w.reduce((a, b) => a + b, 0), j = 0;
      while (r > w[j]) { r -= w[j]; j++; }
      m = open[Math.min(j, open.length - 1)];
      if (m.id !== last || open.length === 1) break;
    }
    last = m.id;
    out.push(m.gens.length && Math.random() < 0.5 ? genSpecs(m, 1)[0] : bankSpecs(m, 1)[0]);
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   10. SESJA
   ═══════════════════════════════════════════════════════════════ */
const UI = { tab: "kurs", module: null };
const Session = { active: false, mode: null, moduleId: null, queue: [], i: 0, q: null, spec: null, answered: false, choice: -1, ok: 0, summary: null };

function startSession(o) {
  Object.assign(Session, { active: true, mode: o.mode, moduleId: o.moduleId || null, queue: o.queue, i: 0, ok: 0, summary: null });
  loadQuestion();
  UI.tab = o.mode === "trening" ? "trening" : "kurs";
  render();
  window.scrollTo(0, 0);
}
function loadQuestion() {
  Session.spec = Session.queue[Session.i];
  Session.q = makeQuestion(Session.spec);
  Session.answered = false; Session.choice = -1;
}
function answer(idx) {
  if (!Session.active || Session.answered) return;
  Session.answered = true; Session.choice = idx;
  const ok = idx === Session.q.correct;
  if (ok) Session.ok++;
  record(Session.spec.mid, ok);
  save(); render();
}
function nextStep() {
  if (!Session.answered) return;
  Session.i++;
  if (Session.i >= Session.queue.length) finishSession();
  else loadQuestion();
  render();
  window.scrollTo(0, 0);
}
function finishSession() {
  const s = { mode: Session.mode, moduleId: Session.moduleId, ok: Session.ok, len: Session.queue.length };
  Session.active = false; Session.summary = s;
  if (s.mode === "drill") modProgress(s.moduleId).drill = true;
  if (s.mode === "test") {
    const p = modProgress(s.moduleId);
    p.best = Math.max(p.best, s.ok);
    if (s.ok >= TEST_PASS) p.passed = true;
  }
  if (s.mode === "exam") {
    const passed = s.ok >= EXAM_PASS;
    if (!State.exam || s.ok > State.exam.score || (passed && !State.exam.passed))
      State.exam = { score: s.ok, total: s.len, date: Date.now(), passed: passed || !!(State.exam && State.exam.passed) };
  }
  if (s.mode === "trening") State.train.sessions++;
  save();
}

function bindKeys() {
  document.addEventListener("keydown", e => {
  if (!Session.active || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const n = parseInt(e.key, 10);
  if (!Session.answered && n >= 1 && n <= Session.q.options.length) answer(n - 1);
  else if (Session.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nextStep(); }
  });
}

/* ═══════════════════════════════════════════════════════════════
   11. WIDOK ZADANIA
   ═══════════════════════════════════════════════════════════════ */
function renderQuestion(root) {
  const q = Session.q;
  const card = el("div", "card");
  const head = el("div", "q-head");
  head.appendChild(el("div", "q-tag" + (q.calc ? " calc" : ""), q.tag));
  head.appendChild(el("div", "q-text", q.text));
  head.appendChild(el("div", "q-count", (Session.i + 1) + " / " + Session.queue.length));
  card.appendChild(head);
  const bar = el("div", "bar"); const fill = el("i");
  fill.style.width = (Session.i / Session.queue.length * 100) + "%"; bar.appendChild(fill);
  card.appendChild(bar);

  const opts = el("div", "opts");
  q.options.forEach((t, i) => {
    const b = el("button", "opt");
    b.appendChild(el("span", "k", String.fromCharCode(65 + i)));
    b.appendChild(document.createTextNode(t));
    if (Session.answered) {
      b.disabled = true;
      if (i === q.correct) b.classList.add("ok");
      else if (i === Session.choice) b.classList.add("no");
    } else b.onclick = () => answer(i);
    opts.appendChild(b);
  });
  card.appendChild(opts);

  if (Session.answered) {
    const ok = Session.choice === q.correct;
    const fb = el("div", "fb " + (ok ? "good" : "bad"));
    fb.appendChild(el("b", "t", ok ? "Dobrze" : "Poprawna odpowiedź: " + q.options[q.correct]));
    if (!ok && q.wrongWhy[Session.choice]) fb.appendChild(el("p", "why-wrong", "Twój wybór: " + q.wrongWhy[Session.choice]));
    fb.appendChild(el("p", null, q.why));
    card.appendChild(fb);
    const row = el("div", "row mt");
    const last = Session.i + 1 >= Session.queue.length;
    const nb = el("button", "btn", last ? "Zakończ" : "Dalej");
    nb.onclick = nextStep;
    row.appendChild(nb);
    row.appendChild(el("span", "muted", "Enter: dalej · klawisze 1–4: odpowiedź"));
    card.appendChild(row);
  }
  root.appendChild(card);
}

function sessionBar(label, title) {
  const c = el("div", "card"); c.style.padding = "12px 16px";
  const row = el("div", "row");
  row.appendChild(el("div", "q-tag", label));
  row.appendChild(el("b", null, title));
  row.appendChild(el("div", "spacer"));
  const stop = el("button", "btn ghost sm", "Przerwij");
  stop.onclick = () => { Session.active = false; Session.summary = null; render(); };
  row.appendChild(stop);
  c.appendChild(row);
  return c;
}

function screenKurs(root) {
  if (Session.active && Session.mode !== "trening") {
    const m = COURSE_BY_ID[Session.moduleId];
    const lbl = { drill: "Ćwiczenia", test: "Sprawdzian", exam: "Egzamin końcowy" }[Session.mode];
    root.appendChild(sessionBar(lbl, m ? "Moduł " + (moduleIndex(m.id) + 1) + ". " + m.title : "Wszystkie moduły"));
    renderQuestion(root);
    return;
  }
  if (Session.summary && Session.summary.mode !== "trening") { courseSummary(root); return; }
  if (UI.module) { moduleDetail(root, UI.module); return; }
  syllabus(root);
}

function syllabus(root) {

  intro.appendChild(el("p", "lead",
    "Dwanaście modułów na poziomie zaawansowanym: od termodynamiki obiegu, przez przepisy, projekt i hydraulikę, po montaż, uruchomienie i diagnostykę. " +
    "Każdy moduł kończy sprawdzian (" + TEST_PASS + " z " + TEST_LEN + "), który otwiera kolejny. Na końcu egzamin z " + (COURSE.length * EXAM_PER_MOD) + " zadań i certyfikat ukończenia."));
  intro.appendChild(el("p", null, "Zadania obliczeniowe są generowane za każdym razem od nowa, a błędne odpowiedzi opisują typowe pomyłki instalatorów. Łączny czas nauki to około 10–12 godzin."));
  const bar = el("div", "bar good"); bar.style.margin = "14px 0 8px";

  intro.appendChild(bar);
  intro.appendChild(el("div", "muted", "Zaliczone moduły: " + done + " z " + COURSE.length + (courseDone() ? " · kurs ukończony" : "")));
  root.appendChild(intro);

  if (courseDone()) root.appendChild(certificate());

  const list = el("div", "card");
  let part = null;
  COURSE.forEach((m, i) => {
    if (m.part !== part) { part = m.part; list.appendChild(el("div", "part-h", part)); }
    const pr = modProgress(m.id);
    const open = moduleUnlocked(i);
    const row = el("div", "mod" + (pr.passed ? " done" : "") + (open ? "" : " locked"));
    row.appendChild(el("div", "mod-num", pr.passed ? "✓" : String(i + 1)));
    const body = el("div", "mod-body");
    body.appendChild(el("div", "mod-title", m.title));
    body.appendChild(el("div", "mod-meta", m.time + " · " + m.lessons.length + " lekcje · " +
      (pr.passed ? "sprawdzian " + pr.best + "/" + TEST_LEN : open ? "gotowy do rozpoczęcia" : "wymaga zaliczenia modułu " + i)));
    row.appendChild(body);
    row.appendChild(el("div", "mod-badge " + (pr.passed ? "badge-done" : open ? "badge-open" : "badge-lock"),

    list.appendChild(row);
  });
  list.appendChild(el("div", "part-h", "Zakończenie"));
  const exOpen = examUnlocked();
  const ex = el("div", "mod" + (courseDone() ? " done" : "") + (exOpen ? "" : " locked"));

    (State.exam ? " · najlepszy wynik " + State.exam.score + "/" + State.exam.total : "")));
  ex.appendChild(eb);
  ex.appendChild(el("div", "mod-badge " + (courseDone() ? "badge-done" : exOpen ? "badge-open" : "badge-lock"),
    courseDone() ? "zdany" : exOpen ? "otwarty" : "zamknięty"));
  if (exOpen) ex.onclick = () => startSession({ mode: "exam", queue: examQueue() });
  list.appendChild(ex);
  root.appendChild(list);
}

function courseSummary(root) {
  const s = Session.summary, m = COURSE_BY_ID[s.moduleId], i = m ? moduleIndex(m.id) : -1;
  const card = el("div", "card center");
  const clear = () => { Session.summary = null; };
  const row = el("div", "row mt"); row.style.justifyContent = "center";
  if (s.mode === "drill") {
    card.appendChild(el("h2", null, "Ćwiczenia zakończone"));
    card.appendChild(bigScore(s, null));
    card.appendChild(el("p", null, "Ćwiczenia nie są oceniane. Gdy czujesz się pewnie, przejdź do sprawdzianu."));
    row.appendChild(btn("Sprawdzian (" + TEST_LEN + ")", "", () => { clear(); startSession({ mode: "test", moduleId: m.id, queue: testQueue(m) }); }));
    row.appendChild(btn("Powtórz ćwiczenia", "ghost", () => { clear(); startSession({ mode: "drill", moduleId: m.id, queue: drillQueue(m) }); }));
    row.appendChild(btn("Wróć do modułu", "ghost", () => { clear(); UI.module = m.id; render(); }));
  } else if (s.mode === "test") {
    const ok = s.ok >= TEST_PASS;
    card.appendChild(el("h2", null, ok ? "Moduł zaliczony" : "Sprawdzian niezaliczony"));
    card.appendChild(bigScore(s, ok));
    card.appendChild(el("p", null, ok ? "Próg wynosił " + TEST_PASS + ". Kolejny etap jest otwarty."
      : "Do zaliczenia brakuje " + (TEST_PASS - s.ok) + " poprawnych odpowiedzi. Wróć do teorii i ćwiczeń, a potem spróbuj ponownie."));
    if (ok && i + 1 < COURSE.length)
      row.appendChild(btn("Moduł " + (i + 2) + ": " + COURSE[i + 1].title, "", () => { clear(); UI.module = COURSE[i + 1].id; render(); }));
    else if (ok && examUnlocked())
      row.appendChild(btn("Egzamin końcowy", "", () => { clear(); startSession({ mode: "exam", queue: examQueue() }); }));
    row.appendChild(btn(ok ? "Powtórz sprawdzian" : "Powtórz ćwiczenia", ok ? "ghost" : "", () => {
      clear();
      if (ok) startSession({ mode: "test", moduleId: m.id, queue: testQueue(m) });
      else startSession({ mode: "drill", moduleId: m.id, queue: drillQueue(m) });
    }));
    row.appendChild(btn("Spis modułów", "ghost", () => { clear(); UI.module = null; render(); }));
  } else {
    const ok = s.ok >= EXAM_PASS;
    card.appendChild(el("h2", null, ok ? "Egzamin zdany" : "Egzamin niezaliczony"));
    card.appendChild(bigScore(s, ok));
    card.appendChild(el("p", null, ok ? "Kurs ukończony. Certyfikat znajdziesz w spisie modułów."
      : "Próg wynosi " + EXAM_PASS + " z " + s.len + ". Zakładka Postępy pokazuje moduły, w których idzie Ci najsłabiej."));
    row.appendChild(btn(ok ? "Zobacz certyfikat" : "Spis modułów", "", () => { clear(); UI.module = null; render(); }));
    if (!ok) row.appendChild(btn("Powtórz egzamin", "ghost", () => { clear(); startSession({ mode: "exam", queue: examQueue() }); }));
  }
  card.appendChild(row);
  root.appendChild(card);
}

const TRAIN_LEN = 10;
function screenTrening(root) {
  if (Session.active && Session.mode === "trening") {
    root.appendChild(sessionBar("Trening", "Zadania mieszane z otwartych modułów"));
    renderQuestion(root); return;
  }
  const card = el("div", "card");
  if (Session.summary && Session.summary.mode === "trening") {
    const s = Session.summary;
    card.classList.add("center");

    card.appendChild(el("p", null, "Kolejna sesja częściej sięgnie do modułów, w których masz niższą skuteczność."));
    const row = el("div", "row mt"); row.style.justifyContent = "center";

/* ═══════════════════════════════════════════════════════════════
   14. KALKULATORY
   Każdy kalkulator używa tych samych funkcji co generatory zadań,
   więc wynik w kalkulatorze i w zadaniu nie może się rozjechać.
   ═══════════════════════════════════════════════════════════════ */
const ZONES = [["-16", "I (−16 °C)"], ["-18", "II (−18 °C)"], ["-20", "III (−20 °C)"], ["-22", "IV (−22 °C)"], ["-24", "V (−24 °C)"]];
const CALCS = [
  { id: "co2", title: "Ekwiwalent CO₂ i kontrola szczelności",
    f: [["ref", "Czynnik", "sel", "R32", Object.keys(REF).map(k => [k, k + " (GWP " + REF[k].gwp + ")"])], ["kg", "Ilość czynnika [kg]", "num", 3.0],
        ["herm", "Urządzenie hermetyczne (oznakowane)", "chk", false], ["det", "System wykrywania wycieków", "chk", false]],
    run(v) {
      const r = leakCheck(v.ref, v.kg, v.herm, v.det);
      return `<b class="big">${fmt(co2e(v.ref, v.kg), 2)} t CO₂e</b>` +
        (r.months ? `<span class="wn">Kontrola szczelności co ${r.months} miesięcy</span> (${r.reason}).<br>Operator zakłada kartę urządzenia w CRO w ciągu 15 dni.`
                  : `<span class="ok">Brak obowiązkowej kontroli szczelności</span>: ${r.reason}.`);
    } },
  { id: "sh", title: "Przegrzanie i dochłodzenie",
    f: [["ref", "Czynnik", "sel", "R32", PT_REFS.map(k => [k, k])], ["mode", "Pomiar", "sel", "sh", [["sh", "przegrzanie (ssanie)"], ["sc", "dochłodzenie (ciecz)"]]],
        ["p", "Ciśnienie z manometru [bar]", "num", 8.4], ["t", "Temperatura rury [°C]", "num", 12]],
    run(v) {
      const pa = v.p + P_ATM, ts = tsat(v.ref, pa);
      const x = v.mode === "sh" ? v.t - ts : ts - v.t;
      const lo = v.mode === "sh" ? 3 : 2, hi = v.mode === "sh" ? 10 : 8;
      const ocena = x < lo ? `<span class="no">nisko</span>${v.mode === "sh" ? " — ryzyko cieczy na ssaniu" : ""}` : x > hi ? `<span class="wn">wysoko</span>` : `<span class="ok">zakres typowy</span>`;
      const warn = pa < REF[v.ref].pt[0] || pa > REF[v.ref].pt[REF[v.ref].pt.length - 1] ? "<br><span class='wn'>Ciśnienie poza zakresem tabeli (−30…60 °C): wynik jest ekstrapolacją.</span>" : "";
      return `<b class="big">${v.mode === "sh" ? "SH" : "SC"} = ${fmt(x, 1)} K</b>p abs = ${fmt(pa, 2)} bar · T nasycenia = ${fmt(ts, 1)} °C · ${ocena}${warn}<br>Zakresy orientacyjne; obowiązują wartości producenta.`;
    } },
  { id: "charge", title: "Doładowanie czynnika",
    f: [["ref", "Czynnik", "sel", "R32", ["R32", "R410A", "R454B"].map(k => [k, k])], ["fab", "Napełnienie fabryczne [kg]", "num", 1.1],
        ["pre", "Długość fabryczna [m]", "num", 7.5], ["L", "Długość instalacji [m]", "num", 15], ["g", "Doładowanie [g/m]", "num", 20]],
    run(v) {
      const add = addCharge(v.L, v.pre, v.g), tot = v.fab + add / 1000;
      return `<b class="big">+ ${fmt(add, 0)} g</b>Całość: ${fmt(tot, 2)} kg = ${fmt(co2e(v.ref, tot), 2)} t CO₂e. Wpisz obie wartości na etykiecie.`;
    } },
  { id: "flow", title: "Przepływ i prędkość w rurze",
    f: [["P", "Moc [kW]", "num", 8], ["dT", "ΔT zasilanie–powrót [K]", "num", 5], ["pipe", "Rura", "sel", "1", PIPES.map((p, i) => [String(i), p[0] + " (dw " + fmt(p[1], 1) + " mm)"])]],
    run(v) {
      const V = flowM3h(v.P, v.dT), p = PIPES[+v.pipe], w = velocity(V, p[1]);
      const ok = w <= 1.0 ? (w >= 0.3 ? `<span class="ok">prędkość w zakresie</span>` : `<span class="wn">rura przewymiarowana</span>`) : `<span class="no">za duża prędkość — większa średnica</span>`;
      const best = PIPES.find(q => velocity(V, q[1]) <= 1.0);
      return `<b class="big">${fmt(V, 2)} m³/h</b>${fmt(V * 1000 / 60, 1)} l/min · v = ${fmt(w, 2)} m/s w ${p[0]} · ${ok}` +
        (best ? `<br>Najmniejsza rura z listy z v ≤ 1,0 m/s: ${best[0]}.` : "<br>Żadna rura z listy nie spełnia v ≤ 1,0 m/s.");
    } },
  { id: "biv", title: "Punkt biwalentny",
    f: [["qd", "Obciążenie projektowe [kW]", "num", 8], ["te", "Strefa klimatyczna", "sel", "-20", ZONES],
        ["p1", "Moc pompy przy −7 °C [kW]", "num", 5.5], ["p2", "Moc pompy przy +7 °C [kW]", "num", 8]],
    run(v) {
      const te = +v.te, t = bivalent(v.qd, te, 15, -7, v.p1, 7, v.p2);
      const valid = isFinite(t) && t > te - 30 && t < 15;
      return (valid ? `<b class="big">θbiw = ${fmt(t, 1)} °C</b>Moc pompy przy θe: ${fmt(v.p1 + (v.p2 - v.p1) / 14 * (te + 7), 1)} kW, brakuje ${fmt(Math.max(0, v.qd - (v.p1 + (v.p2 - v.p1) / 14 * (te + 7))), 1)} kW (źródło szczytowe).`
                    : `<b class="big">—</b><span class="wn">Linie się nie przecinają w zakresie ogrzewania. Sprawdź dane.</span>`) + bivalentSvg(v.qd, te, v.p1, v.p2, valid ? t : null);
    } },
  { id: "bh", title: "Sondy gruntowe",
    f: [["Q", "Moc grzewcza [kW]", "num", 10], ["cop", "COP (B0/W35)", "num", 4.5], ["q", "Moc jednostkowa gruntu [W/m]", "num", 45]],
    run(v) {
      const L = boreholeLength(v.Q, v.cop, v.q);
      return `<b class="big">${fmt(L, 0)} m sond</b>Moc z gruntu: ${fmt(v.Q * (1 - 1 / v.cop), 2)} kW · np. ${Math.ceil(L / 100)} × ${fmt(L / Math.ceil(L / 100), 0)} m, rozstaw ≥ 6 m. Powyżej 30 m głębokości: projekt robót geologicznych.`;
    } },
  { id: "press", title: "Próba azotem: korekta temperatury",
    f: [["p1", "Ciśnienie na początku [bar, manometr]", "num", 40], ["t1", "Temperatura na początku [°C]", "num", 25],
        ["t2", "Temperatura na końcu [°C]", "num", 15], ["p2", "Ciśnienie na końcu [bar, manometr]", "num", 38.6]],
    run(v) {
      const e = pressureAt(v.p1, v.t1, v.t2), d = v.p2 - e;
      const ver = Math.abs(d) <= 0.2 ? `<span class="ok">zmiana wyjaśniona temperaturą</span>` : d < 0 ? `<span class="no">spadek większy niż z temperatury — szukaj nieszczelności</span>` : `<span class="wn">ciśnienie wyższe niż oczekiwane — sprawdź pomiar temperatury</span>`;
      return `<b class="big">oczekiwane ${fmt(e, 2)} bar</b>Różnica pomiaru: ${fmt(d, 2)} bar · ${ver}<br>Tolerancja 0,2 bar przyjęta dla manometru cyfrowego; stosuj kryterium z procedury.`;
    } },
  { id: "lim", title: "Limit napełnienia czynnikiem palnym",
    f: [["ref", "Czynnik", "sel", "R32", ["R32", "R454B", "R290"].map(k => [k, k + " (LFL " + fmt(REF[k].lfl, 3) + ")"])],
        ["h0", "Montaż jednostki", "sel", "sciana", [["podloga", "podłogowa (0,6 m)"], ["okno", "okienna (1,0 m)"], ["sciana", "ścienna (1,8 m)"], ["sufit", "sufitowa (2,2 m)"]]],
        ["A", "Powierzchnia pomieszczenia [m²]", "num", 20], ["m", "Napełnienie urządzenia [kg]", "num", 1.2]],
    run(v) {
      const lfl = REF[v.ref].lfl, mx = chargeLimit(lfl, H0[v.h0], v.A), amin = minArea(lfl, H0[v.h0], v.m);
      return `<b class="big">m_max = ${fmt(mx, 2)} kg</b>Minimalna powierzchnia dla ${fmt(v.m, 2)} kg: ${fmt(amin, 1)} m² · ` +
        (v.m <= mx ? `<span class="ok">napełnienie mieści się w limicie</span>` : `<span class="no">przekroczony limit — potrzebne środki dodatkowe wg instrukcji</span>`) +
        `<br>Wzór podstawowy PN-EN 378-1 / PN-EN IEC 60335-2-40. Decyduje instrukcja urządzenia.`;
    } },
  { id: "noise", title: "Hałas jednostki zewnętrznej",
    f: [["lw", "Moc akustyczna L_W [dB(A)]", "num", 55], ["r", "Odległość [m]", "num", 5],
        ["q", "Ustawienie", "sel", "4", [["2", "na gruncie, swobodnie (Q = 2)"], ["4", "przy ścianie (Q = 4)"], ["8", "w narożniku (Q = 8)"]]], ["n", "Liczba jednakowych jednostek", "num", 1]],
    run(v) {
      const lp = soundAt(v.lw, v.r, +v.q) + 10 * Math.log10(Math.max(1, v.n));
      return `<b class="big">L_p = ${fmt(lp, 1)} dB(A)</b>` + (lp <= 40 ? `<span class="ok">poniżej nocnego limitu 40 dB(A)</span>` : lp <= 50 ? `<span class="wn">powyżej nocnego limitu 40 dB(A), poniżej dziennego</span>` : `<span class="no">powyżej 50 dB(A)</span>`) +
        `<br>Limity dla terenów zabudowy jednorodzinnej; ocena dotyczy granicy działki lub okna sąsiada.`;
    } },
  { id: "dew", title: "Punkt rosy",
    f: [["t", "Temperatura powietrza [°C]", "num", 24], ["rh", "Wilgotność względna [%]", "num", 60]],
    run(v) { const d = dewPoint(v.t, Math.min(100, Math.max(1, v.rh))); return `<b class="big">${fmt(d, 1)} °C</b>Powierzchnie zimniejsze niż ${fmt(d, 1)} °C będą rosić. Zasilanie chłodzenia podłogowego trzymaj co najmniej 1–2 K wyżej.`; } },
  { id: "curve", title: "Krzywa grzewcza (liniowa)",
    f: [["te", "Strefa klimatyczna", "sel", "-20", ZONES], ["ts", "Zasilanie projektowe [°C]", "num", 35], ["to", "Temperatura zewnętrzna [°C]", "num", 0]],
    run(v) { return `<b class="big">${fmt(heatCurve(20, +v.te, v.ts, v.to), 1)} °C</b>Punkt stały: 20 °C zasilania przy 20 °C na zewnątrz.`; } },
  { id: "amp", title: "Prąd zasilania",
    f: [["P", "Moc czynna [kW]", "num", 6], ["ph", "Zasilanie", "sel", "3", [["1", "1-fazowe 230 V"], ["3", "3-fazowe 400 V"]]], ["cf", "cos φ", "num", 0.95]],
    run(v) { return `<b class="big">${fmt(current(v.P, +v.ph, v.cf), 1)} A</b>Zabezpieczenie i przekrój dobierz wg instrukcji urządzenia, sposobu ułożenia przewodu i spadku napięcia.`; } },
];

function bivalentSvg(qd, te, p1, p2, tb) {
  const W = 320, H = 170, x0 = 34, y0 = 145, t0 = te - 2, t1 = 18;
  const pmax = Math.max(qd, p2 + (p2 - p1) / 14 * 11, 1) * 1.1;
  const X = t => x0 + (t - t0) / (t1 - t0) * (W - x0 - 10), Y = p => y0 - Math.max(0, p) / pmax * (y0 - 12);
  const hp = t => p1 + (p2 - p1) / 14 * (t + 7);
  let s = `<svg viewBox="0 0 ${W} ${H + 12}" width="${W}" style="margin-top:10px;max-width:100%">`;
  s += `<line x1="${x0}" y1="${y0}" x2="${W - 6}" y2="${y0}" stroke="#666"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="6" stroke="#666"/>`;
  for (let t = Math.ceil(t0 / 5) * 5; t <= t1; t += 5) s += `<text x="${X(t)}" y="${y0 + 14}" fill="#888" font-size="10" text-anchor="middle">${t}</text>`;
  s += `<text x="${x0 - 4}" y="${Y(qd) + 3}" fill="#888" font-size="10" text-anchor="end">${fmt(qd, 0)}</text>`;
  s += `<line x1="${X(te)}" y1="${Y(qd)}" x2="${X(15)}" y2="${Y(0)}" stroke="#FF7A45" stroke-width="2.5"/>`;
  s += `<line x1="${X(t0)}" y1="${Y(hp(t0))}" x2="${X(t1)}" y2="${Y(hp(t1))}" stroke="#4DA3FF" stroke-width="2.5"/>`;
  if (tb != null) s += `<circle cx="${X(tb)}" cy="${Y(loadAt(qd, te, 15, tb))}" r="5" fill="#FFD60A"/><line x1="${X(tb)}" y1="${Y(loadAt(qd, te, 15, tb))}" x2="${X(tb)}" y2="${y0}" stroke="#FFD60A" stroke-dasharray="3 3"/>`;
  s += `<text x="${W - 8}" y="16" fill="#FFB08A" font-size="10" text-anchor="end">budynek</text><text x="${W - 8}" y="30" fill="#9CC8FF" font-size="10" text-anchor="end">pompa ciepła</text>`;
  return s + `</svg>`;
}

function calcCard(c) {
  const card = el("div", "card");
  card.appendChild(el("h3", null, c.title));
  const inputs = {};
  const out = el("div", "out");
  const upd = () => {
    const v = {};
    for (const f of c.f) {
      const i = inputs[f[0]];
      v[f[0]] = f[2] === "num" ? parseFloat(String(i.value).replace(",", ".")) : f[2] === "chk" ? i.checked : i.value;
    }
    const bad = c.f.some(f => f[2] === "num" && !isFinite(v[f[0]]));
    try { out.innerHTML = bad ? `<span class="wn">Uzupełnij wszystkie pola liczbami.</span>` : c.run(v); }
    catch (e) { out.innerHTML = `<span class="no">Nie da się policzyć dla tych danych.</span>`; }
  };
  for (const f of c.f) {
    const w = el("div", "fld" + (f[2] === "chk" ? " chk" : ""));
    const id = "c-" + c.id + "-" + f[0];
    const lab = el("label", null, f[1]); lab.htmlFor = id;
    let i;
    if (f[2] === "sel") { i = el("select"); for (const o of f[4]) { const op = el("option", null, o[1]); op.value = o[0]; i.appendChild(op); } i.value = f[3]; }
    else if (f[2] === "chk") { i = el("input"); i.type = "checkbox"; i.checked = f[3]; }
    else { i = el("input"); i.type = "text"; i.inputMode = "decimal"; i.value = String(f[3]).replace(".", ","); }
    i.id = id; i.oninput = upd; i.onchange = upd;
    inputs[f[0]] = i;
    if (f[2] === "chk") { w.appendChild(i); w.appendChild(lab); } else { w.appendChild(lab); w.appendChild(i); }
    card.appendChild(w);
  }
  card.appendChild(out);
  upd();
  return card;
}
function screenKalk(root) {
  const intro = el("div", "card");
  intro.appendChild(el("h1", null, "Kalkulatory instalatora"));
  intro.appendChild(el("p", null, "Wzory z kursu w wersji roboczej. Wyniki są pomocą przy nauce i szacunkach. Nie zastępują instrukcji producenta, projektu ani obliczeń normowych."));
  root.appendChild(intro);
  const g = el("div", "calc-grid");
  for (const c of CALCS) g.appendChild(calcCard(c));
  root.appendChild(g);
}

/* ═══════════════════════════════════════════════════════════════
   15. ŚCIĄGA
   ═══════════════════════════════════════════════════════════════ */
function screenSciaga(root) {
  const add = (t, h) => { const c = el("div", "card"); c.appendChild(el("h2", null, t)); c.appendChild(html("div", null, h)); root.appendChild(c); };
  add("Ciśnienie nasycenia: wskazanie manometru [bar]",
    `<p>Nadciśnienie (manometr) = ciśnienie bezwzględne − 1,013 bar. Wartości przybliżone do nauki; w pracy korzystaj z tabel producenta czynnika lub manometru cyfrowego.</p>` +
    `<div class="tbl"><table><tr><th class="n">T [°C]</th>${PT_REFS.map(r => `<th class="n">${r}</th>`).join("")}</tr>` +
    PT_T.map((t, i) => `<tr><td class="n">${t}</td>${PT_REFS.map(r => `<td class="n">${fmt(REF[r].pt[i] - P_ATM, 2)}</td>`).join("")}</tr>`).join("") + `</table></div>`);
  add("Czynniki: GWP, klasy, LFL",
    tbl(["Czynnik", "GWP (AR4)", "Klasa", "LFL [kg/m³]", "F-gaz", "Uwagi"],
      Object.keys(REF).map(k => [k, String(REF[k].gwp), REF[k].cls, REF[k].lfl ? fmt(REF[k].lfl, 3) : "—", REF[k].fgas ? "tak" : "nie", REF[k].note])));
  add("Kontrole szczelności i zakazy (rozp. 2024/573)",
    tbl(["Ilość", "Kontrola", "Z systemem wykrywania"], [["< 5 t CO₂e", "—", "—"], ["5–50 t", "12 mies.", "24 mies."], ["50–500 t", "6 mies.", "12 mies."], ["≥ 500 t", "3 mies.", "6 mies."]]) +
    `<p>Hermetyczne (oznakowane) poniżej 10 t CO₂e: zwolnione. Po naprawie wycieku: ponowna kontrola w ciągu miesiąca. Karta urządzenia w CRO: 15 dni.</p>`);
  add("Momenty dokręcania kielichów (typowe)",
    tbl(["Średnica", "Nm"], [["1/4″", "14–18"], ["3/8″", "33–42"], ["1/2″", "50–62"], ["5/8″", "63–77"], ["3/4″", "90–110"]]) + `<p class="muted">Obowiązuje instrukcja urządzenia.</p>`);
  add("Wzory",
    `<div class="f">t CO₂e = kg · GWP / 1000
p_abs = p_man + 1,013 bar
COP_C = T_skr / (T_skr − T_par)            [K]
V [m³/h] = P [kW] · 0,86 / ΔT [K]
v = V / (π d² / 4)
Q_gruntu = Q · (1 − 1/COP)
m_max = 2,5 · LFL^1,25 · h₀ · √A
p₂ = (p₁ + 1,013) · T₂/T₁ − 1,013           [K]
L_p = L_W + 10 · log(Q / 4πr²)
I = P / (√3 · 400 · cos φ)   |   P / (230 · cos φ)</div>`);
  add("Przeliczenia",
    tbl(["Wielkość", "Przeliczenie"], [["ciśnienie", "1 bar = 100 kPa = 0,1 MPa ≈ 14,5 psi"], ["próżnia", "1 µm Hg = 0,1333 Pa; 500 µm ≈ 67 Pa ≈ 0,67 mbar"],
      ["moc", "1 kW = 3412 BTU/h; 1 TR = 3,517 kW"], ["temperatura", "T [K] = t [°C] + 273,15; t [°F] = 1,8 · t [°C] + 32"],
      ["strefy θe", "I −16 · II −18 · III −20 · IV −22 · V −24 °C"]]));
}

/* ═══════════════════════════════════════════════════════════════
   16. POSTĘPY
   ═══════════════════════════════════════════════════════════════ */
function screenPostepy(root) {
  const t = totals();
  const card = el("div", "card");
  card.appendChild(el("h1", null, "Postępy"));
  const st = el("div", "stats");
  const stat = (n, l) => { const b = el("div", "stat"); b.appendChild(el("div", "stat-n", n)); b.appendChild(el("div", "stat-l", l)); st.appendChild(b); };
  stat(passedCount() + "/" + COURSE.length, "zaliczone moduły");
  stat(String(t.seen), "rozwiązane zadania");
  stat(t.seen ? Math.round(t.ok / t.seen * 100) + "%" : "—", "skuteczność");
  stat(State.exam ? State.exam.score + "/" + State.exam.total : "—", "najlepszy egzamin");
  card.appendChild(st);
  root.appendChild(card);

  const list = el("div", "card");
  list.appendChild(el("h2", null, "Moduły"));
  COURSE.forEach((m, i) => {
    const s = modStats(m.id), p = modProgress(m.id), acc = s.seen ? s.ok / s.seen : 0;
    const row = el("div", "skill"); row.style.margin = "10px 0 14px";
    const top = el("div", "row");
    top.appendChild(el("b", null, (i + 1) + ". " + m.title));
    top.appendChild(el("div", "spacer"));
    top.appendChild(el("span", "muted", s.seen ? Math.round(acc * 100) + "% z " + s.seen + " zadań" + (p.passed ? " · zaliczony" : "") : "brak zadań"));
    row.appendChild(top);
    const bar = el("div", "bar" + (acc >= 0.75 ? " good" : "")); bar.style.marginTop = "6px";
    const f = el("i"); f.style.width = (acc * 100) + "%"; bar.appendChild(f); row.appendChild(bar);
    list.appendChild(row);
  });
  root.appendChild(list);

  const rc = el("div", "card");
  rc.appendChild(el("p", null, "Postęp zapisuje się tylko w tej przeglądarce."));
  rc.appendChild(btn("Wyzeruj postęp", "danger sm", () => {
    if (!confirm("Usunąć cały postęp kursu, wyniki i zaświadczenie?")) return;
    State = freshState();
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    Session.active = false; Session.summary = null; UI.module = null; render();
  }));
  root.appendChild(rc);
}

/* ═══════════════════════════════════════════════════════════════
   17. NAWIGACJA
   ═══════════════════════════════════════════════════════════════ */
const TABS = [["kurs", "Kurs", screenKurs], ["trening", "Trening", screenTrening], ["kalk", "Kalkulatory", screenKalk], ["sciaga", "Ściąga", screenSciaga], ["postepy", "Postępy", screenPostepy]];
function renderNav() {
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  for (const [id, label] of TABS) {
    const b = el("button", UI.tab === id ? "on" : "", label);
    b.onclick = () => {
      if (Session.active && UI.tab !== id && !confirm("Przerwać bieżącą sesję?")) return;
      if (UI.tab !== id) { Session.active = false; Session.summary = null; }
      if (id === "kurs" && UI.tab === "kurs") UI.module = null;
      UI.tab = id; render(); window.scrollTo(0, 0);
    };
    nav.appendChild(b);
  }
}
function renderHud() {
  const h = document.getElementById("hud"); h.innerHTML = "";
  const t = totals();
  const chip = (l, v) => { const c = el("div", "chip"); c.appendChild(document.createTextNode(l + " ")); c.appendChild(el("b", null, v)); h.appendChild(c); };
  chip("moduły", passedCount() + "/" + COURSE.length);
  chip("skuteczność", t.seen ? Math.round(t.ok / t.seen * 100) + "%" : "—");
}
function render() {
  renderNav(); renderHud();
  const root = document.getElementById("app"); root.innerHTML = "";
  for (const [id, , fn] of TABS) if (id === UI.tab) fn(root);
}

load();
bindKeys();
render();
</script>
</body>
</html>
