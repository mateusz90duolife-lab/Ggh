name: Restaurant OS

on:
  push:
    paths: ['restaurant-os/**', '.github/workflows/restaurant-os.yml']
  pull_request:
    paths: ['restaurant-os/**', '.github/workflows/restaurant-os.yml']

defaults:
  run:
    working-directory: restaurant-os

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Testy SQL (migracje, RLS, funkcje)
        run: npm run db:test
      - name: Przeglądarka do testów E2E
        run: npx playwright install --with-deps chromium
      - name: Testy E2E (Chromium + lokalny backend na PostgreSQL)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: restaurant-os/e2e/.artifacts
